ll see your goodness. Help me wait well. Amen."], "prayLong": ["Sit still. Think about what you’re waiting for, and how long you’ve been waiting.", "Imagine standing in a doorway, looking down a long road. You can’t see what’s at the end. You’ve been standing here for a while.", "Lord, I believe that I will see your goodness. I praise you for being faithful, even when I don’t see it yet.", "Tell him how waiting feels. You can be honest. Tired, impatient, afraid, he can hear all of it.", "Be strong, my heart. Take courage. Say it to yourself, as David did.", "Give me strength for today, not for the whole wait. Show me what to do while I wait, and keep me from running ahead of you.", "I wait for you, Lord. Amen."]}, {"devTitle": "Hope That Waits", "intro": "Paul wrote this letter to the church in Rome, explaining the good news and what it means to live by it.", "devLong": ["Romans 8 speaks about the whole of creation waiting, and about believers waiting too. We’ve been saved, but we haven’t seen everything we hope for. We live between what has begun and what is still coming.", "Paul says, we were saved in hope, but hope that is seen is not hope. Hope, by definition, points toward something we don’t yet have. If it were already in our hands, we wouldn’t need to hope.", "Then he draws the connection: if we hope for that which we don’t see, we wait for it with patience. Patience isn’t grim endurance. It’s what hope looks like when it’s still in motion.", "This reframes the waiting. We’re not wasting time. We’re living in hope, and patience is how that hope shows up in ordinary days.", "What are you hoping for that hasn’t arrived yet? Ask God to build patient hope in you."], "prayShort": ["Take a slow breath. Think of what you’re hoping for.", "Lord, I hope in what I can’t see yet. Give me patience to wait for it.", "Build hope in me that doesn’t give up. Amen."], "prayLong": ["Settle into stillness. Think of what you’re hoping for, and say it quietly to God.", "Imagine planting a seed and watching the soil. There’s nothing to see yet, but under the surface, roots are forming.", "Lord, thank you that you’ve saved me in hope. I praise you for what you’ve already done, and for what you’ve promised.", "Here is what I’m still waiting for. Tell him how long you’ve been waiting.", "I confess that I get impatient. I want to see results now. Teach me to wait without losing heart.", "Let my waiting be filled with hope, not just endurance. Remind me that you are at work even when I can’t see it.", "Give me patience, Lord. Amen."]}, {"devTitle": "Like a Farmer", "intro": "James was a leader in the early church. He wrote this letter to encourage Christians who were facing hardship.", "devLong": ["A farmer can’t rush a harvest. He plants, waters and tends, but he can’t make the seed grow faster. James uses this picture in chapter 5 to teach patience.", "Be patient, therefore, brothers, until the coming of the Lord. Behold, the farmer waits for the precious fruit of the earth, being patient over it, until it receives the early and latter rain.", "The farmer isn’t idle while he waits. He does the work in front of him. But he trusts that the rain, the sun and the soil will do what he can’t.", "Then James adds, you also be patient. Establish your hearts, for the coming of the Lord is at hand. To establish our hearts means to make them firm and settled. Patience is something that strengthens us over time.", "Where are you trying to rush something that God is doing slowly? Ask him to establish your heart while you wait."], "prayShort": ["Take a slow breath. Think of a field, planted and waiting.", "Lord, teach me to wait like a farmer who trusts the harvest.", "Establish my heart, and keep me from rushing ahead. Amen."], "prayLong": ["Sit quietly. Picture a field in early spring. The seed is in the ground, and nothing seems to be happening.", "A farmer stands at the edge of the field. He isn’t pacing, and he isn’t anxious. He’s done his part, and he’s waiting for the rain.", "Lord, thank you that you work in seasons. You’re never late, and you’re never careless with what you’ve planted.", "Here is where I’ve been trying to rush. Tell him what it is. I’ve pushed and worried, and it hasn’t made it grow.", "Forgive me for the times I’ve doubted your timing. Teach me to do what’s in front of me and trust you with the rest.", "Establish my heart, Lord. Make me steady, so that I’m not swayed by every delay.", "Thank you for the harvest you’re preparing. Amen."]}, {"devTitle": "Waiting Quietly", "intro": "Lamentations was written in a time of deep grief and loss, as the writer mourns the destruction of Jerusalem.", "devLong": ["Lamentations is a book of sorrow. It was written after great loss, and it doesn’t rush to comfort. Yet in the middle of it, there’s a clear statement of hope.", "The LORD is good to those who wait for him, to the soul who seeks him. The writer says it plainly in chapter 3, even after describing his own pain. His hope isn’t built on his circumstances. It’s built on who God is.", "Then comes the next line: it is good that a man should hope and quietly wait for the salvation of the LORD. Waiting here is quiet. It isn’t frantic, and it isn’t loud.", "Patience in pain isn’t cheerful. It’s a steady, trusting stillness. We don’t have to pretend things are fine. We can be honest about the hurt, and still wait quietly for him.", "If you’re in a hard season, you don’t have to hurry through it. Sit with God, and wait quietly. He is good to those who wait."], "prayShort": ["Take a slow breath. Be quiet before him.", "Lord, you are good to those who wait for you. I wait quietly now.", "Hold me in the stillness. Amen."], "prayLong": ["Sit still. Let silence settle around you. You don’t need to fill it.", "Think of a time of grief, or a time you’re walking through now. Imagine bringing it to God, not with words, but just by being present.", "Lord, you are good to those who wait for you, to the soul who seeks you. I praise you for that, even when I don’t feel it.", "Tell him what hurts. Say it plainly, as the writer of Lamentations did.", "Help me to wait quietly. I don’t want to rush, and I don’t want to run. I want to trust you in the stillness.", "Teach me that waiting isn’t wasted. You are at work, even when it’s quiet.", "Stay with me, Lord. Amen."]}, {"devTitle": "Don’t Give Up", "intro": "Paul wrote this letter to the churches in Galatia, encouraging them to live by the Spirit.", "devLong": ["Doing good can be tiring. We help someone and nothing seems to change. We keep showing up, and it goes unnoticed. After a while, we start to wonder if it’s worth it.", "Galatians 6:9 speaks to that. Let’s not be weary in doing good, for we will reap in due season, if we don’t give up. Paul doesn’t pretend that we won’t feel weary. He acknowledges it, and then gives us a reason to keep going.", "The reason is a harvest. It comes in due season. That’s a reminder that the timing isn’t ours. We plant, we tend, and the harvest comes when it’s time.", "The key phrase is if we don’t give up. The harvest is promised to those who keep going. It can feel unfair that results take so long, but Paul asks us to trust the one who sees what we don’t.", "Where are you tempted to give up today? Ask God to renew your strength to keep doing good."], "prayShort": ["Take a slow breath. Name where you’re tired of doing good.", "Lord, I’m weary. Help me not to give up.", "Renew my strength to keep going. Amen."], "prayLong": ["Sit still. Notice how tired you are, and where it’s coming from.", "Imagine carrying a bucket of water along a long path. You’ve walked a long way, and your arms are shaking. A friend steps beside you and takes one handle.", "Lord, thank you that you see what I do, even when no one else does. Nothing I do for you is wasted.", "Here is where I’m tempted to give up. Name it. Here is why I’m tired.", "Forgive me for the times I’ve quit because I wanted results sooner. Teach me to trust your timing.", "Renew my strength, Lord, and give me the courage to keep doing good. Show me the next small step.", "Thank you for the harvest you’re preparing. Amen."]}, {"devTitle": "Strength for the Waiting", "intro": "Isaiah was a prophet who spoke God’s word to his people. This passage encourages those who are worn out.", "devLong": ["Even the strongest people run out of energy. Isaiah 40 doesn’t pretend otherwise. Even the youths faint and get weary, and the young men utterly fall.", "If that’s true of the young and strong, then our tiredness isn’t a sign of failure. It’s part of being human. We’re not meant to run on our own power.", "Then comes the promise. But those who wait for the LORD will renew their strength. They will mount up with wings like eagles. They will run, and not be weary. They will walk, and not faint.", "Notice the order: run, and then walk. The promise isn’t only for bursts of energy. It’s also for the long, ordinary walk, the kind that doesn’t get applause.", "Where do you feel worn out today? Wait on the Lord, and ask him to renew your strength for the day ahead."], "prayShort": ["Take a slow breath. Admit where you’re tired.", "Lord, I’m worn out. Renew my strength as I wait for you.", "Help me walk and not faint. Amen."], "prayLong": ["Sit quietly and notice how your body feels. Where are you carrying tiredness?", "Imagine standing on a high cliff, with the wind rising beneath you. An eagle lifts into the air without effort, carried upward.", "Lord, I praise you because you never grow weary. You don’t get tired, and you don’t run out.", "I’m worn out in these places. Name them to him, and be specific. Tell him what has drained you.", "I wait for you, Lord. I’m not asking for a quick fix. I’m asking for renewed strength, the kind that only you give.", "Give me strength to walk today. Not a rush of energy, but steady, ordinary strength.", "Thank you for renewing me. Amen."]}, {"devTitle": "He Heard My Cry", "intro": "This psalm is attributed to David. It begins with him recalling how God answered him after a long wait.", "devLong": ["Psalm 40 begins with a testimony. I waited patiently for the LORD. He turned to me, and heard my cry. David doesn’t describe how long he waited. He tells us what happened when the waiting ended.", "God heard his cry. That’s worth pausing on. In the middle of waiting, it can feel like no one is listening. David says God turned to him and heard.", "Then he describes the rescue. He brought me up also out of a horrible pit, out of the miry clay. He set my feet on a rock, and gave me a firm place to stand.", "And he put a new song in my mouth. After the waiting comes a song, one that God himself gives.", "If you’re in the waiting right now, hold on to this testimony. God turns toward us, and he hears. Ask him for the new song he’s preparing."], "prayShort": ["Take a slow breath. Remember a time God heard you.", "Lord, I’m waiting patiently. Hear my cry, and lift me when it’s time.", "Give me a new song. Amen."], "prayLong": ["Sit still. Picture someone stuck in a deep pit, with muddy walls and no way out. They’ve been calling for help for a long time.", "Then a hand reaches down. The person is lifted out, and set on firm ground. They stand there, breathing, and a song begins to rise.", "Lord, thank you that you hear. I praise you because you turn toward us when we cry out.", "I’ve been waiting. Tell him how long, and how it has felt. Tell him what you’ve been asking for.", "I trust you to hear my cry. I trust you to lift me when it’s time. Give me patience for the waiting.", "Set my feet on a rock, Lord. Give me a firm place to stand, even before the answer comes.", "Put a new song in my mouth, and let me sing it. Amen."]}], "Wisdom": [{"devTitle": "Ask for Wisdom", "intro": "James was a leader in the early church. He wrote this letter to Christians scattered in many places, to help them live out their faith.", "devLong": ["Most of us face decisions that we don’t know how to handle: a job, a relationship, a conflict, a direction for the year. We search for answers, ask friends, and read articles. James offers a simpler first step.", "If any of you lacks wisdom, let him ask of God, who gives to all liberally and without reproach, and it will be given to him. Notice who we’re told to ask, and how he gives. God gives liberally, which means generously, and without reproach, which means without scolding us for needing it.", "Many of us hold back from asking because we feel we should already know. James says there’s no shame in lacking wisdom. The only thing that holds us back is not asking.", "He adds one condition: ask in faith, without doubting. That doesn’t mean we need perfect certainty. It means we come expecting that God is the kind of God who answers.", "What decision do you need wisdom for today? Ask him plainly, and trust that he will give it."], "prayShort": ["Take a slow breath. Name the decision in front of you.", "Lord, I need wisdom, and I’m asking. Thank you that you give generously and without scolding.", "Show me what to do, and help me trust you as I go. Amen."], "prayLong": ["Sit quietly. Let the decision you’re facing come to mind.", "Imagine standing at a well. You’ve been trying to draw water from a small cup, and it hasn’t been enough. Then you notice that the well is open to you, with no limit on how much you can take.", "Lord, thank you that you give wisdom freely. I praise you because you don’t hold it back, and you don’t make me feel foolish for asking.", "Here is what I need wisdom for. Tell him plainly. Be specific about what you don’t know.", "I confess that I’ve often relied on my own thinking first, and come to you only when I was stuck. Forgive me.", "I ask in faith. I believe that you will give. Help me to recognize your wisdom when it comes, and to act on it.", "Thank you, Lord, for answering. Amen."]}, {"devTitle": "Search for It Like Treasure", "intro": "Proverbs is a collection of wise sayings, many attributed to Solomon, written to help people live wisely before God.", "devLong": ["Treasure hunters don’t find what they’re looking for by accident. They study maps, dig in the right places, and keep searching even when it takes a long time. Proverbs 2 uses this picture to describe how we should seek wisdom.", "The passage lists a series of actions. Receive my words. Treasure up my commandments. Turn your ear to wisdom. Apply your heart to understanding. Cry out for discernment. Seek her as silver, search for her as for hidden treasure.", "Wisdom isn’t treated as something we pick up casually. It takes attention and effort. We’re invited to value it, to ask for it, and to look for it with the same energy we’d bring to something precious.", "Then verse 6 gives the source: for the LORD gives wisdom. Out of his mouth comes knowledge and understanding. The searching is real, but the wisdom comes from God. We dig, and he gives.", "How seriously are you seeking wisdom compared with other things? Ask God to give you a hunger for it, and set aside time to look for it in his word."], "prayShort": ["Take a slow breath. Ask how much you value wisdom.", "Lord, you give wisdom. I want to seek it like treasure.", "Teach me, and give me understanding. Amen."], "prayLong": ["Sit quietly. Imagine holding an old map, with a mark showing where something valuable is buried.", "You begin to dig. It takes effort, and the ground is hard. But you keep digging because you know what’s there is worth it.", "Lord, I praise you because all wisdom comes from you. Everything I need to know to live well begins with you.", "I confess that I’ve often chased other things more eagerly than wisdom. Name what you’ve pursued more than him.", "Give me a hunger for your word. Help me to listen, to treasure what you say, and to apply it.", "Show me the next place to dig. Teach me what I need for today.", "Thank you for giving wisdom. Amen."]}, {"devTitle": "Where Wisdom Begins", "intro": "This is from the book of Proverbs, where wise sayings are written to help people live well before God.", "devLong": ["We often think of wisdom as cleverness, the ability to figure things out quickly. Proverbs 9:10 gives a different starting point.", "The fear of the LORD is the beginning of wisdom. The knowledge of the Holy One is understanding. The fear of the Lord here isn’t terror. It’s a deep reverence, a recognition of who God is and who we are.", "That means wisdom starts with a posture, not a skill. Before we learn anything else, we put God in his rightful place. Everything else we learn is built on that.", "Verse 9 adds that a wise person who is given instruction becomes wiser still. Wisdom keeps growing in those who stay teachable.", "Today, ask yourself how teachable you are. Is there advice you’ve been resisting? Ask God to give you a humble, reverent heart."], "prayShort": ["Take a slow breath. Bow your heart before him.", "Lord, I honor you above everything. Teach me, and make me wise.", "Give me a teachable heart. Amen."], "prayLong": ["Sit still. Imagine standing before something enormous, like a mountain at dawn. You feel small, but not afraid.", "Lord, you are the Holy One. I praise you for your greatness, and for your knowledge that goes beyond anything I can imagine.", "I confess that I’ve sometimes put myself at the center. I’ve trusted my own judgment more than yours.", "Teach me to fear you in the right way, with reverence and love. Let that be the beginning of my wisdom.", "Help me to be teachable. Where I’ve resisted advice, soften me. Where I’ve ignored correction, humble me.", "Is there something you’ve been told that you’ve been avoiding? Ask him to help you listen.", "Thank you for instructing me, Lord. Amen."]}, {"devTitle": "A Lamp for My Feet", "intro": "Psalm 119 is a long psalm that celebrates God’s word. It’s written as a prayer of love for what God has said.", "devLong": ["When we think about guidance, we often want a floodlight. We want to see the whole road, every turn and obstacle. God’s word is described differently.", "Your word is a lamp to my feet, and a light for my path. A lamp for the feet shines a short distance, enough to show the next step. It doesn’t reveal everything ahead, but it keeps us from stumbling where we are.", "This changes what we expect from Scripture. We may not get a map of the future. We get light for the step in front of us, and that is often all we need.", "The psalmist also says that God’s words are sweeter than honey to his mouth. He doesn’t approach the word as a duty. He loves it.", "What next step do you need light for today? Open his word, and ask him to show you."], "prayShort": ["Take a slow breath. Think of the next step in front of you.", "Lord, your word is a lamp for my feet. Show me the next step today.", "Help me love what you’ve said. Amen."], "prayLong": ["Sit quietly. Imagine walking along a dark path at night, carrying a small lamp. It lights only a few steps ahead.", "Each time you take a step, the light moves with you. You don’t see the whole path, but you can see where to put your foot.", "Lord, thank you for your word. It’s sweeter than honey, and it gives understanding. I praise you for speaking to us.", "Here is the step I’m unsure about. Tell him what it is, and what feels unclear.", "Show me what your word says about it. Give me the humility to follow, even if the light only reaches one step.", "I confess that I want to see the whole road before I walk. Teach me to trust you with the next step.", "Thank you for guiding me. Amen."]}, {"devTitle": "Listen to Counsel", "intro": "This is from the book of Proverbs, which collects wise sayings to help people live well before God.", "devLong": ["Most of us are good at making plans. We think through options, weigh them, and choose. Proverbs 19 raises a question we don’t always ask: who else have we listened to?", "Listen to counsel, and receive instruction, that you may be wise in your latter end. The writer connects wisdom with how we respond to advice, and with how we end up, not just where we are now.", "Taking advice isn’t easy. It means admitting we don’t have all the answers. It means listening to people who may see things we’ve missed.", "Then comes verse 21: there are many plans in a man’s heart, but the LORD’s counsel will prevail. We can make plans, but ultimately God’s purposes stand. That should make us hold our plans with an open hand.", "Who could you ask for wisdom this week? And what plan do you need to hold more loosely before God?"], "prayShort": ["Take a slow breath. Think of a plan you’ve been holding tightly.", "Lord, make me teachable, and help me hold my plans loosely.", "Your counsel stands. Amen."], "prayLong": ["Sit quietly. Think of a plan you’re making, and imagine holding it in your hands.", "Is your grip tight or loose? Notice how that feels.", "Lord, thank you for the people you’ve placed around me, who can see what I can’t. I praise you because you give wisdom through others.", "I confess that I’ve sometimes gone ahead without asking. I’ve preferred my own plan to wise advice.", "Show me who to listen to. Give me the humility to receive counsel, even when it isn’t what I wanted to hear.", "I hold my plans loosely before you. If your counsel is different, let yours stand.", "Thank you for guiding me. Amen."]}, {"devTitle": "Wisdom for Living", "intro": "Paul wrote this letter to the church in Colossae. This passage is a prayer he offered for them.", "devLong": ["When we pray for someone we love, we often pray for their circumstances: good health, a good job, safety. Paul’s prayer for the Colossians goes deeper.", "He asks that they would be filled with the knowledge of his will in all spiritual wisdom and understanding. He’s praying for them to understand what God wants and to have the wisdom to live it out.", "Then he says why. That you may walk worthily of the Lord, to please him in all things. Wisdom isn’t only for knowing. It’s for walking, for living in a way that honors God in everyday life.", "He goes on to describe the result: bearing fruit in every good work, increasing in the knowledge of God, being strengthened with all power, and giving thanks to the Father.", "Try praying this prayer for yourself today, and for someone you love. Ask God to fill you with wisdom for how you live, not just what you know."], "prayShort": ["Take a slow breath. Pray Paul’s prayer for yourself.", "Lord, fill me with the knowledge of your will, so that I live in a way that pleases you.", "Strengthen me, and let me give thanks. Amen."], "prayLong": ["Sit still. Imagine hearing someone you trust pray over you, asking God to fill you with wisdom and understanding.", "Lord, I praise you for your will, which is good. You’re not hiding it. You want me to know it.", "Fill me with the knowledge of your will. Not just facts, but wisdom for how to live today.", "Here is an area where I need to walk worthily of you. Name it. Show me what that looks like.", "Help me to bear fruit in every good work. Let my life show who you are.", "Strengthen me with your power, for patience and endurance, with joy.", "And let me give thanks. Pray this prayer for someone else too. Name them. Thank you, Father. Amen."]}, {"devTitle": "Get Wisdom", "intro": "This is from the book of Proverbs, where a father urges his children to pursue wisdom.", "devLong": ["Some things we collect without thinking: possessions, achievements, experiences. Proverbs 4 urges us to collect something different.", "Get wisdom. Get understanding. Don’t forget, and don’t swerve from the words of my mouth. The writer tells us twice to get, and he adds a warning against forgetting. Wisdom has to be actively gained and kept.", "Verse 7 goes further: wisdom is the principal thing. Get wisdom. Yes, though it costs all your possessions, get understanding. Wisdom is presented as the thing worth the most.", "That’s a challenge in a culture that values speed, success and comfort. Wisdom often comes slowly, through listening, mistakes and time with God.", "As this week ends, ask yourself what you chase more than wisdom. Ask God to give you a growing hunger for it."], "prayShort": ["Take a slow breath. Look back over this week.", "Lord, help me value wisdom above everything else I could gain.", "Teach me, and keep me from forgetting. Amen."], "prayLong": ["Sit quietly. Think about what you’ve learned this week, and what you’ve been reminded of.", "Imagine standing in a marketplace full of things to buy. You have only limited money. You notice a small stall tucked at the back. On the sign is one word: Wisdom.", "Lord, I praise you because you are wise, and you offer wisdom to those who ask.", "I confess that I often chase what looks valuable in the moment, like comfort, approval and success. Name what you’ve chased more than him.", "Give me a hunger for wisdom. Where I’ve been careless, give me care. Where I’ve forgotten, remind me.", "Help me to keep learning, listening and growing in the week ahead.", "Thank you, Lord. Amen."]}], "Hope": [{"devTitle": "The God of Hope", "intro": "Paul wrote this letter to the church in Rome. These words are a blessing at the end of a long section of teaching.", "devLong": ["Hope can feel fragile. We hope for good news, for healing, for change, and then we’re afraid to hope too much in case we’re disappointed. Romans 15:13 is a blessing that speaks to that.", "Now may the God of hope fill you with all joy and peace in believing. Paul calls God the God of hope. Hope isn’t just something we try to produce. It comes from who he is.", "The blessing continues: that you may abound in hope, in the power of the Holy Spirit. The Spirit is the one who makes hope overflow. We’re not left to generate it on our own.", "Notice the pairing. Joy and peace come in believing. As we trust him, hope grows, and the Spirit fills us with joy and peace that we couldn’t make on our own.", "If your hope feels thin today, receive this blessing as if it were spoken over you. Ask the Spirit to fill you."], "prayShort": ["Take a slow breath. Receive this blessing for yourself.", "God of hope, fill me with joy and peace today. Let hope overflow in me by your Spirit.", "Thank you. Amen."], "prayLong": ["Sit quietly. Imagine someone speaking a blessing over you, slowly and warmly.", "Now may the God of hope fill you with all joy and peace in believing. Receive it as if it’s meant for you, because it is.", "Lord, I praise you as the God of hope. You’re the source, and hope isn’t something I need to manufacture.", "Here is where my hope has been thin. Name it to him. Tell him about the disappointments.", "Fill me, Holy Spirit. Fill me with joy where I’ve felt heavy. Fill me with peace where I’ve been anxious.", "Help me believe. Strengthen my trust so that hope can grow.", "Let hope overflow in me, for others to see. Amen."]}, {"devTitle": "A Future and a Hope", "intro": "Jeremiah was a prophet. This passage is part of a letter he sent to God’s people while they were living in exile in Babylon.", "devLong": ["Jeremiah 29 was written to people in a hard place. They’d been taken from their homes, and they were living far from everything familiar. They were waiting, and not knowing how long it would last.", "Into that situation, God speaks: I know the thoughts that I think toward you, says the LORD, thoughts of peace, and not of evil, to give you hope and a future. This was a promise given to a specific people at a specific time.", "Even so, it shows us something true about God’s character. He has purposes for his people, and they’re good. He doesn’t forget them in hard seasons.", "Then he invites them to respond. You shall call on me, and you shall go and pray to me, and I will listen to you. You shall seek me, and find me, when you search for me with all your heart.", "If you’re in a season you didn’t choose, look at this passage again. Ask God to show you what he’s doing, and seek him with all your heart."], "prayShort": ["Take a slow breath. Think of a season you didn’t choose.", "Lord, you have good purposes for me. I seek you with all my heart.", "Give me hope for the future. Amen."], "prayLong": ["Sit quietly. Think about a place in your life where you feel like you’re in exile, far from where you’d like to be.", "Imagine someone writing you a letter. It begins: I know the thoughts that I think toward you. You can almost hear the voice.", "Lord, thank you that you haven’t forgotten me. You know the plans you have, and they’re plans of peace, not harm.", "Here is the season I’m in. Tell him how it feels. Tell him what you don’t understand.", "I call on you, Lord. I pray to you. I seek you with all my heart, not just in part.", "Help me to trust that you’re at work, even when I can’t see it. Give me hope for what’s ahead.", "Thank you for listening. Amen."]}, {"devTitle": "Suffering, Endurance, Hope", "intro": "Paul wrote this letter to the church in Rome. In this section, he describes what God does in us through hard times.", "devLong": ["Nobody wants suffering. We avoid it when we can, and we pray to be rescued from it. Romans 5 doesn’t say suffering is good, but it says something surprising about what God can do with it.", "We also rejoice in our sufferings, knowing that suffering produces perseverance, and perseverance, proven character, and proven character, hope. Paul describes a chain: suffering leads to endurance, endurance to character, and character to hope.", "It’s not an automatic process. It takes place as we stay with God through the hard thing. Hope that comes this way is rooted in experience. We’ve seen him hold us.", "Then Paul says, hope doesn’t disappoint us, because God’s love has been poured into our hearts through the Holy Spirit who was given to us. Our hope doesn’t rest on circumstances. It rests on his love.", "Think about a hard season in your past. What did it build in you? Ask the Spirit to pour God’s love into your heart today."], "prayShort": ["Take a slow breath. Think of a hard season, past or present.", "Lord, pour your love into my heart. Let my hope rest in you, not in my circumstances.", "Thank you for what hard times can build. Amen."], "prayLong": ["Sit quietly. Think of a hard season you’ve come through. Notice what’s different in you now.", "Imagine a muscle that grows through use. The effort is tiring, but afterward, you’re stronger than you were.", "Lord, thank you that you don’t waste anything. I praise you because you work even in what I wouldn’t choose.", "Here is what I’m facing now. Name it to him. Tell him how hard it is.", "Build endurance in me, and build character. Make me someone who has held on to you through it.", "Pour your love into my heart by your Spirit. When I can’t feel hope, remind me that it rests on your love.", "Thank you for not disappointing me. Amen."]}, {"devTitle": "An Anchor for the Soul", "intro": "The letter to the Hebrews was written to Christians, encouraging them to hold on to their faith.", "devLong": ["A ship in a storm needs something to hold it in place. Without an anchor, it drifts wherever the wind pushes it. Hebrews 6 uses this picture for hope.", "The writer first points to what makes hope secure: God’s promise, and his oath. These are two unchangeable things in which it is impossible for God to lie. God didn’t just promise. He backed it with an oath, so that we could have strong encouragement.", "Then the image: we have this as an anchor of the soul, a hope both sure and steadfast. An anchor doesn’t stop the storm. It keeps the ship from drifting away.", "The writer adds that this hope enters into the inner place behind the curtain, where Jesus has entered as a forerunner on our behalf. Our hope isn’t only tied to the present. It reaches into the very presence of God.", "Where are you feeling like you’re drifting? Ask God to anchor you, and hold on to what he’s promised."], "prayShort": ["Take a slow breath. Notice where you feel unsteady.", "Lord, you can’t lie, and your promises hold. Be the anchor of my soul today.", "Steady me. Thank you, Jesus, for going ahead of me. Amen."], "prayLong": ["Sit still. Imagine a small boat on rough water. The waves are rising, and the boat is being pushed.", "A heavy anchor drops over the side, sinks, and catches. The boat still moves with the waves, but it doesn’t drift away.", "Lord, thank you for your promises. You are not a God who lies. What you say, you will do. I praise you for your faithfulness.", "Here is where I feel I’m drifting. Name it to him. Tell him what you’re afraid of losing.", "Anchor my soul in your hope. Let it be sure and steadfast, not dependent on how I feel.", "Thank you for Jesus, who has gone ahead of me into your presence. Because of him, I can come to you with confidence.", "Hold me, Lord. Amen."]}, {"devTitle": "Why Are You Downcast?", "intro": "This psalm is a song of longing for God, written by someone who feels discouraged.", "devLong": ["Some days our hearts feel heavy and we don’t know why. Psalm 42 is honest about that. It doesn’t cover the sadness with quick answers.", "The writer asks himself a question: why are you in despair, my soul? Why are you disturbed within me? He talks to his own soul. He isn’t pretending, and he isn’t giving in to the heaviness either.", "Then he answers: hope in God, for I will still praise him for the saving help of his presence. He doesn’t say the sadness is gone. He tells his soul where to look.", "Notice the word still. I will still praise him. Even in a low place, he expects that praise will come again. It’s a conviction that his story with God isn’t over.", "If your soul is heavy today, try speaking to it the way the psalmist does. Ask it honestly what’s wrong, and then remind it where to put its hope."], "prayShort": ["Take a slow breath. Ask your soul honestly how it is.", "Lord, my soul is heavy. I put my hope in you.", "I will still praise you. Amen."], "prayLong": ["Sit quietly. Ask your soul gently: how are you? What’s weighing on you?", "Don’t rush to fix it. Let the answer come.", "Lord, I bring you my heavy heart. Tell him what it feels like, and what you think might be behind it.", "I won’t pretend I’m not downcast. But I’ll say what the psalmist said: hope in God.", "Remind my soul of who you are. You’ve been faithful before, and you’ll be faithful again.", "I will still praise you, even if it’s quiet. Thank you for your saving help, and for your presence.", "Lift what’s heavy, Lord. Amen."]}, {"devTitle": "A Living Hope", "intro": "Peter wrote this letter to believers scattered across many regions, who were facing hardship because of their faith.", "devLong": ["Hope can be a wish, a hope that things will turn out well but with no guarantee. The hope Peter describes is different.", "Blessed be the God and Father of our Lord Jesus Christ, who according to his great mercy became our father again to a living hope through the resurrection of Jesus Christ from the dead. A living hope is rooted in a person who is alive. Jesus rose, and that changes everything.", "Peter goes on to say that this hope comes with an inheritance incorruptible, undefiled, and that doesn’t fade away, reserved in heaven for you. It can’t be spoiled or taken away.", "Then verse 5 adds that we are kept by the power of God through faith. God doesn’t just promise the inheritance. He guards us until we receive it.", "Today, thank God for the living hope you have. If your hope feels dim, ask him to keep it alive in you."], "prayShort": ["Take a slow breath. Remember that Jesus is alive.", "Lord, thank you for the living hope you’ve given me through Jesus’ resurrection.", "Keep me by your power. Amen."], "prayLong": ["Sit quietly. Think about what it means that Jesus is alive.", "Imagine a sealed gift, set aside for you, kept safe. Nobody can open it or spoil it. It’s waiting for the right time.", "Lord, I praise you for your great mercy. You gave me new life, and a hope that doesn’t die.", "Thank you for the resurrection. Because of it, I know that death isn’t the end, and that my struggles aren’t either.", "Thank you for the inheritance you’ve kept for me. I can’t see it yet, but I trust you with it.", "Here is where my hope feels dim. Tell him about it. Ask him to keep it alive.", "Guard me, Lord, by your power, through faith. Amen."]}, {"devTitle": "New Every Morning", "intro": "Lamentations was written in a time of deep grief. In this section, the writer chooses to remember what he knows about God.", "devLong": ["Lamentations 3 begins with pain. The writer describes affliction and darkness in plain terms. Then something shifts, and it’s worth noticing how.", "This I recall to my mind; therefore I have hope. He doesn’t say his circumstances changed. He says he chose to bring something to mind, and that choosing gave him hope.", "What does he recall? It is because of the LORD’s loving kindnesses that we are not consumed, because his compassion doesn’t fail. They are new every morning. Great is your faithfulness.", "Each morning brings fresh mercies. We don’t have to carry yesterday’s supply. His compassion renews itself every day.", "What do you need to call to mind today? Tell God that his mercies are new this morning, and ask him for what you need for today."], "prayShort": ["Take a slow breath. Call to mind what you know about God.", "Lord, your mercies are new this morning. Great is your faithfulness.", "Thank you for another day. Amen."], "prayLong": ["Sit still. Imagine the first light of morning coming through a window, quiet and new.", "Lord, thank you for this new day. I praise you because your mercies don’t run out. They’re fresh every morning.", "Here is what I’m carrying from yesterday. Tell him about it, and set it down.", "I choose to call to mind your faithfulness. You’ve carried me through before, and you’ve been kind in ways I didn’t notice.", "Your love never ceases, and your compassion doesn’t fail. Let that be what I remember when I feel discouraged.", "Give me what I need for today. I don’t ask for next week’s strength. Only today’s.", "Great is your faithfulness, Lord. Amen."]}], "Identity in Christ": [{"devTitle": "A New Creation", "intro": "Paul wrote this letter to the church in Corinth, a church he cared about and corrected with love.", "devLong": ["Many of us carry labels. Some were given to us by others, and some we’ve given ourselves. Failure, not enough, too much, too late. They can follow us for years and shape how we see ourselves.", "2 Corinthians 5:17 speaks directly to this. Therefore if anyone is in Christ, he is a new creation. The old things have passed away. Behold, all things have become new. Paul doesn’t say the person is improved. He says they’re new.", "The phrase in Christ is key. Our identity isn’t found in our history, our performance or other people’s opinions. It’s found in being joined to him.", "Notice the contrast. The old things have passed away. That doesn’t mean our past didn’t happen, but it no longer defines us. Something new has begun.", "Today, think about the labels you’ve carried. Bring them to Jesus, and ask him to show you who you are in him."], "prayShort": ["Take a slow breath. Think of a label you’ve carried.", "Lord, thank you for making me new. Help me live from who I am in you.", "Let the old pass away. Amen."], "prayLong": ["Sit quietly. Imagine a coat you’ve worn for years. It’s worn and heavy, and it doesn’t fit anymore.", "Jesus gently helps you take it off. In its place, he offers something new, and it fits.", "Lord, thank you that in Christ I’m a new creation. I praise you because you don’t just patch up the old. You make new.", "Here are the labels I’ve carried. Name them to him. Tell him where they came from.", "I let them go. I don’t want to be defined by my past, my mistakes or other people’s opinions.", "Help me live as someone who’s new. Teach me to see myself as you see me.", "Thank you for making all things new. Amen."]}, {"devTitle": "Saved, Then Sent", "intro": "Paul wrote this letter to the church in Ephesus, explaining what God has done for believers in Christ.", "devLong": ["If you’ve ever tried to earn someone’s approval, you know how tiring it is. We work harder, hoping to be enough. Ephesians 2 gives a very different foundation.", "For by grace you have been saved through faith, and that not of yourselves; it is the gift of God, not of works, that no one would boast. Salvation isn’t earned. It’s given. We don’t add to it, and we can’t lose it by falling short.", "Then verse 10 says what comes next. For we are his workmanship, created in Christ Jesus for good works, which God prepared before that we would walk in them. We’re saved by grace, and then made for something.", "Notice the order. The good works come after the gift, not before. We don’t do good to be accepted. We do good because we’ve been accepted.", "Where do you still try to earn God’s approval? Let it go today, and ask him to show you the good he has prepared for you."], "prayShort": ["Take a slow breath. Let go of trying to earn his love.", "Lord, I’m your workmanship. Thank you for saving me by grace.", "Show me the good works you’ve prepared. Amen."], "prayLong": ["Sit quietly. Imagine holding a gift you didn’t pay for, and can’t pay back.", "Lord, I praise you for your grace. I didn’t earn it, and I can’t. It’s a gift.", "Here is where I’ve tried to earn your approval. Name it to him: the effort, the performance, the fear of not being enough.", "I let it go. I receive your grace again, as if for the first time.", "Thank you that I’m your workmanship, made with care and with purpose.", "Show me the good works you’ve prepared. Not so that I can earn anything, but so that I can walk in what you made me for.", "Thank you, Father. Amen."]}, {"devTitle": "Called Children of God", "intro": "John wrote this letter to Christians to help them know they belong to God and to encourage them to love one another.", "devLong": ["When someone asks who we are, we usually answer with what we do, where we’re from or who our family is. John gives a deeper answer.", "Behold, what manner of love the Father has given to us, that we should be called children of God! And such we are. He points us to look at what kind of love this is, and then says we’re not just called children, but that this is what we truly are.", "Verse 1 continues: for this cause the world doesn’t know us, because it didn’t know him. If people don’t understand us, it isn’t surprising. They didn’t fully recognize him either.", "Then John adds a promise: now we are children of God, and it is not yet revealed what we will be. There’s more to come. We don’t yet see everything we’ll become.", "Today, let yourself hear it. You are a child of God. Let that be what steadies you when other voices tell you otherwise."], "prayShort": ["Take a slow breath. Let yourself hear it: you’re a child of God.", "Father, thank you for calling me your child. Help me live like it.", "Let your love be what I stand on. Amen."], "prayLong": ["Sit still. Imagine a father kneeling down to greet his child, arms wide open. The child runs into them.", "Father, I praise you for your love. I look at it now and I’m amazed. You call me your child, and that’s what I am.", "I confess that I’ve often looked to other places for my worth, like people’s approval, my achievements and how I compare.", "Name the voices you’ve listened to more than his. Set them down.", "Settle my heart in your love. Let me rest in being your child, not just working for you.", "Help me live today from that place. When I’m tempted to doubt, remind me who I belong to.", "Thank you, Father. Amen."]}, {"devTitle": "Fearfully and Wonderfully Made", "intro": "This psalm is attributed to David. It’s a prayer of wonder at how thoroughly God knows him.", "devLong": ["Many of us struggle to accept something about ourselves: our appearance, our personality, our limitations. Psalm 139 offers a different view of how we came to be.", "For you formed my inmost being. You knit me together in my mother’s womb. David says that God himself was involved in his making, with care and purpose. He wasn’t an accident or an afterthought.", "Then he responds with praise. I will give thanks to you, for I am fearfully and wonderfully made. Marvelous are your works. My soul knows well. He doesn’t only say he was made well. He thanks God for it.", "This doesn’t mean we’re perfect or that we don’t need to grow. It means our starting point is that we’re made by God, on purpose.", "What part of yourself do you find hard to accept? Tell God about it, and ask him to help you see yourself the way he does."], "prayShort": ["Take a slow breath. Thank God for how he made you.", "Lord, you made me. I praise you, because I am fearfully and wonderfully made.", "Help me see myself as you do. Amen."], "prayLong": ["Sit quietly. Imagine a craftsman bending over his work, shaping it with patient hands.", "That’s how David describes God making him. Slowly, carefully, with purpose.", "Lord, thank you that you formed me. I praise you for your works, which are marvelous.", "Here is what I struggle to accept about myself. Name it to him honestly: something about how I look, think or feel.", "I ask you to help me see it differently. You made me, and you don’t make mistakes.", "Heal where I’ve been ashamed. Teach me to receive myself as your gift to me.", "Thank you for knowing me completely, and loving me. Amen."]}, {"devTitle": "Christ Lives in Me", "intro": "Paul wrote this letter to the churches in Galatia, explaining that we are made right with God through faith in Christ.", "devLong": ["Galatians 2:20 is one of the most personal verses Paul wrote. I have been crucified with Christ, and it is no longer I who live, but Christ lives in me.", "He’s describing a change at the center of who he is. The old self-driven life has been put to death, and now Christ is the one living in him. His identity isn’t built on what he can accomplish.", "Then he adds how he lives: that life which I now live in the flesh, I live by faith in the Son of God, who loved me, and gave himself up for me. His life now is lived by trusting Jesus.", "Look at the last phrase. Who loved me, and gave himself up for me. For Paul, it was personal. Christ loved him and gave himself for him. Our identity rests on that love.", "Today, try reading this verse and putting your own name where Paul says me. Let it sink in that you are loved, and that Christ lives in you."], "prayShort": ["Take a slow breath. Read the verse slowly, as if it’s about you.", "Jesus, you love me and gave yourself for me. Live your life through me today.", "Thank you for being in me. Amen."], "prayLong": ["Sit quietly. Imagine Jesus not just beside you, but within you, at the very center.", "Jesus, thank you that you loved me and gave yourself for me. It was personal. It was for me.", "I confess that I often try to live in my own strength. I’ve tried to be good enough, strong enough, and spiritual enough.", "Here is where I’ve been relying on myself. Name it to him. Let him show you.", "I give you my life again. Live through me today, in how I speak, work and treat others.", "Help me to live by faith in you, not by effort. When I’m tired, remind me that you are in me.", "Thank you for your love, Jesus. Amen."]}, {"devTitle": "Born of God", "intro": "This is from the opening of John’s Gospel, which introduces who Jesus is and why he came.", "devLong": ["Some people spend their lives trying to belong. We want to be part of a family, a group or a place where we’re accepted. John 1 describes the way into God’s family.", "But as many as received him, to them he gave the right to become God’s children, to those who believe in his name. Becoming a child of God isn’t something we achieve. We receive it, by trusting in Jesus.", "Then John says how these children came to be: who were born, not of blood, nor of the will of the flesh, nor of the will of man, but of God. It’s not by family line, personal effort, or human decision. It’s God’s doing.", "That means this belonging doesn’t depend on our performance. It can’t be earned, and it can’t be taken away by someone else’s opinion.", "If you’ve ever felt like you don’t belong, remember that you are born of God. Thank him today for taking you into his family."], "prayShort": ["Take a slow breath. Remember that you belong to him.", "Jesus, I receive you. Thank you for making me a child of God.", "Help me live as part of your family. Amen."], "prayLong": ["Sit quietly. Imagine standing at the door of a house with the lights on and a table set. You’re not sure you’re welcome. Someone opens the door and says, come in, you belong here.", "Jesus, thank you for receiving me. I praise you because you gave me the right to become a child of God.", "I confess that I’ve often felt like an outsider. Name the places where you’ve felt you don’t belong.", "Remind me that my place in your family isn’t earned. It was given to me by you.", "Thank you that I’m born of God, not by anything I did. I receive it with gladness.", "Help me to welcome others the way you’ve welcomed me.", "Thank you, Jesus. Amen."]}, {"devTitle": "A People for His Own Possession", "intro": "Peter wrote this letter to believers scattered across many regions, who were facing hardship because of their faith.", "devLong": ["Peter writes to people who were far from home, often misunderstood and sometimes mistreated. He reminds them who they are, in a way that must have lifted their heads.", "But you are a chosen race, a royal priesthood, a holy nation, a people for God’s own possession. Four descriptions, each one rich. Chosen, royal, holy, and belonging to God. This is how God sees his people.", "Then he gives the purpose: that you may show forth the excellencies of him who called you out of darkness into his marvelous light. We’re not given this identity just for ourselves. We’re invited to show others what he’s like.", "Verse 10 adds a reminder: who in time past were no people, but now are God’s people. Once we weren’t a people, but now we are. He has gathered us.", "Today, thank God for calling you into his light. Think of one person you could show his goodness to."], "prayShort": ["Take a slow breath. Hear these words as spoken to you.", "Lord, you called me out of darkness into your light. I’m yours.", "Help me show others your goodness. Amen."], "prayLong": ["Sit quietly. Imagine stepping out of a dark room into bright, warm sunlight.", "Lord, thank you for calling me. I was once not a people, and now I belong to you. I praise you for your mercy.", "Thank you that I’m chosen, and that you wanted me. Let that sink in.", "I confess that I’ve sometimes lived as though I were still in the dark. Name where you’ve forgotten who you are.", "Remind me that I’m part of your people, your holy nation, your own possession.", "Show me how to share your goodness. Who in my life needs to hear what you’ve done? Name them to him.", "Thank you for your light. Amen."]}], "Perseverance": [{"devTitle": "Run with Endurance", "intro": "The letter to the Hebrews was written to Christians, encouraging them to keep their faith when it was hard.", "devLong": ["Long journeys are won in small steps. Anyone who has trained for something difficult knows that the hardest part is often the middle, long after the excitement has worn off.", "Hebrews 12 begins by looking back. Therefore, since we also are surrounded by so great a cloud of witnesses, let’s lay aside every weight and the sin which so easily entangles us, and let’s run with perseverance the race that is set before us.", "There are two things to put down: weights and sin. Weights aren’t always sinful. They can be good things that slow us down. Sin is what entangles us. Both get in the way of running well.", "Then comes the focus: looking to Jesus, the author and perfecter of faith. Endurance isn’t just gritting our teeth. It’s keeping our eyes on him.", "What’s weighing you down today? Lay it aside, and look to Jesus for the strength to keep going."], "prayShort": ["Take a slow breath. Think of what slows you down.", "Jesus, I fix my eyes on you. Help me run with endurance today.", "Lay down what I don’t need to carry. Amen."], "prayLong": ["Sit quietly. Imagine a long road with runners ahead of you, and others cheering from the sides.", "You notice you’re carrying a heavy pack. As you keep running, you realize you could let it drop.", "Lord, thank you for those who’ve run before me. I praise you for their faith, and for how it encourages me.", "Here are the weights I’m carrying. Name them. Here is the sin that trips me up.", "I lay them down. I don’t want to run with this on my back.", "Jesus, I look to you. You began my faith, and you will complete it. Give me strength for the next step.", "Keep me running, Lord. Amen."]}, {"devTitle": "Joy in the Testing", "intro": "James was a leader in the early church. He wrote this letter to Christians facing hardship, to help them stand firm.", "devLong": ["Nobody enjoys trials. They’re uncomfortable, and often confusing. James begins his letter with a surprising instruction.", "Count it all joy, my brothers, when you fall into various temptations, knowing that the testing of your faith produces endurance. He doesn’t say that trials are pleasant. He says that we can count them as joy because of what they produce.", "Verse 4 continues: let endurance have its perfect work, that you may be perfect and complete, lacking in nothing. Endurance has work to do in us. If we rush out of a trial, we may miss what it’s doing.", "This doesn’t mean we should seek out suffering, or pretend it doesn’t hurt. It means that God can use what we’re going through to make us steadier and more complete.", "What trial are you in? Ask God what he’s building in you through it, and ask for the faith to let endurance do its work."], "prayShort": ["Take a slow breath. Name what you’re going through.", "Lord, use this trial to build endurance in me. Help me trust what it’s producing.", "Give me joy, even in the hard. Amen."], "prayLong": ["Sit still. Think of a trial you’re facing, and let yourself feel how heavy it is.", "Imagine metal being refined in a fire. It’s uncomfortable, but impurities are burned away and what remains is stronger.", "Lord, I praise you because you don’t waste anything. You work even in what I wouldn’t choose.", "Tell him about the trial. Tell him what’s hardest about it, and what you wish would change.", "I ask for the faith to let endurance do its work. Where I’m tempted to escape, help me stay.", "Make me complete, lacking nothing. Show me what you’re building in me.", "Give me joy, Lord, even now. Amen."]}, {"devTitle": "Finish Well", "intro": "Paul wrote this letter to Timothy, a younger leader he had mentored. These words come near the end of Paul’s life.", "devLong": ["Some people are great at starting and poor at finishing. We begin with enthusiasm and fade when the novelty wears off. 2 Timothy 4 gives us a picture of someone who finished.", "I have fought the good fight. I have finished the course. I have kept the faith. Paul looks back over his life and describes it in three short statements. He doesn’t claim to have been perfect, but he stayed faithful.", "Then he looks ahead. From now on, there is stored up for me the crown of righteousness, which the Lord, the righteous judge, will give to me on that day, and not to me only, but also to all those who have loved his appearing.", "That last line matters. The crown isn’t only for Paul. It’s for all who have loved his appearing. Perseverance isn’t reserved for a few. It’s open to everyone who keeps loving him.", "How do you want to finish? Ask God to keep you faithful, one day at a time."], "prayShort": ["Take a slow breath. Think about how you want to finish.", "Lord, help me finish well. Keep me faithful to the end.", "Thank you for the crown you’ve promised. Amen."], "prayLong": ["Sit quietly. Imagine standing at the end of your life, looking back over the road you’ve walked.", "What would you want to be able to say? Hold that thought.", "Lord, I praise you because you’re faithful. You keep your promises, and you hold the end of the story.", "Here is where I’ve been tempted to quit. Name it to him. Tell him where you’ve grown tired.", "Give me strength to keep going. Help me to fight the good fight, to finish my course, and to keep the faith.", "I want to love your appearing. Keep my heart turned toward you, not only now, but all the way.", "Thank you for the hope that’s ahead. Amen."]}, {"devTitle": "Pressing On", "intro": "Paul wrote this letter to the church in Philippi, while he was in prison.", "devLong": ["We sometimes imagine that strong believers have arrived, that they’ve stopped struggling. Paul gives a different picture in Philippians 3.", "Not that I have already obtained, or am already made perfect; but I press on, if it is so that I may take hold of that for which also I was taken hold of by Christ Jesus. Paul says he hasn’t arrived. He’s still pressing on.", "Then he describes what that looks like: forgetting the things which are behind, and stretching forward to the things which are before, I press on toward the goal for the prize of the high calling of God in Christ Jesus.", "Notice the two movements. Forgetting what’s behind, and reaching toward what’s ahead. We can’t press forward while we’re still fixed on past failures, or past successes.", "What do you need to leave behind today? Ask God for the strength to keep pressing on, one step at a time."], "prayShort": ["Take a slow breath. Let go of what’s behind you.", "Lord, I haven’t arrived. I press on toward you today.", "Help me reach for what’s ahead. Amen."], "prayLong": ["Sit quietly. Imagine a runner approaching the finish line, leaning forward, with eyes on the goal.", "Lord, thank you that you’ve taken hold of me. I don’t have to earn my place. I press on because you’ve already claimed me.", "Here is what’s behind me that I need to leave there. Name it: a failure, a regret, something I’m proud of.", "I let it go. I don’t want to keep looking back.", "Show me what’s ahead. Stretch me toward what you’ve called me to.", "Give me strength to keep going, even when I’m tired. Remind me that the goal is you.", "Thank you for the prize you’ve set before me. Amen."]}, {"devTitle": "Your Work Is Not in Vain", "intro": "Paul wrote this letter to the church in Corinth. This verse closes a long section about the resurrection.", "devLong": ["Have you ever worked hard at something and wondered whether it mattered? It happens in ministry, in parenting, in jobs and in friendships. The results can be slow, or hard to see.", "Paul finishes a long chapter on the resurrection with a practical charge. Therefore, my beloved brothers, be steadfast, immovable, always abounding in the Lord’s work, knowing that your labor is not in vain in the Lord.", "The word therefore matters. Because Christ has risen, our work isn’t pointless. What we do in his name has lasting meaning, even when we can’t see it.", "We’re asked to be steadfast and immovable. Not easily shaken, because what we’re working for is real.", "Where do you feel like your effort doesn’t matter? Ask God to remind you that nothing done in his name is wasted."], "prayShort": ["Take a slow breath. Think of where you feel your work isn’t seen.", "Lord, help me stand firm. My work for you is never wasted.", "Thank you for the resurrection. Amen."], "prayLong": ["Sit quietly. Think of something you’ve worked hard on without much visible result.", "Imagine planting a seed deep in the ground. Nobody sees it, and nothing seems to happen. But it’s there.", "Lord, thank you that Christ is risen. Because of that, nothing done in your name is in vain. I praise you for it.", "Tell him where you feel discouraged. Tell him what you’ve poured yourself into.", "Make me steadfast and immovable. When I’m tempted to give up, remind me that you see.", "Help me abound in your work, not in my own strength, but in yours.", "Thank you for noticing, Lord. Amen."]}, {"devTitle": "Don’t Lose Heart", "intro": "Paul wrote this letter to the church in Corinth. In this passage, he describes how he and his companions kept going through hardship.", "devLong": ["Anyone who has been through a long, hard stretch knows how easy it is to lose heart. The body tires, the mind wears down, and hope gets thin.", "Paul says in 2 Corinthians 4: therefore we don’t faint, but though our outward man is decaying, yet our inward man is renewed day by day. He admits that the outer self wears down. But he points to something being renewed on the inside, every day.", "Then he puts our troubles in perspective: for our light affliction, which is for the moment, works for us more and more exceedingly an eternal weight of glory. He calls it light and momentary, not because it isn’t real, but because it’s small beside what’s coming.", "He ends with where to look: while we don’t look at the things which are seen, but at the things which are not seen. For the things which are seen are temporal, but the things which are not seen are eternal.", "What are you tempted to lose heart over? Ask God to renew your inner self today, and to fix your eyes on what lasts."], "prayShort": ["Take a slow breath. Admit where you’re worn down.", "Lord, renew my inner self today. Help me look at what’s eternal.", "Don’t let me lose heart. Amen."], "prayLong": ["Sit quietly. Notice how your body feels, and what has been wearing on you lately.", "Imagine a jar of clay that’s cracked and worn on the outside. Inside, a light is shining, and it’s getting stronger each day.", "Lord, thank you that you renew me from within. I praise you for working in places no one sees.", "Here is what’s wearing me down. Tell him all of it. Tell him what makes you want to give up.", "Help me to see my troubles in light of eternity. I’m not saying they don’t matter. I’m asking you to put them in their place.", "Fix my eyes on what’s unseen but lasting. Teach me to value what you value.", "Renew me today, Lord. Amen."]}, {"devTitle": "The Crown of Life", "intro": "James was a leader in the early church. He wrote this letter to Christians facing hardship, to encourage them to stay faithful.", "devLong": ["Hard times test what we’re made of. They also show what we love. James touches on both in a single verse.", "Blessed is a man who endures temptation, for when he has been approved, he will receive the crown of life, which the Lord promised to those who love him. The one who endures is called blessed, not because the trial is easy, but because of where it leads.", "Notice the last phrase: those who love him. The crown is for those who love the Lord. Endurance isn’t just surviving. It grows out of love.", "That changes how we think about perseverance. We don’t stay faithful only out of duty. We stay because we love him, and because we trust his promise.", "Today, tell the Lord that you love him, in the middle of whatever you’re facing. Ask him to help you stand the test."], "prayShort": ["Take a slow breath. Tell him you love him.", "Lord, help me love you through every trial. Thank you for the crown of life you’ve promised.", "Help me stand the test. Amen."], "prayLong": ["Sit still. Think about the hardest thing you’re facing right now.", "Imagine standing in the middle of a storm, and someone beside you says, hold on, it’s worth it.", "Lord, I love you. I say it in the middle of what’s hard. I praise you because you’re worthy of that love.", "Tell him what you’re enduring. Tell him what you’ve been tempted to do instead of staying faithful.", "Help me to stand the test. Not by my own strength, but by yours.", "Thank you for the crown of life you’ve promised to those who love you. Let that promise hold me up.", "Keep my love for you strong. Amen."]}], "Love": [{"devTitle": "What Love Looks Like", "intro": "Paul wrote this letter to the church in Corinth. This passage describes love in everyday terms.", "devLong": ["We use the word love for many things: food, movies, people, places. Paul’s description in 1 Corinthians 13 helps us see what it looks like when it’s real.", "Love is patient and is kind. Love doesn’t envy. Love doesn’t brag, is not proud, doesn’t behave itself inappropriately, doesn’t seek its own way, is not provoked, takes no account of evil. Notice that almost everything on the list is something we do, or don’t do. Love is more than a feeling. It shows up in how we act.", "Verse 6 says love doesn’t rejoice in unrighteousness, but rejoices with the truth. Love isn’t blind. It cares about what’s right, and it doesn’t pretend wrong is fine.", "Then the passage ends with four phrases: bears all things, believes all things, hopes all things, endures all things. This is love at its most steady. It doesn’t give up easily.", "Read through the list slowly today. Ask yourself which description is hardest for you, and ask God to grow it in you."], "prayShort": ["Take a slow breath. Read the list of what love is, slowly, in your mind.", "Lord, teach me to love like this. Make me patient and kind today.", "Show me where I fall short. Amen."], "prayLong": ["Sit quietly. Think about someone you love, and imagine how you’d like to treat them today.", "Lord, thank you that you are the source of love. I praise you because you love me patiently and kindly.", "Here is the description of love I find hardest right now. Tell him which one it is.", "Forgive me for the times I’ve been impatient, proud, or keeping track of wrongs. Name one now.", "Teach me to love in the way you’ve described. Not just in feeling, but in action.", "Help me to bear, believe, hope and endure, for the people in my life.", "Thank you for loving me first. Amen."]}, {"devTitle": "God Is Love", "intro": "John wrote this letter to Christians to help them walk in the light and love one another.", "devLong": ["Love can seem like something we have to generate ourselves. We try to be kind and patient and often fall short. 1 John 4 shows us where love starts.", "Beloved, let’s love one another, for love is of God. Everyone who loves has been born of God, and knows God. Our love isn’t invented by us. It comes from God, and flows through those who know him.", "Then John says something simple and deep: he who doesn’t love doesn’t know God, for God is love. He doesn’t only say God loves. He says God is love. It’s part of who he is.", "And verse 9 shows how that love appeared. By this God’s love was revealed in us, that God has sent his only born Son into the world so that we might live through him. God’s love isn’t just a statement. It’s an action.", "Thank God today for loving you first. Then ask him to love others through you."], "prayShort": ["Take a slow breath. Remember that God is love.", "God, you are love. Thank you for showing it in Jesus.", "Help me love others from what I’ve received. Amen."], "prayLong": ["Sit quietly. Think about the love you’ve received, from people and from God.", "Imagine a spring of water that never runs dry. It’s the source of every drop of love you’ve ever known.", "Lord, I praise you because you are love. It isn’t just something you do. It’s who you are.", "Thank you for sending Jesus, so that I might live through him. Thank you for what it cost.", "Here is someone I find hard to love. Name them to him. Tell him why.", "Love them through me. I can’t do it on my own, but you can.", "Fill me up again, so that I have something to give. Amen."]}, {"devTitle": "A New Commandment", "intro": "Jesus spoke these words to his disciples on the night before his crucifixion.", "devLong": ["On the last night before his death, Jesus gave his disciples a commandment. Of all the things he could have said, he chose this: a new commandment I give to you, that you love one another. Just as I have loved you, you also love one another.", "The command isn’t just to love. It’s to love as he has loved us. That sets a high bar. He loved them by serving, by teaching, by forgiving, and by giving his life.", "Then he says why it matters. By this everyone will know that you are my disciples, if you have love for one another. Love is how others will recognize his followers.", "It’s not our theology or our activities that mark us out first. It’s how we love. When believers love each other in real, practical ways, it’s visible to the world.", "Think of one person you can love the way Jesus loved you today. Ask him how."], "prayShort": ["Take a slow breath. Think of how Jesus has loved you.", "Jesus, help me love others as you’ve loved me.", "Let people see you in how I love. Amen."], "prayLong": ["Sit quietly. Recall a time Jesus showed you love: when he forgave you, helped you, stayed near.", "Imagine standing among his disciples that night, and hearing him say, love one another as I have loved you.", "Lord Jesus, thank you for loving me first. I praise you for your patience, your kindness, and your sacrifice.", "Here is someone I could love better. Name them to him. Tell him what makes it hard.", "Show me what love looks like for them today. A word, a visit, a favor, forgiveness.", "Make love the mark of my life. Let people see you through how I treat others.", "Thank you, Jesus. Amen."]}, {"devTitle": "Love in Action", "intro": "Peter wrote this letter to believers scattered across many regions, who were facing hardship because of their faith.", "devLong": ["Love isn’t just a feeling. It shows up in practical ways: in our time, our homes and our skills. 1 Peter 4 describes what that looks like.", "Above all things be earnest in your love among yourselves, for love covers a multitude of sins. Peter asks for earnest love, love that stretches and keeps going. And he says it covers many sins. Love is willing to overlook, forgive and move on.", "Then he gets practical: be hospitable to one another without grumbling. Hospitality is a simple way to love. Opening our homes, our tables and our time, without complaining.", "He adds: as each has received a gift, employ it in serving one another, as good managers of the grace of God in its various forms. Whatever God has given us, we’re to use it for others.", "Who could you serve or welcome this week? Ask God to show you what gift you can use for someone else."], "prayShort": ["Take a slow breath. Think of someone you could serve.", "Lord, help me love others earnestly and serve with what you’ve given me.", "Make me hospitable and generous. Amen."], "prayLong": ["Sit quietly. Think of the gifts God has given you: skills, time, a home, a listening ear.", "Imagine opening your door to someone who needs a place at the table. You’re glad they came.", "Lord, thank you for the grace you’ve given me. I praise you because you give generously.", "Here is a gift you’ve given me. Name it to him. Tell him how you might use it.", "Where I’ve held back, make me generous. Where I’ve grumbled, give me a willing heart.", "Show me who needs my love this week. Name them to him, and ask what to do.", "Let love cover what needs covering. Thank you, Lord. Amen."]}, {"devTitle": "Love Casts Out Fear", "intro": "John wrote this letter to Christians to help them walk in the light and love one another.", "devLong": ["Fear often shows up in our relationships. We’re afraid of being rejected, of being a burden, or of being hurt again. Because of that, we hold back from loving freely.", "1 John 4 speaks to this directly. There is no fear in love; but perfect love casts out fear, because fear has punishment. He who fears isn’t made perfect in love. When we’re afraid, it often points to a place where we haven’t yet fully received God’s love.", "Then verse 19 gives the heart of it: we love, because he first loved us. We love out of what we’ve received. We don’t have to protect ourselves anxiously, because we’re already loved.", "This doesn’t mean love is always safe. But when we know we’re held by God, we have the courage to love others, even when it’s risky.", "What fear holds you back from loving freely? Bring it to God, and ask him to fill you with the love that casts out fear."], "prayShort": ["Take a slow breath. Name a fear that holds you back.", "Lord, your love casts out fear. Help me love because you loved me first.", "Fill me so there’s no room for fear. Amen."], "prayLong": ["Sit quietly. Think of a relationship where fear has made you cautious.", "Imagine standing in a doorway, afraid to step through. Someone you trust stands behind you with a hand on your shoulder and says, go on, I’m with you.", "Lord, I praise you because your love is perfect. It doesn’t depend on my performance, and it doesn’t run out.", "Here is what I’m afraid of in loving. Tell him plainly. Name the hurt you’re protecting yourself from.", "I receive your love again. I’m held, even when I’m afraid. Help me believe it.", "Give me courage to love, even when it’s risky. Let your love push out my fear.", "Thank you for loving me first. Amen."]}, {"devTitle": "The Greatest Commandment", "intro": "This is from Matthew’s Gospel, where a teacher of the law asks Jesus a question to test him.", "devLong": ["When Jesus was asked which commandment in the law was the greatest, he didn’t hesitate. His answer was simple, and it shaped how his followers understood everything else.", "You shall love the Lord your God with all your heart, with all your soul, and with all your mind. This is the first and great commandment. Notice the words all and your. It’s a love that includes our feelings, our inner life and our thinking.", "Then Jesus adds a second commandment, and says it’s like the first: you shall love your neighbor as yourself. He ties the two together. Love for God and love for neighbor can’t be separated.", "It’s easy to claim we love God while overlooking the people around us. And it’s easy to be kind to people while neglecting God. Jesus says both belong together.", "Who is your neighbor today? Ask God to show you who he’s placed in your path, and how to love them."], "prayShort": ["Take a slow breath. Tell God you love him.", "Lord, I love you with all my heart, soul and mind. Help me love my neighbor as myself.", "Show me who needs love today. Amen."], "prayLong": ["Sit quietly. Tell God you love him in your own words, not as a formula, but as truthfully as you can.", "Lord, I love you. I want to love you more. Where my love is weak, strengthen it.", "I praise you because you loved me first, and you’re worthy of all my heart.", "Now think of the people around you, the ones you see daily and the ones you’d rather avoid. Name a few.", "Teach me to love them as I love myself, with the same patience, care and attention I give to my own needs.", "Show me one thing I can do today to love a neighbor. Give me the courage to do it.", "Thank you, Lord. Amen."]}, {"devTitle": "No Greater Love", "intro": "Jesus spoke these words to his disciples on the night before his crucifixion.", "devLong": ["We sometimes think of love as a warm feeling. Jesus defines it differently, and he does so just before he lives it out.", "This is my commandment, that you love one another, even as I have loved you. Greater love has no one than this, that someone lay down his life for his friends. In a few hours, he would do exactly that.", "That means the love he commands isn’t something he asks of us from a distance. He has already shown it. We’re asked to love as he has loved, and he went first.", "We may not be asked to lay down our lives, but we’re asked to lay down things: our time, our preferences, our comfort, our pride. Love often costs something.", "What could you lay down for someone today? Ask Jesus to give you a love like his."], "prayShort": ["Take a slow breath. Remember what Jesus gave for you.", "Jesus, thank you for laying down your life for me. Help me love others like that.", "Show me what to give today. Amen."], "prayLong": ["Sit quietly. Think slowly about what it cost Jesus to love you.", "Jesus, I praise you. You gave everything for people who didn’t deserve it, including me.", "Thank you for calling me your friend. I don’t take that lightly.", "Here is someone I’m called to love. Name them. Tell him what that might cost: my time, my comfort, my pride.", "Help me to lay something down for them today. Not because I have to, but because you did it for me.", "Where I’ve loved only when it was easy, stretch me. Where I’ve been self-protective, soften me.", "Thank you, Jesus. Amen."]}], "Humility": [{"devTitle": "Count Others More Significant", "intro": "Paul wrote this letter to the church in Philippi, while he was in prison.", "devLong": ["We’re often taught to look out for ourselves first. Our culture rewards confidence, ambition and standing out. Paul gives a different instruction in Philippians 2.", "Do nothing from selfish ambition or conceit, but in humility consider others as more significant than yourselves. Each of you should not look to his own interests, but each of you also to the interests of others.", "Humility isn’t thinking poorly of ourselves. It’s thinking about ourselves less, and turning our attention to others. It’s noticing what someone else needs, instead of only tracking our own.", "This isn’t easy. Selfish ambition is subtle, and it can show up even in good work. We want credit, or to be seen as right. Paul asks us to let that go.", "Whose interests could you look to today? Ask God to give you eyes for others’ needs."], "prayShort": ["Take a slow breath. Notice where self-interest shows up in your day.", "Lord, free me from selfish ambition. Help me see others’ needs.", "Make me humble. Amen."], "prayLong": ["Sit quietly. Think of the day ahead, and the people you’ll meet.", "Imagine seeing each of them with fresh eyes, as people with their own struggles, hopes and needs.", "Lord, thank you for the humility of Jesus. I praise you because you put others first, and you showed me how.", "I confess the places where I’ve been driven by ambition, or by a need to be seen. Name them to him.", "Teach me to count others as more significant. Not in a forced way, but out of real care.", "Show me whose interests I can look to today. Give me eyes to notice and a heart to act.", "Thank you, Lord. Amen."]}, {"devTitle": "God Gives Grace to the Humble", "intro": "James was a leader in the early church. He wrote this letter to Christians to help them live out their faith.", "devLong": ["Pride is one of the hardest sins to see in ourselves. It disguises itself as confidence, independence or self-reliance. James cuts through it in chapter 4.", "God resists the proud, but gives grace to the humble. Notice the contrast. The proud meet resistance. The humble receive grace. That’s a powerful reason to choose humility.", "Then James gives a series of instructions. Be subject therefore to God. Resist the devil, and he will flee from you. Draw near to God, and he will draw near to you. Humility starts with submitting to God, and moves toward him.", "Verse 10 closes with a promise: humble yourselves in the sight of the Lord, and he will exalt you. We’re asked to humble ourselves. Lifting up is God’s part.", "Where is pride getting in the way of your relationship with God, or with others? Draw near to him today, and ask for his grace."], "prayShort": ["Take a slow breath. Bow your heart before God.", "Lord, I humble myself before you. Draw near to me.", "Give me your grace, and lift me in your time. Amen."], "prayLong": ["Sit still. Imagine kneeling quietly before a king who is kind and good.", "Lord, I praise you because you give grace to the humble. I need that grace.", "I confess the pride in my heart. Name where it shows up: in how you handle correction, how you compare, how you want to be seen.", "I submit myself to you. I’m not in charge, and I don’t want to be.", "Draw near to me, as you’ve promised. I’m coming close to you
