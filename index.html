 now.", "Lift me up in your time, not mine. I trust you with that.", "Thank you for your grace. Amen."]}, {"devTitle": "Walk Humbly", "intro": "Micah was a prophet who spoke God’s word to his people. This verse sums up what God asks of them.", "devLong": ["People have always wondered what God wants. Do we need to do great things, make big sacrifices, or follow complicated rules? Micah answers in one verse.", "He has shown you, O man, what is good. What does the LORD require of you, but to act justly, to love mercy, and to walk humbly with your God? Three simple things, and each one can be lived today.", "Act justly means treating people fairly, speaking up for what’s right. Love mercy means caring about kindness, not just correctness. And walk humbly with your God.", "The word walk suggests something steady and daily. Humility isn’t a single act. It’s a way of moving through life, alongside God, not ahead of him or in place of him.", "Which of these three do you most need to grow in? Ask God to help you walk with him humbly today."], "prayShort": ["Take a slow breath. Walk with God in your mind through today.", "Lord, help me do justice, love mercy, and walk humbly with you.", "Keep me close to you. Amen."], "prayLong": ["Sit quietly. Imagine walking beside God on a quiet path, at an easy pace.", "Lord, thank you that you’ve shown me what’s good. I don’t have to guess.", "Teach me to act justly. Show me where I’ve been unfair, or where I’ve stayed silent when I should have spoken.", "Teach me to love mercy. Soften my heart toward those who need kindness, including those I find hard.", "And teach me to walk humbly with you. Keep me from running ahead, or lagging behind. Keep me at your side.", "Which of these three do I most need today? Ask him, and listen.", "Thank you for walking with me, Lord. Amen."]}, {"devTitle": "The Greatest Is the Servant", "intro": "This is from Matthew’s Gospel, where Jesus teaches the crowds and his disciples about leadership.", "devLong": ["In most places, greatness is measured by status: titles, influence, recognition. Jesus turns this around in Matthew 23.", "But he who is greatest among you will be your servant. Whoever will exalt himself will be humbled, and whoever will humble himself will be exalted. In his kingdom, the one who serves is the one who is great.", "That isn’t how people usually think. We tend to admire those who have the most, who are noticed, who are in charge. Jesus says real greatness shows up in service.", "It also changes how we think about being unseen. The quiet work, the unnoticed help, the small acts of care, they matter to him.", "Where do you want credit today? Offer it to God, and ask him for a servant’s heart."], "prayShort": ["Take a slow breath. Think of where you want to be noticed.", "Jesus, teach me to serve. I don’t need to be seen.", "Give me a servant’s heart. Amen."], "prayLong": ["Sit quietly. Think of someone who serves quietly, without being asked or thanked.", "Imagine doing something helpful for someone, and no one ever knowing it was you. Notice how that feels.", "Jesus, I praise you because you came not to be served, but to serve. You’re the greatest, and you chose to wash feet.", "I confess the times I’ve wanted recognition. Name where you’ve wanted credit.", "I offer that to you. I don’t need to be noticed. Your eyes on me are enough.", "Show me who I can serve today. Give me a quiet, willing heart.", "Thank you for your example. Amen."]}, {"devTitle": "Two Men Who Prayed", "intro": "This is a story Jesus told in Luke’s Gospel, about two men who went to the temple to pray.", "devLong": ["Jesus told this story to some who were confident in their own righteousness and looked down on everyone else. It’s short, and it hits hard.", "Two men go up to the temple to pray. One is a Pharisee, and the other is a tax collector. The Pharisee stands and prays about himself, thanking God that he’s not like other people. He lists his good works.", "The tax collector stands far away, and won’t even lift his eyes to heaven. He beats his chest and says, God, be merciful to me, a sinner. There are no excuses, no comparisons. Only honesty.", "Jesus says the tax collector went down to his house justified rather than the other. For everyone who exalts himself will be humbled, but he who humbles himself will be exalted.", "Where do you compare yourself to others? Come to God today without defenses, and ask for his mercy."], "prayShort": ["Take a slow breath. Come to God without comparing yourself to anyone.", "God, be merciful to me, a sinner.", "Thank you for hearing me. Amen."], "prayLong": ["Sit still. Imagine two figures standing in a large room. One stands tall, speaking confidently. The other stands at the back with his head down.", "Which one are you today? Be honest.", "Lord, I come to you as I am. I don’t have a list to present. I’m not better than anyone else.", "Here is where I compare myself to others. Name it. Here is where I’ve felt superior, or have wished I could be.", "God, be merciful to me, a sinner. I mean it. I need your mercy every day.", "Thank you that you hear the humble. You don’t turn away from honest hearts.", "Send me out justified by your grace, not my own record. Amen."]}, {"devTitle": "The Mind of Christ", "intro": "Paul wrote this letter to the church in Philippi, while he was in prison.", "devLong": ["Imagine having every right and every power, and choosing to lay it down for others. That’s what Philippians 2 describes about Jesus.", "Let this mind be in you, which was also in Christ Jesus, who, existing in the form of God, didn’t consider equality with God a thing to be grasped, but emptied himself, taking the form of a servant, being made in the likeness of men.", "The passage goes on to say that he humbled himself, becoming obedient to death, yes, the death of the cross. He didn’t just come down a little. He came all the way down.", "This is the model for our humility. Not that we think poorly of ourselves, but that we have the mind of Christ, willing to give up what we could claim, for the sake of others.", "What do you find hard to give up? Ask Jesus to give you his mindset."], "prayShort": ["Take a slow breath. Think about what Jesus gave up for you.", "Jesus, you humbled yourself for me. Give me your mindset.", "Teach me to serve. Amen."], "prayLong": ["Sit quietly. Think slowly about what Jesus left, and what he took on.", "Jesus, I praise you. You had every right, and you chose to serve. You chose the cross for me.", "Thank you for humbling yourself. I can’t fully understand it, but I receive it with gratitude.", "Here is what I find hard to give up: my rights, my reputation, my comfort, my way. Name it to him.", "Give me your mind. Teach me to let go of what I’m clutching, for the sake of others.", "Show me one place today where I can choose to serve instead of being served.", "Thank you, Jesus. Amen."]}, {"devTitle": "Wash One Another’s Feet", "intro": "This is from John’s Gospel. It takes place on the night before Jesus’ crucifixion, with his disciples.", "devLong": ["Washing feet was a job for servants. Roads were dusty, people wore sandals, and someone had to clean the feet of guests. Nobody expected a teacher to do it. On the night before his death, Jesus did.", "After washing their feet, he asks them, do you know what I have done to you? You call me Teacher and Lord. You say so correctly, for so I am. They called him Lord, and he was. Yet he served them.", "If then I, the Lord and the Teacher, have washed your feet, you also ought to wash one another’s feet. For I have given you an example, that you should do as I have done to you.", "Humility, then, looks like doing the lowest task for others. It doesn’t wait to be asked, and it doesn’t need an audience.", "What might washing someone’s feet look like for you this week? Ask Jesus to show you."], "prayShort": ["Take a slow breath. Picture Jesus kneeling with a towel.", "Jesus, you washed my feet. Show me how to serve like you.", "Give me a servant’s hands. Amen."], "prayLong": ["Sit quietly. Imagine the room where the disciples are gathered. Jesus gets up, takes a towel and a basin, and begins to wash their feet.", "Now imagine he comes to you. You might resist, as Peter did. Let him do it.", "Lord Jesus, thank you for serving me. I praise you because you are Lord, and you stooped lower than anyone.", "Here are the tasks I think are beneath me. Name them. Here is the person I find hard to serve.", "Forgive my pride. I want to follow your example, not just admire it.", "Show me one way to wash someone’s feet this week, a practical, quiet act of service.", "Thank you for the example you set. Amen."]}], "Rest": [{"devTitle": "Come to Me and Rest", "intro": "This is from Matthew’s Gospel, where Jesus speaks directly to people who are tired and burdened.", "devLong": ["Few invitations are as welcome as the one Jesus gives in Matthew 11. Come to me, all you who labor and are heavily burdened, and I will give you rest.", "Notice who he’s speaking to. Not the strong, the successful or the well-rested. He addresses those who are weary and weighed down. If you’re tired, this is for you.", "Then he says, take my yoke upon you, and learn from me, for I am gentle and lowly in heart, and you will find rest for your souls. A yoke is something that joins two animals together to share a load. Jesus invites us to be joined with him, and to learn from him.", "He adds: for my yoke is easy, and my burden is light. This doesn’t mean there’s no work. It means that with him, the work is shared, and it’s gentle.", "What are you carrying that’s wearing you out? Come to him with it today, and receive the rest he offers."], "prayShort": ["Take a slow breath. Admit that you’re tired.", "Jesus, I’m weary. I come to you for rest.", "Take my burden and give me yours. It’s light. Amen."], "prayLong": ["Sit quietly. Let your shoulders drop, and your breathing slow. Notice how tired you are.", "Imagine standing at the edge of a long road you’ve walked for a while. Jesus stands beside you and says, come to me.", "Lord Jesus, I praise you because you’re gentle and humble in heart. You don’t scold the weary. You welcome them.", "Here is what I’ve been carrying. Tell him about it, and be specific about what’s heavy.", "I take your yoke. I want to learn from you and to walk with you, so that I’m not pulling alone.", "Give me rest for my soul, Lord. Not only a day off, but a deep rest from striving.", "Thank you for your invitation. Amen."]}, {"devTitle": "My Soul Rests in God Alone", "intro": "This psalm is attributed to David. It’s a prayer of trust in God.", "devLong": ["Where does your soul go to rest? When life is heavy, we often look to distractions, achievements or other people. Psalm 62 points somewhere else.", "My soul waits in silence for God alone. From him comes my salvation. He alone is my rock and my salvation, my fortress. I will not be greatly shaken. David says his soul waits in silence, and that’s the beginning of rest.", "Notice the word alone. David isn’t saying other things have no value. He’s saying that when it comes to true security, only God holds.", "And notice the three names: rock, salvation and fortress. Each one speaks of safety. A rock is steady, salvation is rescue, and a fortress is protection.", "Where are you looking for rest today? Be quiet before God, and let your soul settle in him."], "prayShort": ["Take a slow breath. Be quiet before God.", "Lord, my soul finds rest in you alone. Hold me steady.", "Be my rock and my fortress. Amen."], "prayLong": ["Sit still. Let silence settle. You don’t need to say anything yet.", "Imagine standing on a large flat rock, with a strong wall around you. Wind is blowing outside, but it doesn’t reach you.", "Lord, I praise you as my rock, my salvation and my fortress. I won’t be greatly shaken, because you hold me.", "Here is where I’ve been looking for rest in other places: busyness, entertainment, approval. Name them to him.", "I come back to you. My soul waits in silence for you. Quiet my heart.", "Hold me steady today. When I’m tempted to run to other things, bring me back.", "Thank you for being enough. Amen."]}, {"devTitle": "He Gives Sleep to His Beloved", "intro": "This psalm is a short song about trusting God in work and in daily life.", "devLong": ["Some of us work very hard. We rise early, stay up late, and carry the weight of everything that depends on us. Psalm 127 offers a gentle challenge.", "Unless the LORD builds the house, they labor in vain who build it. Unless the LORD watches over the city, the watchman guards it in vain. Our work matters, but it isn’t what holds things together.", "It is vain for you to rise up early, to stay up late, eating the bread of toil; for he gives sleep to his loved ones. The psalm doesn’t say hard work is wrong. It says that anxious, driven toil can’t secure what only God can give.", "Notice the last line: he gives sleep to his loved ones. Rest is a gift from a Father who loves us. We don’t have to earn it.", "Where are you working from anxiety? Ask God to give you rest, and trust that he holds what you can’t."], "prayShort": ["Take a slow breath. Let go of what you’re trying to hold together.", "Lord, I can’t build or guard anything without you. I rest in you.", "Thank you for giving rest to those you love. Amen."], "prayLong": ["Sit quietly. Think about what you’ve been working on, and how tightly you’ve been holding it.", "Imagine a builder laying bricks all day, worried that the house won’t stand. Then he notices that someone far greater is building alongside him.", "Lord, I praise you because you are the one who builds, and the one who watches over. My work matters, but it isn’t what holds the world together.", "Here is where I’ve been working from anxiety. Name it to him. Tell him what you’re afraid will fall apart.", "I give it back to you. Show me what’s mine to do, and what’s yours.", "Give me rest as a gift, not as a reward. Help me sleep, and help me stop.", "Thank you for loving me. Amen."]}, {"devTitle": "Come Away and Rest", "intro": "This is from Mark’s Gospel. It describes a moment after Jesus’ disciples returned from a time of ministry.", "devLong": ["Even people who are doing good work get tired. In Mark 6, the apostles return to Jesus and tell him everything they’ve done and taught. They’ve been busy, and it’s been fruitful.", "Jesus responds in a way that might surprise us. Come away by yourselves into a deserted place, and rest awhile. For there were many coming and going, and they had no leisure so much as to eat. He doesn’t push them to do more. He invites them to rest.", "Notice that it’s Jesus who leads them to rest. It isn’t laziness, and it isn’t a luxury. It’s part of following him.", "That means rest is a spiritual practice. If even the disciples needed to step away, so do we. Constant activity, even for good things, can wear us out.", "Where do you need a quiet place this week? Ask Jesus to help you take it."], "prayShort": ["Take a slow breath. Imagine Jesus inviting you to come away.", "Jesus, you invite me to rest. Help me take it.", "Lead me to a quiet place. Amen."], "prayLong": ["Sit still. Imagine a quiet place by the water, away from the crowd. Jesus is there, waiting.", "He says to you, come away and rest awhile. There’s no hurry.", "Lord, thank you for inviting me to rest. I praise you because you don’t push me beyond what I can bear.", "Tell him how busy you’ve been. Tell him what has been pulling at you.", "I confess that I often skip rest because I feel it’s unproductive. Forgive me for ignoring what you offer.", "Show me how to rest this week. A quiet hour, a walk, a day off. Help me make room for it.", "Thank you for caring for my body and my soul. Amen."]}, {"devTitle": "Remember the Sabbath", "intro": "This is part of the Ten Commandments, which God gave to his people through Moses.", "devLong": ["Rest isn’t an afterthought in the Bible. It’s written into the commandments. Exodus 20 gives it a place right alongside the others.", "Remember the Sabbath day, to keep it holy. You shall labor six days, and do all your work, but the seventh day is a Sabbath to the LORD your God. One day in seven is set apart, a rhythm of work and rest.", "The commandment reaches wide. In it you shall not do any work, you, nor your son, nor your daughter, your male servant, nor your female servant, nor your livestock, nor your stranger who is within your gates. Rest is meant for everyone in the household.", "Then it gives the reason: for in six days the LORD made heaven and earth, the sea, and all that is in them, and rested the seventh day. God himself rested. Rest is built into the pattern of creation.", "What might a day of rest look like for you? Ask God to help you keep a rhythm of work and rest."], "prayShort": ["Take a slow breath. Thank God for the gift of rest.", "Lord, thank you for the gift of rest. Help me honor it.", "Teach me the rhythm of work and rest. Amen."], "prayLong": ["Sit quietly. Think about your week, and how rest fits in. Does it have a place?", "Imagine stepping into a day with no demands. The work is set down, and the day is simply open.", "Lord, I praise you as Creator, who made everything and rested. You’re not like a boss who never lets up.", "Here is what keeps me from resting. Name it: guilt, busyness, fear of falling behind.", "Forgive me for treating rest as optional. Teach me that it’s part of how you made the world, and me.", "Show me what a day of rest could look like. Help me guard it, and help the people around me rest too.", "Thank you for the gift of Sabbath. Amen."]}, {"devTitle": "Resting from Our Own Works", "intro": "The letter to the Hebrews was written to Christians, encouraging them to stay faithful to Jesus.", "devLong": ["Many of us carry a quiet belief that we have to keep earning our place. We keep working, performing and proving, hoping that it will be enough. Hebrews 4 points to a different kind of rest.", "There remains therefore a Sabbath rest for the people of God. For he who has entered into his rest has himself also rested from his works, as God did from his. There’s a rest still available to God’s people, one that goes beyond a day off.", "This rest means ceasing from our own striving. We rest because we trust what God has done, not because we’ve done enough.", "Then verse 11 says: let’s therefore give diligence to enter into that rest. It’s an odd phrase, to work at resting. It suggests that letting go of self-effort takes intention. We have to choose to trust him.", "Where are you trying to earn what he’s already given? Rest from that today."], "prayShort": ["Take a slow breath. Let go of what you’re trying to prove.", "Lord, I rest from my own efforts. I trust what you’ve done.", "Bring me into your rest. Amen."], "prayLong": ["Sit still. Notice how much of your tension comes from needing to be enough.", "Imagine laying down a heavy ledger where you’ve been keeping track of all you’ve done and all you should have done. You set it down, and you feel lighter.", "Lord, thank you that the work is finished. In Christ, you’ve done what I couldn’t do. I praise you for it.", "Here is where I’ve been trying to earn your approval. Name it. Tell him how tired it’s made you.", "I rest from my own works. I receive what you’ve given as a gift.", "Help me to enter your rest, and to keep trusting when I’m tempted to strive again.", "Thank you for your finished work. Amen."]}, {"devTitle": "Return to Your Rest", "intro": "This is a psalm of thanks to God for rescuing the writer in a time of distress.", "devLong": ["Sometimes the most helpful thing we can do is talk to our own soul. Psalm 116 shows us one way.", "The writer first reflects on who God is. The LORD is gracious and righteous. Yes, our God is merciful. The LORD preserves the simple. I was brought low, and he saved me. He remembers how God cared for him when he was weak.", "Then he says something to himself: return to your rest, my soul, for the LORD has dealt bountifully with you. He tells his own soul to go back to rest, and gives the reason. God has been good to him.", "The phrase return to your rest suggests that rest is a place we can go back to, and that we leave it sometimes. When we get anxious, busy or afraid, we can return.", "Today, try telling your soul to rest. Remind it of what God has done, and let it settle."], "prayShort": ["Take a slow breath. Speak gently to your own soul.", "Lord, you’ve been good to me. My soul returns to its rest in you.", "Thank you for caring for me. Amen."], "prayLong": ["Sit quietly. Imagine speaking gently to someone you love who’s overwhelmed. Now speak that way to yourself.", "Return to your rest, my soul. Say it quietly.", "Lord, I praise you as gracious, righteous and merciful. You’ve been all of that to me.", "Think of a time when you were low and he lifted you. Thank him for it, specifically.", "Here is where my soul has been restless. Tell him about it. Tell him what has pulled you away from rest.", "I come back to you now. I choose to rest, because you’ve dealt well with me.", "Thank you, Lord, for being my resting place. Amen."]}]};
THEMES.forEach(t => (EXTRA_ALL[t.name]||[]).forEach((x,i) => Object.assign(t.days[i], x)));
const PRAYERS_ALL = {"Trust": [{"prayShort": ["Take a slow breath. Hear the verse as if it were spoken to you: trust in the LORD with all your heart.", "Lord Jesus, I’ve been leaning on my own understanding, on my plans and my reading of the situation. I choose to trust you with all my heart today, not just the parts that make sense.", "I acknowledge you in my ways. Name the decision in front of you and bring it to him now.", "Make my paths straight, Lord. I’m not asking to see the whole road, only to know you’re directing it. Amen."], "prayLong": ["Take a slow breath. Let your shoulders drop. For a few minutes there’s nothing to fix and nothing to figure out.", "Picture a place where the road forks. You can’t see far down either path, and the signpost is too far to read. You’ve been standing here longer than you’d like. Now picture Jesus standing beside you, unhurried, knowing both roads.", "Lord, your word says to trust in you with all my heart. Not with part of it. I praise you because you are wise and your wisdom never runs out. You see the beginning and the end of my road.", "Here is the decision I’ve been turning over. Name it to him now. Say what you’ve been hoping to figure out before you trust.", "The verse says not to lean on my own understanding. I confess that I do. I lean on my plans, my experience and my read of the situation, and when they wobble, so do I. Forgive me for putting my weight on the wrong thing.", "Thank you for the times you’ve led me when I couldn’t see the way. Bring one of them to mind now, and thank him for it.", "I acknowledge you in all my ways, Lord, not only in the decisions that feel spiritual, but in the ordinary ones today. Remind me to bring you into the room before I’ve already decided.", "Make my paths straight. You haven’t promised an easy road or a clear view. You’ve promised to direct it. Give me peace when I don’t understand, and courage to keep walking.", "Rest in this: you don’t have to see the whole road. You only have to trust the one who does. In Jesus’ name, amen."]}, {"prayShort": ["Take a slow breath. You can say plainly what you’re afraid of.", "Lord, David said, when I am afraid, I will put my trust in you. I’m afraid of some things today, and I won’t hide them from you. Name them now.", "I trust you in the middle of this fear, not after it’s gone. I praise your word, and I hold on to what you’ve said.", "What can flesh do to me when you are with me? Settle me, Lord, and give me courage for the next step. Amen."], "prayLong": ["Find a quiet place, even in your mind. Let your breath slow. There’s no need to be strong here.", "Imagine a night when you couldn’t sleep because something weighed on you. Every fear seems louder in the dark. Now imagine saying its name out loud to God, not tidy and not polished, just honest.", "Lord, David wrote, when I am afraid, I will put my trust in you. He didn’t say if. He said when. Thank you that you don’t turn away people who are afraid.", "Here is what I’m afraid of. Say it to him now, one fear at a time. The ones you’ve told people about, and the ones you haven’t.", "I’m not going to wait until the fear is gone before I trust you. I’m choosing it now, with my heart still racing. In you I put my trust.", "David praised God’s word. So I bring you what you’ve said: that you are with me, that you hold me, that your promises don’t shake. Remind me of one of your promises now, and hold on to it.", "David asked, what can flesh do to me? Forgive me for the times I’ve let people’s opinions or threats loom larger than you. Whatever they say or do, you still have the last word.", "Steady me, Lord. Give me courage for today and for the next step, and no more than that.", "Be still for a moment. Let him hold what you’ve handed him. Thank you, God, for being near. In Jesus’ name, amen."]}, {"prayShort": ["Take a slow breath. Let your thoughts settle, like water in a glass.", "Lord, you keep in perfect peace the one whose mind is steadfast, because he trusts in you. My mind runs in many directions today. Fix it on you.", "You are an everlasting rock. People change and plans fall through, but you don’t.", "When my thoughts wander today, bring me back, again and again. I trust you. Amen."], "prayLong": ["Sit still for a moment. Notice your body, and notice where your thoughts keep going.", "Imagine your mind as a room with every window open and a strong wind blowing through. Papers are flying everywhere, and you chase one thought only to lose another. Now imagine Jesus gently closing the windows, one at a time. The room goes quiet.", "Lord, your word says you keep in perfect peace the one whose mind is steadfast. Thank you that this peace isn’t only for people with calm lives. It’s tied to where the mind rests.", "Here is what keeps pulling my mind away from you. Name the worries and the replays, the tasks and the tabs I keep open. Hand each one over.", "I confess that I’ve trusted my worrying to protect me, as if going over it again would solve it. Teach me instead to bring it to you and leave it there.", "Make my mind steadfast. I don’t need it never to wander. I need it to come back. When I drift, call me home, gently.", "The verse says to trust in the LORD forever, because you are an everlasting rock. I praise you for being the same today as you were yesterday and as you’ll be tomorrow. Nothing in my week can move you.", "Keep me in perfect peace, Lord, not because of what I can see, but because of who you are. Stay here a moment and let it settle. Thank you, Jesus. Amen."]}, {"prayShort": ["Take a slow breath. Picture a tree beside a stream, its roots reaching down into the water.", "Lord, you promise that the one who trusts you is like a tree planted by water. Root me in you.", "When the heat comes, let me still be green. When the drought comes, don’t let me be anxious or stop bearing fruit.", "Draw me back to the habits that keep me near the stream. Thank you for being my source. Amen."], "prayLong": ["Take a moment to be quiet. Imagine you’re walking beside a stream on a hot day.", "A tree stands at the water’s edge, its roots running down into the bank, its leaves green and full. Across the field, another tree stands in dry ground, struggling in the heat. You feel the heat on your own skin, and you know which tree you want to be.", "Lord, Jeremiah says the one who trusts in you is like a tree planted by the water, sending out its roots by the stream. Thank you for being the stream. Everything I need to live comes from you, and you never run dry.", "I confess that some days I’ve tried to live from my own supply. I’ve gone through my days without stopping to drink from you, and then been surprised that I’m tired and dry.", "Show me the habits that keep my roots near the water: prayer, your word, gathering with other believers. Name the one that has slipped. Help me restart it, even if it feels ordinary.", "Roots grow slowly, out of sight. Build them in me on ordinary days, so that they hold on hard ones.", "The verse says the tree doesn’t fear when heat comes, and in a year of drought it isn’t anxious. Prepare me now, Lord, so that when the heat comes I’m not shaken.", "And let me keep bearing fruit, even when I can’t see why. Not so that people notice, but so that others find shade and rest.", "Be still and picture your roots reaching down. Let yourself drink. Thank you, Father. In Jesus’ name, amen."]}, {"prayShort": ["Take a slow breath. Open your hands and let go of what you’ve been clutching.", "Lord, your word says to trust in you and do good, to delight myself in you, and to commit my way to you.", "There’s something I’ve been trying to control. I commit it to you now. I roll it off my shoulders and onto yours.", "Be my delight more than anything I’m asking for. You will act, in your way and in your time. Amen."], "prayLong": ["Take a moment to be still. Open your hands on your lap, palms up.", "Imagine you’ve been carrying a heavy bag for a long time. Your arms ache, but you’ve been afraid to put it down. Jesus kneels beside you and waits, quietly asking whether you’ll let him carry it.", "Lord, your word says to trust in you and do good. Show me the next right thing to do today while I wait. Not to earn anything, but because I belong to you.", "It says to delight myself in you. I confess that I often delight more in what I want from you than in you. Turn my heart. Make you my joy.", "The word is commit your way to the LORD. Here is what I’ve been trying to control. Say it to him now. I stop gripping it, and I set it in your hands.", "The verse promises, he will do it. I don’t know how, and I don’t know when. I only know that you are good and your timing isn’t late.", "You say you will bring forth my righteousness like the light. Where I’ve been misunderstood or hurt, or where I can’t see the end, let what is right shine in the end.", "Rest here for a moment, with your hands open. Thank you, Lord, that I don’t have to carry everything. Amen."]}, {"prayShort": ["Take a slow breath. You don’t have to be certain to come to Jesus.", "Lord, I believe. And like the father in this story, I also have doubts. I won’t pretend otherwise.", "Help my unbelief. Where my faith feels small, meet me. Where I’m afraid to hope, give me courage.", "Thank you that you didn’t turn him away for being honest. Strengthen my trust today, one step at a time. Amen."], "prayLong": ["Sit quietly. Let go of the need to sound spiritual.", "Imagine the crowd pressing around Jesus, and a tired father stepping forward, his son at his side. He’s tried everything. Jesus says that all things are possible for the one who believes, and the man’s heart breaks open.", "Lord Jesus, you said all things are possible to the one who believes. I believe. I do believe that you are who you say you are, and that you’re able to do what you’ve promised.", "But I also confess that my faith is mixed, like that father’s. There are places where I’m afraid to hope. There are prayers I’ve stopped praying so I won’t be disappointed. Name one of them to him now.", "I’m not going to pretend, Lord. I pray the father’s prayer in my own words: help my unbelief. I’m asking you to do what I can’t do.", "Thank you that you didn’t scold him for the mix. You didn’t say, come back when you have it together. You met him right where he was, and you meet me here.", "Teach me to bring my doubts to you instead of hiding them. Make my faith the kind that keeps coming to you, even when it’s shaky.", "Stay with him for a moment, and let him strengthen what is weak. Thank you, Jesus. Amen."]}, {"prayShort": ["Take a slow breath. Look back over this week of trust.", "Lord, some trust in chariots and some in horses, in plans and strength and money. I want to trust in the name of the LORD my God.", "Here are my chariots and horses. Name the things you tend to rely on, and set them down.", "You were faithful this week, even where I didn’t notice. Keep me looking to you in the week ahead. Amen."], "prayLong": ["Take a moment to settle. This is the last day of the week, a good day to look back.", "Think about the week. The moments you were afraid, the moments you tried to work it out on your own, and the moments you remembered to bring him in.", "Imagine a wide field with an army of chariots and horses lined up in front of you. They look like they could win any battle. Now imagine standing beside them with nothing in your hands but trust in God.", "Lord, the psalm says some trust in chariots and some in horses, but we trust in the name of the LORD our God. Thank you that you’re not one of many things I lean on. You’re the one who holds everything else.", "Here are my chariots and horses. Name them to him: my own planning, my savings, my skills, what people think of me. None of these are evil, but I’ve leaned on them more than on you.", "Forgive me for the times I’ve trusted my own strength. I set these things down. I don’t need to hold everything together.", "Thank you for this week. Name one thing you learned about trust, even the hard way, and thank him for it.", "Teach me to trust you not only in crisis but in the ordinary. When life is calm, keep me leaning on you. When it’s loud, keep me anchored.", "Keep my trust fixed on you in the week ahead. In Jesus’ name, amen."]}], "Peace over anxiety": [{"prayShort": ["Take a slow breath. You don’t have to carry this alone.", "Lord, your word says to be anxious for nothing, but in everything, by prayer and petition with thanksgiving, to let my requests be known to you. So here they are. Name what’s weighing on you.", "Thank you for one thing you’ve already done. Name it.", "Let your peace, which goes beyond my understanding, guard my heart and my mind in Christ Jesus. Amen."], "prayLong": ["Take a slow breath and let your shoulders drop. For these few minutes, you have nothing to solve.", "Picture yourself at a table with everything you’ve been worrying about laid out in front of you. Each worry is a small object, and your hands are tired from holding them all. Jesus sits across from you, calm and unhurried. Nothing on the table surprises him.", "Lord, your word says not to be anxious about anything. I’ve been anxious about plenty. Thank you that you don’t ask me to tidy it up first. You invite me to bring it as it is.", "Here is what I’ve been anxious about. Name each worry to him now, one at a time, and set it down.", "The verse says to pray with thanksgiving. So I thank you for what you’ve already done. Name one thing you’re grateful for today, even a small one. Gratitude reminds me that you’ve been faithful before.", "I make my requests known to you, as you invite me to. Say the specific things you need.", "I’m not asking you to explain it all. I’m asking for your peace, the kind I can’t produce and can’t fully understand. Stand guard over my heart and my mind today.", "When worry knocks again, remind me to bring it to you instead of letting it in. Rest here a moment. Thank you, Jesus. Amen."]}, {"prayShort": ["Take a slow breath. Picture the weight you’ve been carrying.", "Lord, I humble myself under your mighty hand. I cast all my anxiety on you, because you care for me.", "Name the worry you’ve been holding most tightly, and throw it onto him now.", "Help me not to pick it up again. Thank you for caring. Amen."], "prayLong": ["Sit quietly and notice what you’re carrying. Notice where you feel it in your body.", "Imagine a heavy backpack you’ve worn so long you’ve almost forgotten it’s there. The straps dig into your shoulders. Jesus stands beside you and says, let me take that.", "Lord, Peter says to humble myself under your mighty hand. I admit that I can’t carry everything, and I was never meant to.", "Then he says to cast all my anxiety on you. Not set it down gently, but throw it off. Here are the worries I’ve been holding. Name them one by one, and throw each onto him.", "The reason is that you care for me. Not that you put up with my burdens, but that you actually care. Let that sink in.", "Forgive me for thinking my worrying was the only thing holding things together. I trust you with what I can’t control.", "When I’m tempted to pick the weight up again, remind me I’ve already given it to you. Rest here with your hands empty. Thank you, Father, for caring. Amen."]}, {"prayShort": ["Take a slow breath. Think of a bird you saw recently, and how it simply went about its day.", "Father, you feed the birds of the sky, and you know what I need. Name the needs you’ve been worried about.", "Jesus asked, can worrying add anything to your life? It can’t. Help me do my part and leave the rest with you.", "Thank you that I’m worth more to you than I can understand. Amen."], "prayLong": ["Find a quiet place and breathe slowly. If you can see a window, look outside.", "Imagine a small bird on a branch with no storehouse and no savings. It doesn’t worry about tomorrow. Each day, it finds what it needs. Jesus is watching it with you, and he says quietly, your Father feeds them.", "Father, thank you for caring for the smallest creature. If you care that much for them, I can trust you with what I need.", "Here are the needs I’ve been worried about: food, money, clothes, health, work. Tell him about each one plainly.", "Jesus asked whether I’m not worth more than the birds. I confess that I often forget it. Thank you that I’m worth more to you than I can grasp.", "He also asked, which of you by worrying can add anything to your life? Forgive me for the hours I’ve spent worrying as if it were a responsibility. Teach me to do my part and leave the rest with you.", "Give me today’s needs, Lord, and the trust to leave tomorrow in your hands. Stay here a moment. Thank you. Amen."]}, {"prayShort": ["Take a slow breath. Let your thoughts be as they are.", "Lord, when my foot was slipping, your steadfast love held me up. Where do you feel you’re slipping now? Tell him.", "When my thoughts were many within me, your comforts delighted my soul. Come into the middle of my crowded mind.", "I don’t need the thoughts to stop first. Be near while I carry them. Thank you. Amen."], "prayLong": ["Sit quietly. Notice the thoughts coming and going like cars on a busy road. You don’t need to stop them right now.", "Imagine standing on uneven ground with your foot beginning to slip. You reach out, and someone takes hold of you. It’s the Lord, and his grip is steady.", "Lord, the psalmist said, when I said my foot is slipping, your loving kindness held me up. Thank you for your steadfast love. It holds me when I can’t hold myself.", "Here is where I feel I’m slipping. Name it to him: the situation, the fear, the thing that feels like it’s sliding away.", "When my thoughts were many within me, your comforts delighted my soul. Here are the thoughts crowding my mind. Tell him about them one at a time. Don’t edit them. He can hear them as they are.", "I’m not asking you to take away every concern. I’m asking you to bring your comfort into the middle of them, and to be near while I carry them.", "Let your comfort bring me joy, even a quiet joy. Remind me that the cares aren’t the whole story, because you’re in it too. Rest in being held. Thank you, Lord. Amen."]}, {"prayShort": ["Take a slow breath. You don’t have to produce peace today. You can receive it.", "Jesus, you said, my peace I give to you, not as the world gives. I receive it now, as a gift.", "Don’t let my heart be troubled, and don’t let it be afraid. Name what troubles it, and hand it to him.", "Thank you for a peace that doesn’t depend on my circumstances. Amen."], "prayLong": ["Sit still and open your hands on your lap, palms up, ready to receive.", "Imagine a quiet room with Jesus sitting beside you. He isn’t asking anything of you. He simply says, my peace I give to you.", "Lord Jesus, thank you for this gift. You said you don’t give as the world gives. I confess that I’ve looked for peace in places that couldn’t give it: a cleared schedule, a solved problem, someone’s reassurance.", "I receive your peace now. Not the peace of a perfect day, but yours, which holds even when the day is hard.", "You said not to let my heart be troubled. Here is what troubles it. Name it. You also said not to be afraid. Here is what makes me afraid. Name that too.", "You said these words the night before your arrest, when you weren’t at ease yourself. Thank you that your peace comes from a settled trust in the Father, and that you share it with me.", "Settle my heart. Where I’m restless, give rest. Where I’m afraid, give courage. Stay here a moment and let it settle. Thank you, Jesus. Amen."]}, {"prayShort": ["Take a slow breath. Read the verse in your mind: do not fear, for I am with you.", "Lord, you say, don’t be afraid, for I am with you. Don’t be dismayed, for I am your God. Name what you’re afraid of, and tell him.", "Strengthen me. Help me. Uphold me with your righteous right hand.", "Thank you for being near. Let ‘I am with you’ be enough for the next step. Amen."], "prayLong": ["Sit quietly and let your body relax, one part at a time: your hands, your arms, your shoulders.", "Imagine standing at the edge of something that frightens you. The path is unclear, and your legs feel unsteady. Then you hear a voice beside you: don’t be afraid, for I am with you.", "Lord, thank you that you’re with me. Not far off, and not watching from a distance. You say, I am your God, and I praise you for being exactly that.", "Here is what I’m afraid of. Say it to him plainly. I won’t pretend I’m not afraid. I bring it to you.", "You promise three things: I will strengthen you, I will help you, I will uphold you with my righteous right hand. Strengthen me, Lord. I’m not asking for a feeling of strength, but for the strength I need for what’s in front of me today.", "Help me where I can’t do it myself. Name the thing you need help with.", "Hold me up with your right hand. Where I can’t stand on my own, be my support.", "Thank you that your promise doesn’t depend on how I feel. You said you are with me, and you are. Rest in that. Amen."]}, {"prayShort": ["Take a slow breath. Picture a shepherd walking beside you.", "Lord, you are my shepherd. I shall not lack. Thank you for leading me and restoring my soul.", "Even when I walk through the valley of the shadow of death, I won’t fear, for you are with me. Name the valley you’re walking through.", "Your rod and your staff comfort me. Stay close. Amen."], "prayLong": ["Settle into stillness. Think of the places in your life that feel like a valley right now.", "Imagine a narrow path between steep hills in the late afternoon. The light is fading. A shepherd walks beside you with a staff in his hand. He doesn’t hurry you, and he doesn’t leave.", "Lord, you are my shepherd. I shall not lack. I praise you for what you’ve provided, for leading me beside still waters, and for the times you’ve restored my soul.", "Here is the valley I’m walking through. Tell him about it now. Tell him what’s dark, and what you’re afraid might happen.", "I won’t pretend it’s not dark. But I will say what David said: I will fear no evil, for you are with me. That’s the thing I hold on to.", "Your rod and your staff comfort me. I thank you that you guide and protect, and that you know the way through, even when I don’t.", "Comfort me with your presence. Where I can’t see the way, guide me. Where I’m tempted to run, keep me close.", "Thank you that the valley isn’t the end of the path, and that you walk through it with me. Stay here for a moment and let the shepherd lead. Amen."]}], "Gratitude": [{"prayShort": ["Take a slow breath. Come into his presence with thanks.", "Lord, I enter your gates with thanksgiving and your courts with praise. Know that you are God. You made us, and we are yours.", "You are good. Your loving kindness endures forever, and your faithfulness to all generations.", "Thank you for who you are, before I ask for anything. Amen."], "prayLong": ["Take a slow breath. Imagine walking up to a gate that stands open, and a courtyard beyond it full of light.", "The psalm says to enter with thanksgiving. So let’s do that. Before you ask for anything, begin with thanks.", "Lord, I thank you that you are God and I am not. I thank you that you made me and I belong to you. I’m not an accident. I’m one of your sheep.", "Thank you for your goodness. Name a way you’ve seen his goodness this week, even a small one.", "Thank you for your loving kindness, which endures forever. It doesn’t depend on how I performed today.", "Thank you for your faithfulness to all generations. You were faithful to the people who came before me, and you’re faithful to me.", "Forgive me for the times I’ve come to you only with requests and forgotten to thank you for who you are.", "Stay here a moment and let your heart be glad. Amen."]}, {"prayShort": ["Take a slow breath. Think of one thing from today that you can thank God for.", "Lord, Paul says to rejoice always, pray without ceasing, and give thanks in everything. I give thanks in this day, whatever it brings.", "Even in the hard part, show me one thing to thank you for. Name it.", "This is your will for me in Christ Jesus. Help it become a habit. Amen."], "prayLong": ["Sit still for a moment. Think back over the day, from morning to now.", "Imagine going through it like scrolling through photos. Some moments are bright, some are dull, and some are hard. Pause on a few of them.", "Lord, thank you for this day. I thank you for the good moments. Name one now.", "Paul says to give thanks in everything, not for everything. I’m not thanking you for what hurt. But I thank you that you were there, and for what you provided in the middle of it. Name something in the hardest part of your day.", "Teach me to rejoice always, not by ignoring what hurts, but by remembering who you are.", "Teach me to pray without ceasing, to bring you into small moments and not only big ones.", "Teach me to give thanks in everything, because this is your will for me in Christ Jesus. Let thankfulness settle in. Amen."]}, {"prayShort": ["Take a slow breath. Speak to your own soul, as David does.", "Bless the LORD, my soul, and don’t forget any of his benefits. He forgives all my sins, heals my diseases, redeems my life from the pit.", "Name three things he has done for you, specifically.", "Thank you for crowning me with loving kindness and tender mercies. Amen."], "prayLong": ["Sit quietly. Imagine speaking to your own soul the way David does: bless the LORD, my soul.", "David said not to forget any of his benefits. Let’s remember them. Think of a time you were forgiven when you didn’t deserve it. Lord, thank you for forgiving all my sins. I don’t take that lightly.", "You heal my diseases, David says. Thank you for the ways you’ve healed me in body, in heart, in relationships. Name one.", "You redeem my life from the pit. Think of a time you were rescued from a low place or a hard season. Thank you for bringing me out of it.", "You crown me with loving kindness and tender mercies. Name one way you’ve shown me love, in a person or a moment.", "You satisfy me with good things. I confess that I forget these. I take your gifts as ordinary.", "Help me to remember. When I’m tempted to think no one has been good to me, remind me of what you’ve done. Let my soul bless you with everything in me. Amen."]}, {"prayShort": ["Take a slow breath. Think of something God has answered.", "Jesus, ten were healed, and one turned back to thank you. I’m turning back to say it. Name what he did for you.", "Forgive me for the times I’ve received and rushed on without thanking you.", "Thank you that you notice. Amen."], "prayLong": ["Settle into stillness. Imagine a road leading out of a village, with ten men walking along it, newly healed.", "Nine keep walking. One stops, turns around, and runs back, shouting praise. He throws himself at Jesus’ feet, and he’s a Samaritan, an outsider.", "Now think of something God has done for you. A prayer he answered, or a difficulty that resolved. Picture yourself turning back.", "Jesus, thank you. I want to be the one who comes back. Thank you for what you did. Say it in your own words.", "You asked where the other nine were. Forgive me for the times I’ve received your gifts and kept going without a word. I don’t want to treat your goodness as ordinary.", "Thank you that you notice. You notice when we come back, and you welcome us.", "Teach me to pause when you give me something, to turn around and thank you. Amen."]}, {"prayShort": ["Take a slow breath. Think about the day ahead.", "Lord Jesus, whatever I do in word or deed, I want to do in your name, giving thanks to God the Father through you.", "Let the peace of Christ rule in my heart. Name one ordinary task today that you’ll do with thanks.", "Let your word live in me richly. Amen."], "prayLong": ["Sit quietly. Think through your day ahead: the tasks, the conversations, the small things.", "Imagine each of them as a doorway you walk through, and over each one is written, in the name of the Lord Jesus.", "Lord Jesus, thank you that no part of my day is outside your care. I give you my work, my words, my effort.", "Let the peace of Christ rule in my heart. When I’m tempted to hurry, to feel irritated or to worry, bring me back to you.", "Let your word live in me richly. Teach me to sing, in my heart if not out loud, with gratitude to God.", "Here is one ordinary thing I’ll do today. Name it. Help me do it in your name, with thanks.", "Forgive me for the times I’ve treated my work as separate from you. Thank you, Father, through Jesus. Amen."]}, {"prayShort": ["Take a slow breath. Say it quietly: his loving kindness endures forever.", "Lord, give thanks to the LORD, for he is good. His loving kindness endures forever.", "Thank you for something specific, then say it again: your loving kindness endures forever.", "Nothing today can change that. Amen."], "prayLong": ["Sit quietly and slow your breathing. Say slowly: give thanks to the LORD, for he is good.", "His loving kindness endures forever. Thank you, Lord, for being good and for your love that doesn’t run out.", "Think of something he’s done for you. Say it, and then say, his loving kindness endures forever.", "Think of someone he’s placed in your life. Thank him, and then say it again: his loving kindness endures forever.", "The psalm calls you God of gods and Lord of lords. Thank you that you are above everything I fear. And still, your loving kindness endures forever.", "Think of a hard time he’s brought you through. Thank him, and say it again.", "Notice how the refrain holds everything together. It isn’t about the day or the season. It’s about who he is. Let this truth settle deeper. Amen."]}, {"prayShort": ["Take a slow breath. Think of three good things in your life.", "Father, every good gift and every perfect gift is from above. I trace these three back to you. Name them.", "You are the Father of lights, with no variation or shadow of turning.", "Thank you for your steady goodness. Amen."], "prayLong": ["Sit quietly. Think about the good things in your life, and let them come one at a time.", "Imagine each good thing as a small light. When you trace each one back, they all lead to the same source, the Father of lights.", "Father, thank you for every good gift and every perfect gift from above. I name three now, as specifically as I can.", "I confess that I’ve often credited luck or my own effort. Forgive me for the times I forgot the Giver. Name one you’ve credited elsewhere.", "James says there is no variation or shadow of turning with you. Thank you that you don’t change. Your goodness doesn’t come and go with my circumstances.", "Help me notice your gifts in ordinary places, and thank you for them as they come.", "Rest in his steady goodness. Thank you, Father. Amen."]}], "Forgiveness": [{"prayShort": ["Take a slow breath. Think of someone you find it hard to forgive.", "Lord, Paul says to put away all bitterness, anger and malice, and to be kind and tender-hearted, forgiving one another as God in Christ forgave me.", "Name the person, and name the hurt. Tell him where bitterness has settled in.", "You’ve forgiven me so much. Soften my heart toward them. Amen."], "prayLong": ["Sit quietly. Let your breathing slow. Think of someone who hurt you, and let their face come to mind.", "Imagine a heavy chain with one end around your wrist and the other around theirs. You’ve been dragging it with you for a long time.", "Lord, thank you for forgiving me in Christ. I don’t deserve it, and you gave it freely. Let me remember how much I’ve been forgiven.", "Here is what happened, and how it hurt me. Tell him plainly. He isn’t shocked, and he doesn’t minimize it.", "Paul lists what to put away: bitterness, rage, anger, shouting, slander, malice. I confess which of these has been growing in me. Name it. I don’t want to carry it anymore.", "Paul says to be kind and tender-hearted, forgiving one another as God in Christ forgave you. I choose to begin forgiving, even if my feelings haven’t caught up. Make me kind and tender-hearted toward them.", "Release me from the chain, Lord. Give me the strength to let go. Thank you. Amen."]}, {"prayShort": ["Take a slow breath. Think of someone who’s been hard to be around.", "Lord, clothe me with compassion, kindness, humility, gentleness and patience today.", "Help me bear with them, and forgive whatever complaint I have, as you forgave me.", "Name the person and the complaint. Hand it to him. Amen."], "prayLong": ["Sit still and breathe slowly. Imagine getting dressed in the morning, putting on each item one by one.", "Now imagine putting on compassion, kindness, humility, gentleness and patience, as if they were laid out for you.", "Lord, thank you for choosing me and loving me. Because of that, I can offer the same to others.", "Here is someone I find difficult. Name them to him. Here is what they do that wears on me.", "Paul says to bear with one another. Help me bear with them. I don’t want to pretend there’s no problem, but I don’t want to be ruled by it.", "He says to forgive if anyone has a complaint against another. Here is my complaint. Say it to him. I put it down.", "Where I’m the one who’s been hard to live with, forgive me. Thank you that you forgave me first, and let that be what I draw from today. Amen."]}, {"prayShort": ["Take a slow breath. Ask yourself if you’re keeping a tally.", "Jesus, Peter asked if seven times was enough, and you said seventy times seven. Help me stop counting.", "Name the person you’ve been keeping score against, and offer it to him.", "Give me your heart for them. Amen."], "prayLong": ["Sit still. Imagine a notebook where you’ve been recording someone’s wrongs, with dates and details.", "Imagine Jesus quietly closing it. He isn’t saying the wrongs weren’t real. He’s saying you don’t have to keep the record.", "Lord, thank you that you don’t keep a tally of my failures. You forgive me again and again.", "Peter thought seven times was generous. You said seventy times seven. Here is where I’ve been counting. Name the person, and name how many times it’s happened.", "I want to be someone who forgives freely, not because the other person has earned it, but because you’ve given me so much.", "Help me release this, not just once, but each time it comes back. When the memory returns, remind me that I’ve given it to you.", "Give me your heart for them. Amen."]}, {"prayShort": ["Take a slow breath. Think of what you’re still carrying guilt over.", "Lord, you are merciful and gracious, slow to anger, abundant in loving kindness. You haven’t dealt with me according to my sins.", "As far as the east is from the west, you’ve removed my transgressions from me. I receive that.", "Help me forgive others the same way. Amen."], "prayLong": ["Sit quietly. Imagine standing on a hill, looking east. Now turn to face west. You can’t see both at once. They’re as far apart as two directions can be.", "Lord, thank you that you’re merciful and gracious, slow to anger and abundant in loving kindness. I praise you for who you are.", "David says you haven’t dealt with us according to our sins, nor repaid us for our iniquities. Here is what I’ve been carrying guilt about. Tell him plainly. He already knows, and he isn’t surprised.", "I receive your forgiveness now. As far as the east is from the west, so far have you removed my transgressions from me. I let myself believe it.", "You said you won’t always accuse, and you don’t stay angry forever. Where I’ve kept accusing myself, help me stop.", "Where I’ve held on to someone else’s wrongs, help me put those down too. Thank you for your mercy. Amen."]}, {"prayShort": ["Take a slow breath. Picture the father running down the road.", "Father, while I was still far off, you saw me and ran to meet me. Thank you for your compassion.", "Name what you’ve been ashamed of, and let him embrace you. You’ve given me a robe, a ring and a welcome.", "Help me welcome others the way you’ve welcomed me. Amen."], "prayLong": ["Sit still. Imagine a long road leading up to a house. You’re walking up it, tired and dusty, rehearsing what you’ll say.", "In the distance, someone is looking down the road. He sees you, and he starts to run.", "Father, thank you that you don’t wait for me to clean myself up. While I’m still far off, you see me, are moved with compassion, run, and embrace me. I praise you for it.", "Here is what I’ve been ashamed of. Say it to him now. You don’t need to rehearse. He’s already kissing you.", "Thank you for the best robe, the ring and the feast. I don’t have to earn my place. I was dead and am alive again, lost and found.", "Where I’ve been like the son, help me come home. Where I’ve been like the father, help me run toward others.", "Think of someone you could welcome back. Ask him to give you his heart for them. Rest in his embrace. Thank you, Father. Amen."]}, {"prayShort": ["Take a slow breath. Be honest with God about where you’ve fallen short.", "Lord, I won’t say I have no sin. I confess it to you now. Name it plainly, without excuses.", "You are faithful and righteous to forgive me my sins and to cleanse me from all unrighteousness.", "Thank you for keeping your promise. Amen."], "prayLong": ["Sit quietly. Imagine standing in a bright room where nothing is hidden. It isn’t frightening. It’s clean.", "Lord, I praise you for being faithful, and righteous, and for keeping every promise you’ve made.", "John says that if we say we have no sin, we deceive ourselves. I won’t pretend. Tell him specifically where you’ve fallen short, in what you’ve done, said or thought.", "I’m not making excuses. I’m agreeing with you about what’s true.", "Thank you for your promise: if we confess our sins, you are faithful and righteous to forgive us the sins and to cleanse us from all unrighteousness. I receive that. I’m forgiven.", "Where I keep returning to the same sin, give me strength to walk differently. Where I’m still ashamed, remind me of your promise.", "Cleanse me, Lord, and make me new. Amen."]}, {"prayShort": ["Take a slow breath. Think of someone who has hurt you.", "Jesus, on the cross you prayed, Father, forgive them, for they don’t know what they are doing. Help me follow you.", "Name the one who hurt you, and pray those words for them.", "Give me strength to forgive what feels too big. Amen."], "prayLong": ["Sit quietly. Picture the scene slowly, without rushing. A hill, a crowd, and Jesus on the cross.", "Hear him say, Father, forgive them, for they don’t know what they are doing.", "Jesus, thank you for what you did for me. You didn’t wait for an apology. You gave your life freely.", "I praise you for your mercy, and for your strength in the middle of suffering.", "Here is someone who’s hurt me. Name them to him. Here is how deep it went.", "I don’t know if I can forgive them yet. But I want to follow you. I pray the words you prayed. Father, forgive them.", "Do in me what I can’t do myself. Thank you, Jesus. Amen."]}], "Patience": [{"prayShort": ["Take a slow breath. Name what you’re waiting for.", "Lord, I believe I will see your goodness in the land of the living. Wait for the LORD. Be strong. Take courage. Say it to your own heart.", "Give me strength and courage while I wait. Tell him how waiting feels.", "I wait for you, Lord. Amen."], "prayLong": ["Sit still. Think about what you’re waiting for, and how long you’ve been waiting.", "Imagine standing in a doorway, looking down a long road. You can’t see what’s at the end. You’ve been standing here for a while.", "Lord, David said he would have despaired unless he believed he would see your goodness in the land of the living. I believe it too. I praise you for being faithful, even when I don’t see it yet.", "Tell him how waiting feels. You can be honest: tired, impatient, afraid. He can hear all of it.", "Wait for the LORD, David says. Be strong, and let your heart take courage. Say it to yourself, as David did. Yes, wait for the LORD.", "Give me strength for today, not for the whole wait. Show me what to do while I wait, and keep me from running ahead of you.", "I wait for you, Lord. Amen."]}, {"prayShort": ["Take a slow breath. Think of what you’re hoping for.", "Lord, we were saved in hope. Hope that is seen isn’t hope. I hope in what I can’t see yet. Name it.", "Give me patience to wait for it.", "Build hope in me that doesn’t give up. Amen."], "prayLong": ["Settle into stillness. Think of what you’re hoping for, and say it quietly to God.", "Imagine planting a seed and watching the soil. There’s nothing to see yet, but under the surface roots are forming.", "Lord, thank you that you’ve saved me in hope. I praise you for what you’ve already done, and for what you’ve promised.", "Paul says that hope that is seen is not hope. So here is what I’m still hoping for, and haven’t seen. Tell him how long you’ve been waiting.", "I confess that I get impatient. I want to see results now. Teach me to wait without losing heart.", "If we hope for that which we don’t see, we wait for it with patience. Let my waiting be filled with hope, not just endurance. Remind me that you’re at work even when I can’t see it.", "Give me patience, Lord. Amen."]}, {"prayShort": ["Take a slow breath. Think of a field, planted and waiting.", "Lord, teach me to wait like a farmer who waits for the precious fruit of the earth, patient until the early and late rains.", "Establish my heart. Name where you’ve been trying to rush something.", "Keep me from rushing ahead. Amen."], "prayLong": ["Sit quietly. Picture a field in early spring. The seed is in the ground, and nothing seems to be happening.", "A farmer stands at the edge of the field. He isn’t pacing, and he isn’t anxious. He’s done his part, and he’s waiting for the rain.", "Lord, thank you that you work in seasons. James says the farmer waits for the early and latter rain. You’re never late, and you’re never careless with what you’ve planted.", "Here is where I’ve been trying to rush. Tell him what it is. I’ve pushed and worried, and it hasn’t made it grow.", "Forgive me for doubting your timing. Teach me to do what’s in front of me and trust you with the rest.", "James says, establish your hearts. Make me steady, so that I’m not swayed by every delay.", "Thank you for the harvest you’re preparing. Amen."]}, {"prayShort": ["Take a slow breath. Be quiet before him.", "Lord, you are good to those who wait for you, to the soul who seeks you. I wait quietly now.", "I don’t need to fill the silence. Hold me in it.", "Thank you for your salvation. Amen."], "prayLong": ["Sit still. Let silence settle around you. You don’t need to fill it.", "Think of a time of grief, or a time you’re walking through now. Imagine bringing it to God, not with words, but just by being present.", "Lord, the writer of Lamentations said you are good to those who wait for you, to the soul who seeks you. I praise you for that, even when I don’t feel it.", "Tell him what hurts. Say it plainly, as the writer of Lamentations did.", "It is good to hope and quietly wait for the salvation of the LORD. Help me wait quietly. I don’t want to rush, and I don’t want to run. I want to trust you in the stillness.", "Teach me that waiting isn’t wasted. You are at work, even when it’s quiet. Stay with me, Lord. Amen."]}, {"prayShort": ["Take a slow breath. Name where you’re tired of doing good.", "Lord, I’m weary. Don’t let me grow weary in doing good, for in due season I will reap if I don’t give up.", "Renew my strength to keep going. Show me the next small step.", "Thank you for the harvest you’re preparing. Amen."], "prayLong": ["Sit still. Notice how tired you are, and where it’s coming from.", "Imagine carrying a bucket of water along a long path. You’ve walked a long way, and your arms are shaking. A friend steps beside you and takes one handle.", "Lord, thank you that you see what I do, even when no one else does. Nothing I do for you is wasted.", "Paul says, let’s not be weary in doing good. Here is where I’m tempted to give up. Name it. Here is why I’m tired.", "He says we’ll reap in due season. Forgive me for the times I’ve quit because I wanted results sooner. Teach me to trust your timing.", "Renew my strength, Lord, and give me the courage to keep doing good and not give up. Amen."]}, {"prayShort": ["Take a slow breath. Admit where you’re tired.", "Lord, even young people grow tired and stumble. I’m worn out too. I wait for you.", "Renew my strength. Help me mount up with wings like eagles, run and not be weary, walk and not faint.", "Strength for today’s walk, not just a burst. Amen."], "prayLong": ["Sit quietly and notice how your body feels. Where are you carrying tiredness?", "Imagine standing on a high cliff with the wind rising beneath you. An eagle lifts into the air without effort, carried upward.", "Lord, I praise you because you never grow weary. You don’t get tired, and you don’t run out.", "Isaiah says even the youths faint and the young men fall. I’m worn out in these places. Name them to him, and be specific about what has drained you.", "Those who wait for the LORD will renew their strength. I wait for you. I’m not asking for a quick fix. I’m asking for strength only you give.", "I want to run and not be weary, and walk and not faint. Give me strength to walk today. Not a rush of energy, but steady, ordinary strength.", "Thank you for renewing me. Amen."]}, {"prayShort": ["Take a slow breath. Remember a time God heard you.", "Lord, I’m waiting patiently. Hear my cry, as you heard David’s.", "Lift me out of the pit and set my feet on a rock when it’s time. Name where you feel stuck.", "Give me a new song. Amen."], "prayLong": ["Sit still. Picture someone stuck in a deep pit with muddy walls and no way out. They’ve been calling for help for a long time.", "Then a hand reaches down. The person is lifted out and set on firm ground, and a song begins to rise.", "Lord, thank you that you hear. David said you turned to him and heard his cry. I praise you because you turn toward us when we cry out.", "I’ve been waiting. Tell him how long, and how it has felt. Tell him what you’ve been asking for.", "David says you brought him up out of the miry clay and set his feet on a rock. Set my feet on a rock, Lord. Give me a firm place to stand, even before the answer comes.", "Put a new song in my mouth, a song of praise to you, and let me sing it. Amen."]}], "Wisdom": [{"prayShort": ["Take a slow breath. Name the decision in front of you.", "Lord, I lack wisdom, and you say to ask. Thank you that you give to all liberally and without reproach.", "I ask in faith, not doubting. Tell him specifically what you need to know.", "Show me what to do. Amen."], "prayLong": ["Sit quietly. Let the decision you’re facing come to mind.", "Imagine standing at a well. You’ve been trying to draw water with a small cup, and it hasn’t been enough. Then you notice that the well is open to you, with no limit on how much you can take.", "Lord, James says if any of us lacks wisdom, we should ask you, who gives to all liberally and without reproach. Thank you that you don’t scold me for needing it.", "Here is what I need wisdom for. Tell him plainly. Be specific about what you don’t know.", "I confess that I’ve often relied on my own thinking first and come to you only when I was stuck. Forgive me.", "James says to ask in faith, without doubting. I believe that you will give. Help me recognize your wisdom when it comes, and act on it.", "Thank you, Lord, for answering. Amen."]}, {"prayShort": ["Take a slow breath. Ask how much you value wisdom.", "Lord, you give wisdom. I want to seek it like silver and search for it like hidden treasure.", "Out of your mouth come knowledge and understanding. Teach me.", "Make me hungry for your word. Amen."], "prayLong": ["Sit quietly. Imagine holding an old map with a mark showing where something valuable is buried.", "You begin to dig. The ground is hard, but you keep going because you know what’s there is worth it.", "Lord, I praise you, because the LORD gives wisdom, and from your mouth come knowledge and understanding.", "The passage says to receive your words, treasure your commandments, tune my ear to wisdom. I confess that I’ve chased other things more eagerly. Name what you’ve pursued more than him.", "Give me a hunger for your word. Help me to listen, and to apply what I hear.", "Show me the next place to dig. Teach me what I need for today. Thank you for giving wisdom. Amen."]}, {"prayShort": ["Take a slow breath. Bow your heart before him.", "Lord, the fear of the LORD is the beginning of wisdom, and knowledge of the Holy One is understanding. I honor you above everything.", "Make me teachable, like the wise person who becomes wiser still.", "Name advice you’ve been resisting, and open your hand. Amen."], "prayLong": ["Sit still. Imagine standing before something enormous, like a mountain at dawn. You feel small, but not afraid.", "Lord, you are the Holy One. I praise you for your greatness and your knowledge beyond anything I can imagine.", "I confess that I’ve sometimes put myself at the center and trusted my own judgment more than yours.", "The fear of the LORD is the beginning of wisdom. Teach me to fear you in the right way, with reverence and love.", "The passage says to give instruction to a wise man and he will be still wiser. Help me be teachable. Where I’ve resisted advice, soften me. Is there something you’ve been told that you’ve been avoiding? Name it.", "Thank you for instructing me, Lord. Amen."]}, {"prayShort": ["Take a slow breath. Think of the next step in front of you.", "Lord, your word is a lamp to my feet and a light for my path. Show me the next step today.", "Your words are sweeter than honey. Help me love what you’ve said.", "Name the step you need light for. Amen."], "prayLong": ["Sit quietly. Imagine walking along a dark path at night, carrying a small lamp that lights only a few steps ahead.", "Each time you step, the light moves with you. You don’t see the whole path, but you can see where to put your foot.", "Lord, thank you for your word. The psalmist says it’s sweeter than honey to his mouth. I praise you for speaking to us.", "Your word is a lamp to my feet and a light for my path. Here is the step I’m unsure about. Tell him what it is, and what feels unclear.", "Show me what your word says about it. Give me the humility to follow, even if the light reaches only one step.", "I confess that I want to see the whole road before I walk. Teach me to trust you with the next step. Thank you for guiding me. Amen."]}, {"prayShort": ["Take a slow breath. Think of a plan you’ve been holding tightly.", "Lord, give me ears to listen to counsel and accept instruction, so I’ll be wise in the end.", "There are many plans in my heart, but your counsel stands. Make me teachable.", "Name someone wise you could ask this week. Amen."], "prayLong": ["Sit quietly. Think of a plan you’re making, and imagine holding it in your hands. Is your grip tight or loose?", "Lord, thank you for the people you’ve placed around me who see what I can’t. I praise you because you give wisdom through others.", "The proverb says to listen to counsel and receive instruction. I confess that I’ve sometimes gone ahead without asking. Name a time you preferred your own plan.", "Show me who to listen to. Give me the humility to receive counsel, even when it isn’t what I wanted to hear.", "You say there are many plans in a man’s heart, but your counsel prevails. I hold my plans loosely before you. If your counsel is different, let yours stand.", "Thank you for guiding me. Amen."]}, {"prayShort": ["Take a slow breath. Pray Paul’s prayer for yourself.", "Lord, fill me with the knowledge of your will in all spiritual wisdom and understanding, so that I walk worthily of you.", "Strengthen me with all power, and let me give thanks with joy.", "Name someone you’ll pray this for too. Amen."], "prayLong": ["Sit still. Imagine hearing someone you trust pray over you, asking God to fill you with wisdom and understanding.", "Lord, I praise you for your will, which is good. You’re not hiding it. You want me to know it.", "Fill me with the knowledge of your will in all spiritual wisdom and understanding, so that I walk worthily of you, fully pleasing. Here is an area where I need to walk worthily. Name it.", "Help me bear fruit in every good work and increase in the knowledge of God.", "Strengthen me with all power, according to your glorious might, for all endurance and perseverance with joy.", "Let me give thanks to the Father. Pray this prayer for someone else too. Name them. Thank you, Father. Amen."]}, {"prayShort": ["Take a slow breath. Look back over this week.", "Lord, help me get wisdom and understanding, and not forget. Wisdom is the principal thing.", "Name what you chase more than wisdom, and set it down.", "Teach me, and keep me from forgetting. Amen."], "prayLong": ["Sit quietly. Think about what you’ve learned this week, and what you’ve been reminded of.", "Imagine standing in a marketplace full of things to buy with limited money. You notice a small stall tucked at the back. On the sign is one word: Wisdom.", "Lord, I praise you because you are wise and you offer wisdom to those who ask.", "The proverb says, get wisdom, get understanding, and don’t forget. I confess that I often chase what looks valuable in the moment, like comfort, approval and success. Name what you’ve chased more than him.", "It says wisdom is the principal thing, and with all my getting, to get understanding. Give me a hunger for it. Where I’ve been careless, give me care.", "Help me keep learning, listening and growing in the week ahead. Thank you, Lord. Amen."]}], "Hope": [{"prayShort": ["Take a slow breath. Receive this blessing for yourself.", "God of hope, fill me with all joy and peace in believing, so that I may abound in hope, in the power of the Holy Spirit.", "Name where your hope has been thin, and let him fill it.", "Thank you. Amen."], "prayLong": ["Sit quietly. Imagine someone speaking a blessing over you, slowly and warmly: now may the God of hope fill you with all joy and peace in believing.", "Lord, I praise you as the God of hope. You’re the source, and hope isn’t something I need to manufacture.", "Here is where my hope has been thin. Name it to him. Tell him about the disappointments that made you afraid to hope again.", "Fill me with joy and peace in believing. Strengthen my trust, so that hope can grow where I’ve gone numb.", "Paul says I may abound in hope in the power of the Holy Spirit. Holy Spirit, fill me where I’ve felt heavy and anxious.", "Let hope overflow in me, for others to see. Amen."]}, {"prayShort": ["Take a slow breath. Think of a season you didn’t choose.", "Lord, you know the thoughts you think toward me, thoughts of peace and not of evil, to give me hope and a future.", "I call on you and pray to you. I seek you with all my heart.", "Name what feels like exile right now. Amen."], "prayLong": ["Sit quietly. Think about a place in your life where you feel like you’re in exile, far from where you’d like to be.", "Imagine someone writing you a letter. It begins: I know the thoughts that I think toward you. You can almost hear the voice.", "Lord, thank you that you haven’t forgotten me, as you hadn’t forgotten your people in Babylon. You know the plans you have, and they’re thoughts of peace, not harm.", "Here is the season I’m in. Tell him how it feels. Tell him what you don’t understand.", "You said, you shall call on me, and you shall go and pray to me, and I will listen. I call on you now. Say what you’re asking.", "You said I will find you when I search with all my heart. I seek you with all my heart, not just in part.", "Help me trust that you’re at work, even when I can’t see it. Give me hope for what’s ahead. Thank you for listening. Amen."]}, {"prayShort": ["Take a slow breath. Think of a hard season, past or present.", "Lord, suffering produces perseverance, perseverance character, and character hope. Build that in me.", "Pour your love into my heart through the Holy Spirit. Let my hope rest in you, not in my circumstances.", "Thank you that hope in you doesn’t disappoint. Amen."], "prayLong": ["Sit quietly. Think of a hard season you’ve come through. Notice what’s different in you now.", "Imagine a muscle that grows through use. The effort is tiring, but afterward you’re stronger than you were.", "Lord, thank you that you don’t waste anything. Paul says suffering produces perseverance. I praise you because you work even in what I wouldn’t choose.", "Here is what I’m facing now. Name it to him. Tell him how hard it is.", "Build perseverance in me, and proven character. Make me someone who has held on to you through it.", "Paul says character produces hope, and hope doesn’t disappoint, because your love has been poured into my heart by the Holy Spirit. Pour your love into my heart now. When I can’t feel hope, remind me it rests on your love.", "Thank you for not disappointing me. Amen."]}, {"prayShort": ["Take a slow breath. Notice where you feel unsteady.", "Lord, you can’t lie. Your promise and your oath are two unchangeable things. Be the anchor of my soul, sure and steadfast.", "Name where you’ve been drifting.", "Thank you, Jesus, for going ahead of me as forerunner. Amen."], "prayLong": ["Sit still. Imagine a small boat on rough water. The waves are rising, and the boat is being pushed.", "A heavy anchor drops over the side, sinks, and catches. The boat still moves with the waves, but it doesn’t drift away.", "Lord, thank you for your promise and your oath. You are not a God who lies. What you say, you will do. I praise you for your faithfulness.", "Here is where I feel I’m drifting. Name it to him. Tell him what you’re afraid of losing.", "The writer says this hope is an anchor of the
