 soul, sure and steadfast. Anchor my soul in your hope, not dependent on how I feel.", "Thank you for Jesus, who has gone ahead of me into your presence as a forerunner. Because of him I can come to you with confidence.", "Hold me, Lord. Amen."]}, {"prayShort": ["Take a slow breath. Ask your soul honestly how it is.", "Why are you downcast, my soul? Lord, I put my hope in you. I will yet praise you for the saving help of your presence.", "Name what has made your soul heavy.", "Lift what’s heavy, Lord. Amen."], "prayLong": ["Sit quietly. Ask your soul gently: why are you in despair? What’s weighing on you? Don’t rush to fix it.", "Lord, I bring you my heavy heart. Tell him what it feels like, and what you think might be behind it.", "I won’t pretend I’m downcast for no reason. But I’ll say what the psalmist said to his own soul: hope in God.", "Remind my soul of who you are. You’ve been faithful before, and you’ll be faithful again.", "For I will still praise you, the psalm says, for the saving help of your presence. I will still praise you, even if it’s quiet. Thank you for your presence.", "Lift what’s heavy, Lord. Amen."]}, {"prayShort": ["Take a slow breath. Remember that Jesus is alive.", "Lord, thank you for the living hope you’ve given me through the resurrection of Jesus Christ from the dead.", "Thank you for an inheritance that can’t perish, spoil or fade, and for guarding me by your power through faith.", "Keep my hope alive. Amen."], "prayLong": ["Sit quietly. Think about what it means that Jesus is alive.", "Imagine a sealed gift set aside for you and kept safe. Nobody can open it or spoil it. It’s waiting for the right time.", "Lord, Peter says you gave me a new birth into a living hope through the resurrection of Jesus Christ. I praise you for your great mercy.", "Thank you for the resurrection. Because of it, I know that death isn’t the end, and that my struggles aren’t either.", "Thank you for the inheritance that can’t perish, can’t be defiled and doesn’t fade away, kept in heaven for me. I can’t see it yet, but I trust you with it.", "Here is where my hope feels dim. Tell him about it. Ask him to keep it alive.", "You guard me by your power through faith. Guard me today. Amen."]}, {"prayShort": ["Take a slow breath. Call to mind what you know about God.", "Lord, your loving kindnesses never cease, and your compassion doesn’t fail. They are new every morning.", "Great is your faithfulness. Name what you need from his mercy today.", "Thank you for another day. Amen."], "prayLong": ["Sit still. Imagine the first light of morning coming through a window, quiet and new.", "Lord, thank you for this new day. The writer of Lamentations says your mercies are new every morning. I praise you because they don’t run out.", "This I call to mind, he says, therefore I have hope. Here is what I’m carrying from yesterday. Tell him about it, and set it down.", "I choose to call to mind your faithfulness. You’ve carried me through before, and you’ve been kind in ways I didn’t notice.", "It is because of your loving kindnesses that we are not consumed, because your compassion doesn’t fail. Let that be what I remember when I feel discouraged.", "Give me what I need for today. I don’t ask for next week’s strength, only today’s. Great is your faithfulness, Lord. Amen."]}], "Identity in Christ": [{"prayShort": ["Take a slow breath. Think of a label you’ve carried.", "Lord, if anyone is in Christ, he is a new creation. The old things have passed away. Thank you for making me new.", "Name the old label, and let it pass away.", "Help me live from who I am in you. Amen."], "prayLong": ["Sit quietly. Imagine a coat you’ve worn for years. It’s worn and heavy, and it doesn’t fit anymore.", "Jesus gently helps you take it off. In its place he offers something new, and it fits.", "Lord, thank you that in Christ I’m a new creation. I praise you because you don’t just patch up the old. You make new.", "Here are the labels I’ve carried: failure, not enough, too much, too late. Name them to him. Tell him where they came from.", "The old things have passed away. Behold, all things have become new. I let them go. I don’t want to be defined by my past, my mistakes or other people’s opinions.", "Help me live as someone who’s new. Teach me to see myself as you see me. Thank you for making all things new. Amen."]}, {"prayShort": ["Take a slow breath. Let go of trying to earn his love.", "Lord, by grace I’ve been saved through faith, and it’s your gift, not of works. I’m your workmanship.", "Show me the good works you prepared beforehand for me to walk in.", "Name where you’ve been trying to earn approval. Amen."], "prayLong": ["Sit quietly. Imagine holding a gift you didn’t pay for and can’t pay back.", "Lord, I praise you for your grace. By grace I’ve been saved through faith, and that not of myself. It’s your gift.", "Here is where I’ve tried to earn your approval. Name it to him: the effort, the performance, the fear of not being enough.", "Not of works, so that no one would boast. I let it go. I receive your grace again, as if for the first time.", "Thank you that I’m your workmanship, created in Christ Jesus for good works, which you prepared beforehand so that I would walk in them.", "Show me the good works you’ve prepared. Not so I can earn anything, but so I can walk in what you made me for. Thank you, Father. Amen."]}, {"prayShort": ["Take a slow breath. Let yourself hear it: you’re a child of God.", "Father, what love you’ve given me, that I should be called your child. And that’s what I am.", "Name whose approval you’ve chased more than his.", "Let your love be what I stand on. Amen."], "prayLong": ["Sit still. Imagine a father kneeling to greet his child, arms wide open. The child runs into them.", "Father, I praise you for your love. John says to behold what manner of love you’ve given, that we should be called your children, and such we are. I look at it now and I’m amazed.", "I confess that I’ve looked to other places for my worth: people’s approval, my achievements, how I compare. Name the voices you’ve listened to more than his.", "John says the world doesn’t know us because it didn’t know you. When people don’t understand me, remind me whose I am.", "Now we are children of God, he says. Settle my heart in your love. Let me rest in being your child, not just working for you.", "Help me live today from that place. Thank you, Father. Amen."]}, {"prayShort": ["Take a slow breath. Thank God for how he made you.", "Lord, you formed my inmost being and knit me together in my mother’s womb. I praise you, for I am fearfully and wonderfully made.", "Name the part of yourself you struggle to accept, and bring it to him.", "Help me see myself as you do. Amen."], "prayLong": ["Sit quietly. Imagine a craftsman bending over his work, shaping it with patient hands.", "That’s how David describes God making him. Lord, you formed my inmost being. You knit me together in my mother’s womb. Slowly, carefully, with purpose.", "I will give thanks to you, David says, for I am fearfully and wonderfully made. Marvelous are your works. Thank you for how I’m made.", "Here is what I struggle to accept about myself. Name it to him honestly: something about how I look, think or feel.", "I ask you to help me see it differently. You made me, and you don’t make mistakes.", "Heal where I’ve been ashamed. Teach me to receive myself as your gift to me. Thank you for knowing me completely, and loving me. Amen."]}, {"prayShort": ["Take a slow breath. Read the verse slowly, as if it’s about you.", "Jesus, I’ve been crucified with Christ, and it’s no longer I who live, but you who live in me.", "You loved me and gave yourself up for me. Live your life through me today.", "Name where you’ve been relying on yourself. Amen."], "prayLong": ["Sit quietly. Imagine Jesus not just beside you, but within you, at the very center.", "Jesus, thank you that you loved me and gave yourself up for me. Paul says it as if it were personal. It was personal. It was for me.", "I’ve been crucified with Christ, and it’s no longer I who live, but Christ lives in me. I confess that I often try to live in my own strength: good enough, strong enough, spiritual enough.", "Here is where I’ve been relying on myself. Name it to him.", "The life I now live in the flesh, I live by faith in the Son of God. I give you my life again. Live through me today, in how I speak, work and treat others.", "When I’m tired, remind me that you are in me. Thank you for your love, Jesus. Amen."]}, {"prayShort": ["Take a slow breath. Remember that you belong to him.", "Jesus, I receive you. Thank you for giving me the right to become a child of God.", "I wasn’t born of blood or the will of man, but of God.", "Name where you’ve felt you don’t belong, and let him welcome you. Amen."], "prayLong": ["Sit quietly. Imagine standing at the door of a house with the lights on and a table set. You’re not sure you’re welcome. Someone opens the door and says, come in, you belong here.", "Jesus, thank you for receiving me. John says that as many as received you, you gave the right to become God’s children. I praise you for that.", "I confess that I’ve often felt like an outsider. Name the places where you’ve felt you don’t belong.", "Remind me that my place in your family isn’t earned. It wasn’t by blood or the will of the flesh or the will of man, but of God.", "Thank you that I’m born of God, not by anything I did. I receive it with gladness.", "Help me welcome others the way you’ve welcomed me. Thank you, Jesus. Amen."]}, {"prayShort": ["Take a slow breath. Hear these words as spoken to you.", "Lord, you’ve made me a chosen race, a royal priesthood, a holy nation, a people for your own possession.", "You called me out of darkness into your marvelous light.", "Help me show others your goodness. Name one person. Amen."], "prayLong": ["Sit quietly. Imagine stepping out of a dark room into bright, warm sunlight.", "Lord, thank you for calling me. I was once not a people, and now I’m your people. I praise you for your mercy.", "Peter says I’m a chosen race, a royal priesthood, a holy nation, a people for your own possession. Thank you that you wanted me. Let that sink in.", "I confess that I’ve sometimes lived as though I were still in the dark. Name where you’ve forgotten who you are.", "Remind me that I belong to your people. Peter says it’s so that I may proclaim your excellencies, who called me out of darkness into your marvelous light.", "Show me how to share your goodness. Who in my life needs to hear what you’ve done? Name them to him. Thank you for your light. Amen."]}], "Perseverance": [{"prayShort": ["Take a slow breath. Think of what slows you down.", "Jesus, I lay aside every weight and the sin that so easily entangles me, and I run with perseverance the race set before me.", "I fix my eyes on you, the author and perfecter of my faith.", "Name the weight you’re laying down. Amen."], "prayLong": ["Sit quietly. Imagine a long road with runners ahead of you and others cheering from the sides.", "You notice you’re carrying a heavy pack. As you keep running, you realize you could let it drop.", "Lord, thank you for the great cloud of witnesses who’ve run before me. I praise you for their faith and how it encourages me.", "The writer says to lay aside every weight. Here are the weights I’m carrying. Name them. Here is the sin that so easily entangles me.", "I lay them down. I don’t want to run with this on my back.", "Jesus, I look to you, the author and perfecter of my faith. You began it and you will complete it. Give me strength for the next step.", "Keep me running, Lord. Amen."]}, {"prayShort": ["Take a slow breath. Name what you’re going through.", "Lord, I want to count it all joy when I face trials, knowing the testing of my faith produces endurance.", "Let endurance have its perfect work in me, so I’m complete, lacking nothing.", "Show me what you’re building. Amen."], "prayLong": ["Sit still. Think of a trial you’re facing, and let yourself feel how heavy it is.", "Imagine metal being refined in a fire. It’s uncomfortable, but impurities are burned away and what remains is stronger.", "Lord, I praise you because you don’t waste anything. You work even in what I wouldn’t choose.", "James says to count it all joy when I fall into various trials. I’m not sure I can. Tell him about the trial. Tell him what’s hardest about it, and what you wish would change.", "The testing of my faith produces endurance. I ask for the faith to let endurance have its perfect work. Where I’m tempted to escape, help me stay.", "Make me complete, lacking nothing. Show me what you’re building in me. Give me joy, Lord, even now. Amen."]}, {"prayShort": ["Take a slow breath. Think about how you want to finish.", "Lord, help me fight the good fight, finish the course, and keep the faith.", "I love your appearing. Keep my heart turned toward you all the way.", "Name where you’ve been tempted to quit. Amen."], "prayLong": ["Sit quietly. Imagine standing at the end of your life, looking back over the road you’ve walked. What would you want to be able to say?", "Lord, I praise you because you’re faithful. You keep your promises, and you hold the end of the story.", "Paul said, I have fought the good fight, I have finished the course, I have kept the faith. Here is where I’ve been tempted to quit. Name it to him. Tell him where you’ve grown tired.", "Give me strength to keep going, one day at a time. I don’t need to finish today. I need to be faithful today.", "Paul speaks of a crown of righteousness for all who have loved your appearing. I want to love your appearing. Keep my heart turned toward you, not only now, but all the way.", "Thank you for the hope that’s ahead. Amen."]}, {"prayShort": ["Take a slow breath. Let go of what’s behind you.", "Lord, I haven’t arrived. I press on to take hold of that for which Christ Jesus took hold of me.", "Forgetting what’s behind and reaching forward, I press on toward the goal.", "Name what you’re leaving behind. Amen."], "prayLong": ["Sit quietly. Imagine a runner approaching the finish line, leaning forward, eyes on the goal.", "Lord, thank you that Christ Jesus has taken hold of me. I don’t have to earn my place. I press on because you’ve already claimed me.", "Paul says he forgets what’s behind. Here is what’s behind me that I need to leave there. Name it: a failure, a regret, something I’m proud of.", "I let it go. I don’t want to keep looking back.", "Reaching forward to what’s ahead, I press on toward the goal for the prize of your upward calling. Show me what’s ahead. Stretch me toward what you’ve called me to.", "Give me strength to keep going, even when I’m tired. Remind me that the goal is you. Amen."]}, {"prayShort": ["Take a slow breath. Think of where you feel your work isn’t seen.", "Lord, help me be steadfast, immovable, always abounding in your work, knowing my labor is not in vain in you.", "Thank you for the resurrection. Name the effort you’ve poured out.", "Remind me that you see. Amen."], "prayLong": ["Sit quietly. Think of something you’ve worked hard on without much visible result.", "Imagine planting a seed deep in the ground. Nobody sees it and nothing seems to happen. But it’s there.", "Lord, thank you that Christ is risen. Because of that, nothing done in your name is in vain. I praise you for it.", "Paul says my labor in the Lord is not in vain. Tell him where you feel discouraged. Tell him what you’ve poured yourself into.", "Make me steadfast and immovable. When I’m tempted to give up, remind me that you see.", "Help me abound in your work, not in my strength, but in yours. Thank you for noticing, Lord. Amen."]}, {"prayShort": ["Take a slow breath. Admit where you’re worn down.", "Lord, I won’t lose heart. Though my outer self is decaying, my inner self is renewed day by day.", "Help me look not at what’s seen but at what’s unseen and eternal.", "Renew me today. Amen."], "prayLong": ["Sit quietly. Notice how your body feels and what has been wearing on you lately.", "Imagine a jar of clay that’s cracked and worn on the outside. Inside, a light is shining, and it’s getting stronger each day.", "Lord, thank you that you renew my inner self day by day. I praise you for working in places no one sees.", "Paul says we don’t faint. Here is what’s wearing me down. Tell him all of it. Tell him what makes you want to give up.", "He calls our affliction light and momentary, compared with an eternal weight of glory. Help me see my troubles in light of eternity. I’m not saying they don’t matter. I’m asking you to put them in their place.", "Fix my eyes on what’s unseen but lasting. Teach me to value what you value. Renew me today, Lord. Amen."]}, {"prayShort": ["Take a slow breath. Tell him you love him.", "Lord, help me endure trial and stand the test, and receive the crown of life you promised to those who love you.", "I love you, in the middle of what I’m facing. Name it.", "Keep my love for you strong. Amen."], "prayLong": ["Sit still. Think about the hardest thing you’re facing right now.", "Imagine standing in the middle of a storm, and someone beside you says, hold on, it’s worth it.", "Lord, I love you. I say it in the middle of what’s hard. I praise you because you’re worthy of that love.", "James says blessed is the one who endures trial. Tell him what you’re enduring. Tell him what you’ve been tempted to do instead of staying faithful.", "Help me stand the test. Not by my strength, but by yours.", "Thank you for the crown of life you’ve promised to those who love you. Let that promise hold me up. Keep my love for you strong. Amen."]}], "Love": [{"prayShort": ["Take a slow breath. Read the list of what love is, slowly, in your mind.", "Lord, teach me to love like this: patient and kind, not envious or boastful, not proud, not keeping a record of wrongs.", "Name the description of love that’s hardest for you right now.", "Help me bear, believe, hope and endure for the people in my life. Amen."], "prayLong": ["Sit quietly. Think about someone you love, and imagine how you’d like to treat them today.", "Lord, thank you that you are the source of love. I praise you because you love me patiently and kindly.", "Paul says love is patient and kind, and doesn’t envy or brag. Here is the one I find hardest right now. Tell him which it is.", "Love is not proud, doesn’t behave rudely, doesn’t seek its own way, isn’t easily provoked, and keeps no record of wrongs. Forgive me for the times I’ve been impatient, proud, or keeping score. Name one now.", "Love doesn’t rejoice in unrighteousness, but rejoices with the truth. Teach me to love in the way you’ve described, not just in feeling, but in action.", "It bears all things, believes all things, hopes all things, endures all things. Help me do that for the people in my life.", "Thank you for loving me first. Amen."]}, {"prayShort": ["Take a slow breath. Remember that God is love.", "God, you are love. You showed it by sending your only Son so that I might live through him.", "Thank you. Name someone you find hard to love, and ask him to love them through you.", "Help me love from what I’ve received. Amen."], "prayLong": ["Sit quietly. Think about the love you’ve received, from people and from God.", "Imagine a spring of water that never runs dry. It’s the source of every drop of love you’ve ever known.", "Lord, I praise you because you are love. John says love is of God, and everyone who loves is born of God and knows God. It isn’t just something you do. It’s who you are.", "Thank you for sending your only Son into the world so that I might live through him. Thank you for what it cost.", "Here is someone I find hard to love. Name them to him. Tell him why.", "Love them through me. I can’t do it on my own, but you can.", "Fill me up again, so that I have something to give. Amen."]}, {"prayShort": ["Take a slow breath. Think of how Jesus has loved you.", "Jesus, you gave a new commandment: love one another, even as you have loved us.", "By this everyone will know we’re your disciples. Let people see you in how I love.", "Name one person you’ll love as he loved you today. Amen."], "prayLong": ["Sit quietly. Recall a time Jesus showed you love: when he forgave you, helped you, stayed near.", "Imagine standing among his disciples that night, hearing him say, a new commandment I give to you, that you love one another, even as I have loved you.", "Lord Jesus, thank you for loving me first. I praise you for your patience, your kindness and your sacrifice.", "Here is someone I could love better. Name them to him. Tell him what makes it hard.", "Show me what love looks like for them today: a word, a visit, a favor, forgiveness.", "You said that by this everyone will know that we are your disciples, if we have love for one another. Make love the mark of my life. Thank you, Jesus. Amen."]}, {"prayShort": ["Take a slow breath. Think of someone you could serve.", "Lord, help me be earnest in my love, because love covers a multitude of sins.", "Make me hospitable without grumbling, and show me how to serve with the gift you gave me.", "Name who you’ll welcome or help this week. Amen."], "prayLong": ["Sit quietly. Think of the gifts God has given you: skills, time, a home, a listening ear.", "Imagine opening your door to someone who needs a place at the table. You’re glad they came.", "Lord, thank you for the grace you’ve given me. Peter calls me a good steward of your grace in its various forms. I praise you because you give generously.", "He says to be earnest in love, because love covers a multitude of sins. Here is someone I’ve been slow to forgive or cover for. Name them to him.", "Be hospitable, he says, without grumbling. Where I’ve grumbled, give me a willing heart. Show me who needs my table, my time or my help this week.", "Here is a gift you’ve given me. Name it. Tell him how you might use it to serve someone else.", "Let love cover what needs covering. Thank you, Lord. Amen."]}, {"prayShort": ["Take a slow breath. Name a fear that holds you back from loving.", "Lord, perfect love casts out fear. Help me love because you first loved me.", "Fill me with your love so there’s no room for fear.", "Thank you. Amen."], "prayLong": ["Sit quietly. Think of a relationship where fear has made you cautious.", "Imagine standing in a doorway, afraid to step through. Someone you trust stands behind you with a hand on your shoulder and says, go on, I’m with you.", "Lord, I praise you because your love is perfect. It doesn’t depend on my performance, and it doesn’t run out.", "John says there’s no fear in love, but perfect love casts out fear, because fear has to do with punishment. Here is what I’m afraid of in loving. Tell him plainly. Name the hurt you’re protecting yourself from.", "I receive your love again. I’m held, even when I’m afraid. Help me believe it.", "We love, because you first loved us. Give me courage to love, even when it’s risky. Let your love push out my fear. Thank you for loving me first. Amen."]}, {"prayShort": ["Take a slow breath. Tell God you love him.", "Lord, I love you with all my heart, all my soul and all my mind.", "Help me love my neighbor as myself. Name your neighbor today.", "Show me what that looks like. Amen."], "prayLong": ["Sit quietly. Tell God you love him in your own words, not as a formula, but as truthfully as you can.", "Lord, I love you with all my heart, with all my soul and with all my mind. Where my love is weak, strengthen it. I praise you because you loved me first and you’re worthy of all my heart.", "Now think of the people around you, the ones you see daily and the ones you’d rather avoid. Name a few.", "Jesus says the second commandment is like the first: love your neighbor as yourself. Teach me to love them with the same patience, care and attention I give to my own needs.", "Show me one thing I can do today to love a neighbor. Give me the courage to do it.", "Thank you, Lord. Amen."]}, {"prayShort": ["Take a slow breath. Remember what Jesus gave for you.", "Jesus, you said no one has greater love than this, that someone lay down his life for his friends. Thank you for doing it for me.", "Name what you could lay down for someone today.", "Help me love like that. Amen."], "prayLong": ["Sit quietly. Think slowly about what it cost Jesus to love you.", "Jesus, I praise you. You said, love one another, even as I have loved you. You gave everything for people who didn’t deserve it, including me.", "Thank you for calling me your friend. I don’t take that lightly.", "You said greater love has no one than this, that someone lay down his life for his friends. Here is someone I’m called to love. Name them. Tell him what that might cost: my time, my comfort, my pride.", "Help me lay something down for them today. Not because I have to, but because you did it for me.", "Where I’ve loved only when it was easy, stretch me. Where I’ve been self-protective, soften me. Thank you, Jesus. Amen."]}], "Humility": [{"prayShort": ["Take a slow breath. Notice where self-interest shows up in your day.", "Lord, free me from selfish ambition and conceit. In humility, help me count others better than myself.", "Open my eyes to the interests of others.", "Name whose interests you can look to today. Amen."], "prayLong": ["Sit quietly. Think of the day ahead, and the people you’ll meet.", "Imagine seeing each of them with fresh eyes, as people with their own struggles, hopes and needs.", "Lord, thank you for the humility of Jesus. I praise you because you put others first, and you showed me how.", "Paul says to do nothing from selfish ambition or conceit. I confess the places where I’ve been driven by ambition or by a need to be seen. Name them to him.", "He says in humility to regard others as more important than yourselves. Teach me to count others as more significant, not in a forced way, but out of real care.", "Don’t just look to your own interests, he says, but also to the interests of others. Show me whose interests I can look to today. Give me eyes to notice and a heart to act. Thank you, Lord. Amen."]}, {"prayShort": ["Take a slow breath. Bow your heart before God.", "Lord, you resist the proud but give grace to the humble. I submit myself to you.", "Draw near to me as I draw near to you. Name where pride gets in the way.", "Humble me, and lift me in your time. Amen."], "prayLong": ["Sit still. Imagine kneeling quietly before a king who is kind and good.", "Lord, I praise you because you resist the proud, but give grace to the humble. I need that grace.", "I confess the pride in my heart. Name where it shows up: in how you handle correction, how you compare, how you want to be seen.", "James says to be subject to God. I submit myself to you. I’m not in charge, and I don’t want to be.", "Draw near to God, and he will draw near to you. I’m coming close to you now. Draw near to me, as you’ve promised.", "Humble yourselves in the sight of the Lord, and he will exalt you. Lift me up in your time, not mine. I trust you with that. Thank you for your grace. Amen."]}, {"prayShort": ["Take a slow breath. Walk with God in your mind through today.", "Lord, you’ve shown me what’s good, and what you require: to act justly, to love mercy, and to walk humbly with my God.", "Name which of the three you most need today.", "Keep me close to you. Amen."], "prayLong": ["Sit quietly. Imagine walking beside God on a quiet path at an easy pace.", "Lord, thank you that you’ve shown me what’s good. I don’t have to guess what you require.", "You require me to act justly. Show me where I’ve been unfair, or where I’ve stayed silent when I should have spoken.", "You require me to love mercy. Soften my heart toward those who need kindness, including those I find hard.", "And to walk humbly with my God. Keep me from running ahead of you, or lagging behind. Keep me at your side.", "Which of these three do I most need today? Ask him, and listen. Thank you for walking with me, Lord. Amen."]}, {"prayShort": ["Take a slow breath. Think of where you want to be noticed.", "Jesus, you said the greatest among us will be our servant. Teach me to serve.", "I don’t need to be seen. Offer him the credit you’ve wanted.", "Give me a servant’s heart. Amen."], "prayLong": ["Sit quietly. Think of someone who serves quietly, without being asked or thanked.", "Imagine doing something helpful for someone, and no one ever knowing it was you. Notice how that feels.", "Jesus, I praise you because you came not to be served, but to serve. You’re the greatest, and you chose to wash feet.", "You said whoever exalts himself will be humbled, and whoever humbles himself will be exalted. I confess the times I’ve wanted recognition. Name where you’ve wanted credit.", "I offer that to you. I don’t need to be noticed. Your eyes on me are enough.", "Show me who I can serve today. Give me a quiet, willing heart. Thank you for your example. Amen."]}, {"prayShort": ["Take a slow breath. Come to God without comparing yourself to anyone.", "God, be merciful to me, a sinner.", "I’m not like the Pharisee, listing my goodness. I come like the tax collector, with nothing to offer.", "Thank you for hearing me. Amen."], "prayLong": ["Sit still. Imagine two figures in a large room. One stands tall, speaking confidently. The other stands at the back with his head down. Which one are you today?", "Lord, I come to you as I am. I don’t have a list to present. The Pharisee thanked you that he wasn’t like other men. I’m not better than anyone else.", "Here is where I compare myself to others. Name it. Here is where I’ve felt superior, or have wished I could be.", "The tax collector wouldn’t even lift his eyes. He beat his chest and said, God, be merciful to me, a sinner. I say it too, and I mean it. I need your mercy every day.", "Jesus said the tax collector went down to his house justified. Thank you that you hear the humble. You don’t turn away from honest hearts.", "Send me out justified by your grace, not my own record. Amen."]}, {"prayShort": ["Take a slow breath. Think about what Jesus gave up for you.", "Jesus, you didn’t grasp at equality with God, but emptied yourself, taking the form of a servant.", "You humbled yourself to death on a cross. Give me your mindset.", "Name what’s hard for you to give up. Amen."], "prayLong": ["Sit quietly. Think slowly about what Jesus left, and what he took on.", "Jesus, I praise you. Paul says you were in the form of God and didn’t consider equality with God a thing to be grasped. You had every right, and you chose to serve.", "You emptied yourself and took the form of a servant. You humbled yourself and became obedient to death, even death on a cross. Thank you for humbling yourself for me. I can’t fully understand it, but I receive it with gratitude.", "Here is what I find hard to give up: my rights, my reputation, my comfort, my way. Name it to him.", "Paul says to have this mind among yourselves, which was also in Christ Jesus. Give me your mind. Teach me to let go of what I’m clutching, for the sake of others.", "Show me one place today where I can choose to serve instead of being served. Thank you, Jesus. Amen."]}, {"prayShort": ["Take a slow breath. Picture Jesus kneeling with a towel.", "Jesus, you are Lord and Teacher, and you washed your disciples’ feet. Show me how to serve like you.", "Name someone whose feet you can wash this week.", "Give me a servant’s hands. Amen."], "prayLong": ["Sit quietly. Imagine the room where the disciples are gathered. Jesus gets up, takes a towel and a basin, and begins to wash their feet.", "Now imagine he comes to you. You might resist, as Peter did. Let him do it.", "Lord Jesus, thank you for serving me. I praise you because you are Lord and Teacher, and you stooped lower than anyone.", "You said, if I, the Lord and Teacher, have washed your feet, you also ought to wash one another’s feet. Here are the tasks I think are beneath me. Name them. Here is the person I find hard to serve.", "Forgive my pride. I want to follow your example, not just admire it.", "Show me one way to wash someone’s feet this week, a practical, quiet act of service. Thank you for the example you set. Amen."]}], "Rest": [{"prayShort": ["Take a slow breath. Admit that you’re tired.", "Jesus, I’m weary and burdened, and you said to come to you. I come for rest.", "I take your yoke. You’re gentle and lowly in heart.", "Give me rest for my soul. Amen."], "prayLong": ["Sit quietly. Let your shoulders drop and your breathing slow. Notice how tired you are.", "Imagine standing at the edge of a long road you’ve walked for a while. Jesus stands beside you and says, come to me.", "Lord Jesus, you said, come to me, all you who labor and are heavily burdened. I praise you because you’re gentle and lowly in heart. You don’t scold the weary. You welcome them.", "Here is what I’ve been carrying. Tell him about it, and be specific about what’s heavy.", "You said to take your yoke upon me and learn from you. I take your yoke. I want to walk with you, so that I’m not pulling alone. Your yoke is easy, and your burden is light.", "Give me rest for my soul, Lord. Not only a day off, but a deep rest from striving. Thank you for your invitation. Amen."]}, {"prayShort": ["Take a slow breath. Be quiet before God.", "Lord, my soul waits in silence for you alone. From you comes my salvation.", "You alone are my rock, my salvation and my fortress. I won’t be greatly shaken.", "Name where you’ve looked for rest elsewhere. Amen."], "prayLong": ["Sit still. Let silence settle. You don’t need to say anything yet.", "Imagine standing on a large flat rock with a strong wall around you. Wind is blowing outside, but it doesn’t reach you.", "Lord, I praise you as my rock, my salvation and my fortress. David says I won’t be greatly shaken, because you hold me.", "Here is where I’ve looked for rest in other places: busyness, entertainment, approval. Name them to him.", "I come back to you. My soul waits in silence for God alone. Quiet my heart.", "Hold me steady today. When I’m tempted to run to other things, bring me back. Thank you for being enough. Amen."]}, {"prayShort": ["Take a slow breath. Let go of what you’re trying to hold together.", "Lord, unless you build the house, those who build it labor in vain. I can’t build or guard anything without you.", "I rest from anxious toil, because you give sleep to those you love.", "Name what you’re afraid will fall apart. Amen."], "prayLong": ["Sit quietly. Think about what you’ve been working on, and how tightly you’ve been holding it.", "Imagine a builder laying bricks all day, worried that the house won’t stand. Then he notices that someone far greater is building alongside him.", "Lord, I praise you because you are the one who builds and the one who watches over the city. My work matters, but it isn’t what holds the world together.", "The psalm says it’s vain to rise up early, stay up late, eating the bread of toil. Here is where I’ve been working from anxiety. Name it to him. Tell him what you’re afraid will fall apart.", "I give it back to you. Show me what’s mine to do, and what’s yours.", "For you give sleep to your loved ones. Give me rest as a gift, not as a reward. Help me sleep, and help me stop. Thank you for loving me. Amen."]}, {"prayShort": ["Take a slow breath. Imagine Jesus inviting you to come away.", "Jesus, you said, come away by yourselves to a quiet place and rest awhile. Help me take it.", "Name where you need a quiet place this week.", "Lead me there. Amen."], "prayLong": ["Sit still. Imagine a quiet place by the water, away from the crowd. Jesus is there, waiting.", "He says to you, come away to a deserted place and rest awhile. There’s no hurry.", "Lord, thank you for inviting me to rest. The disciples had no time even to eat. I praise you because you don’t push me beyond what I can bear.", "Tell him how busy you’ve been. Tell him what has been pulling at you, the many coming and going.", "I confess that I often skip rest because I feel it’s unproductive. Forgive me for ignoring what you offer.", "Show me how to rest this week: a quiet hour, a walk, a day off. Help me make room for it. Thank you for caring for my body and my soul. Amen."]}, {"prayShort": ["Take a slow breath. Thank God for the gift of rest.", "Lord, you made heaven and earth in six days and rested on the seventh. Thank you for the Sabbath.", "Help me remember it and keep it holy.", "Name what keeps you from resting. Amen."], "prayLong": ["Sit quietly. Think about your week, and how rest fits in. Does it have a place?", "Imagine stepping into a day with no demands. The work is set down, and the day is simply open.", "Lord, I praise you as Creator, who made everything in six days and rested on the seventh. You’re not like a boss who never lets up.", "Remember the Sabbath day, to keep it holy. Here is what keeps me from resting. Name it: guilt, busyness, fear of falling behind.", "Forgive me for treating rest as optional. Teach me that it’s part of how you made the world, and me.", "Show me what a day of rest could look like. Help me guard it, and help the people around me rest too. Thank you for the gift of Sabbath. Amen."]}, {"prayShort": ["Take a slow breath. Let go of what you’re trying to prove.", "Lord, there remains a Sabbath rest for your people. I rest from my own works, as you did from yours.", "I trust what you’ve done. Name where you’ve been trying to earn what he’s given.", "Bring me into your rest. Amen."], "prayLong": ["Sit still. Notice how much of your tension comes from needing to be enough.", "Imagine laying down a heavy ledger where you’ve been keeping track of all you’ve done and all you should have done. You set it down, and you feel lighter.", "Lord, thank you that the work is finished. In Christ, you’ve done what I couldn’t do. I praise you for it.", "Here is where I’ve been trying to earn your approval. Name it. Tell him how tired it’s made you.", "The writer says anyone who enters God’s rest also rests from his own works, as God did from his. I rest from my own works. I receive what you’ve given as a gift.", "Help me enter your rest, and keep trusting when I’m tempted to strive again. Thank you for your finished work. Amen."]}, {"prayShort": ["Take a slow breath. Speak gently to your own soul.", "Lord, you are gracious, righteous and merciful. You’ve dealt bountifully with me.", "Return to your rest, my soul. Name what has made it restless.", "Thank you, Lord, for being my resting place. Amen."], "prayLong": ["Sit quietly. Imagine speaking gently to someone you love who’s overwhelmed. Now speak that way to yourself: return to your rest, my soul.", "Lord, I praise you as gracious, righteous and merciful. You’ve been all of that to me.", "The psalmist says that when he was brought low, you saved him. Think of a time you were low and he lifted you. Thank him for it, specifically.", "Here is where my soul has been restless. Tell him about it. Tell him what has pulled you away from rest.", "For you have dealt bountifully with me. I come back to you now. I choose to rest, because you’ve dealt well with me.", "Thank you, Lord, for being my resting place. Amen."]}]};
THEMES.forEach(t => (PRAYERS_ALL[t.name]||[]).forEach((x,i) => Object.assign(t.days[i], x)));
const PBLOCKS = {"adoration": ["Lord, you are the God who was before the mountains were born and who will be when the last star has gone out. Nothing surprises you. Nothing is too big for you. And still you know my name. I bow my heart before you now, and I take my time doing it.", "Father, you are holy, and you are near. You are the Creator of everything I can see, and the Father of the One who came to find me. I praise you for your patience, your faithfulness and your power. Tell him in your own words what you admire about him today.", "Lord Jesus, you are the Word who became flesh, the Good Shepherd, the Lord of the living and the dead. All authority has been given to you, and you use it with gentleness. I worship you. You are worth more than anything I could ask for.", "God of all comfort, you are kind to the ungrateful and the wicked, and you have been kind to me. Your mercies are new every morning. Great is your faithfulness. Let me stay here a moment and simply enjoy knowing you.", "Lord, you are the King who is also my friend. You hold the nations in your hand and you hold me. You don’t grow tired or weary. I’m glad that I don’t have to carry what only you can carry. Be praised today.", "Holy Spirit, you are the one who makes the words of Scripture alive in me and who prays for me when I don’t know what to say. Thank you for being with me. Fill me again, and teach me to pray. I praise you for being God with us.", "Father, Son and Holy Spirit, one God, I worship you. You were never lonely and you didn’t need us, and still you made us and loved us. That is grace from the beginning. I stand amazed at you, and I give you the praise I owe."], "verse": ["Come back to {ref} for a moment. Read it again slowly in your mind. Which word or phrase stays with you? Stay with it and say it to the Lord, as a prayer and not as information.", "Think again about {ref}. Where did this passage touch something real in you today? Don’t rush past it. Tell the Lord what you felt as you read it, even if it was resistance.", "Let {ref} sit in the quiet for a moment. If it were written to you personally today, what would it be saying? Say that to God and ask him to make it true in you.", "Return to {ref}. Is there a promise in it that you’ve been slow to believe? Or an instruction you’ve been slow to follow? Tell him which one it is, and ask for help.", "Hold {ref} in your mind again. What does this passage show you about who God is? Tell him what you see, and thank him for it. Then ask what it shows you about who you are in him.", "Take a moment with {ref}. Is there a person you thought of while reading it? Ask the Lord why they came to mind, and what he might want you to do about it.", "Look once more at {ref}. Take one sentence from it and make it your own prayer for the rest of today. Say it slowly. Say it again."], "thanks": ["Lord, thank you for the ordinary gifts: a roof, a meal, breath in my lungs, the people who answer when I call. I often take these for granted. Name three things now that you’re grateful for, big or small, and tell him you see them as gifts.", "Thank you for every time you carried me and I didn’t notice. Looking back, I can see your hand in more than I realized. Think of a moment from this past year where he held you. Thank him for it specifically.", "Thank you for your word. Thank you that I can read it, and that it still speaks after all these centuries. Thank you for the Spirit who helps me understand it. Thank you for the church and the people who showed me Jesus.", "Lord, thank you for answered prayer, and for the prayers answered differently from what I asked. In hindsight, you knew best. Think of one prayer like that, and say thank you.", "Thank you for the people in my life. Think of two or three faces. Thank God for each one, and for what they’ve brought you. If someone is hard to be thankful for, thank him anyway for what he is teaching you through them.", "Thank you for forgiveness. Every time I came back, you were there. I haven’t had to earn my way home. Thank you for the cross, for the empty tomb, and for the hope of resurrection. Receive my thanks.", "Lord, thank you for today. It’s a gift, and not one I’ve earned. Thank you for the strength to meet it, and for the quiet moment I’m having with you right now. Let thankfulness be what I carry out of here."], "confession": ["Lord, I need to be honest with you. You see everything already, so I don’t need to pretend. Tell him now where you’ve fallen short this week: in words, in attitudes, in what you left undone. Don’t hurry. He is patient with you.", "Forgive me for the times I’ve put myself first, for the things I said when I should have stayed silent, and for the things I didn’t say when I should have spoken. Name one that weighs on you. Then hear him say that if we confess, he is faithful and just to forgive.", "Search me, God, and know my heart. Show me anything in me that grieves you: bitterness I’m holding, a habit I keep returning to, a person I’ve avoided. Wait a moment and let him show you. Then lay it down.", "I’m sorry for the times I’ve trusted my own plans over yours, and for the times I said I trusted you but didn’t act like it. Forgive me, and rebuild my trust where it’s broken.", "Lord, forgive me for how easily I judge others and excuse myself. Forgive me for the times I’ve kept a record of wrongs. Soften me. Make me quick to forgive, as I’ve been forgiven.", "Where I’ve been distracted, forgive me. Where I’ve been proud, humble me. Where I’ve been afraid, steady me. Tell him which of these fits today, and receive his mercy. There is no condemnation for those who are in Christ Jesus.", "I bring you what I’d rather hide. You already know it. Thank you that your forgiveness is complete, that you remember our sins no more, and that you don’t hold them over me. I receive that forgiveness now, and I stand up clean."], "inter1": ["Now I pray for the people closest to me. Lord, bless my family. Name them one by one. Meet each of them where they are. Where there’s tension, bring peace. Where there’s pain, bring comfort. Where someone doesn’t know you yet, draw them gently.", "I lift up my friends to you. Think of two or three by name. Lord, you know what they’re facing that I don’t. Give them strength, wisdom and joy. Make me a real friend to them, one who prays and shows up.", "Father, I pray for those I live with and work alongside. Bless my home. Bless the people I see every day. Help me be patient with them. Let your peace rest on my house and on my work.", "Lord, watch over the people I love who are far away. Distance makes me feel helpless, but you’re with them. Protect them, guide them, and let them feel loved today. Name them and ask whatever is on your heart.", "I pray for someone who is struggling right now. You know who it is. Hold them, Lord. Give them what I can’t. Show me whether there’s something I can do, even a message or a prayer for them tomorrow too.", "I pray for those who’ve hurt me. It’s hard. But you said to pray for those who mistreat us. So, Lord, I ask for good for them. Where I can’t yet mean it, give me the willingness to want to.", "I pray for the young and the old in my life. Bless the children you’ve put near me, and keep them safe. Bless the elderly, who may be lonely. Show me who needs a visit or a call this week."], "inter2": ["Lord, I pray for our church, the Jesus is Lord family. Strengthen our pastors and leaders. Give them wisdom, rest and courage. Let our gatherings be places where people meet you, and where no one is overlooked.", "Father, I pray for believers who are struggling in their faith right now: those who are tired, doubting, or hurt by the church. Meet them with your kindness. Bring people alongside them. Don’t let them walk alone.", "I pray for those who don’t know you yet. Think of one person by name. Lord, soften their heart, open their eyes, and send someone to them who shares the good news with love. Use me if you want to.", "Lord, I pray for your church around the world, especially for those who suffer for following Jesus. Where Christians are persecuted, give them courage and protect them. Remind them that they’re not forgotten.", "I pray for young people in my church and in my city. There are so many voices pulling at them. Anchor them in Jesus. Raise up a generation who love you, know your word, and aren’t ashamed of the gospel.", "Father, I pray for unity among your people. Where there’s division, bring humility and forgiveness. Help us love one another as Christ loves us, so the world will know we are his disciples.", "Lord, I pray for those who serve in my church quietly: those who set up, clean up, welcome people, pray, give. You see what no one else notices. Reward them and refresh them."], "inter3": ["Now I pray for the Netherlands, my country. Lord, have mercy on us. Where people have turned away from you, draw us back. Bring a fresh hunger for you into our cities and villages, and let the church be a light.", "Father, I pray for the leaders of my country and the people who make decisions for the rest of us. Give them wisdom and integrity. Let justice be done. Help us to live quiet and peaceful lives in godliness.", "I pray for those who are lonely, anxious or burned out in a country that is busy and often secular. Lord, many people are searching and don’t know what for. Let them find you. Use ordinary believers like me.", "Lord, I pray for the poor and for those who’ve come to our country looking for safety. Give me and your church a heart of welcome. Show us what it means to love our neighbor in practical ways.", "Father, I pray for the world. You see the wars, the hunger and the injustice. I don’t know how to fix them, but I know you hear. Bring peace where there’s conflict, and comfort where there’s grief. Come, Lord Jesus.", "I pray for those who are sick, in hospitals or at home, and for those who care for them. Bring healing where you will. Bring comfort where healing doesn’t come. Be near to those who are dying, and to those who will mourn them.", "I pray for teachers, doctors, farmers, builders, and everyone whose work keeps life going. Bless their work. Help me see that my own work, however small it seems, can be done for you."], "surrender": ["Lord, I give you today. Here is what’s on my schedule. Tell him what you’re facing: the meetings, the conversations, the decisions. I don’t know how any of it will go, but I know who walks with me through it.", "I surrender my plans to you. If you open a door, let me walk through it. If you close one, help me trust you. Make me willing to follow, even when I can’t see far ahead.", "Here is what I’m holding onto too tightly. Name it. I’m opening my hands. I give it to you, and I trust you with it. Whatever you do with it, I know you are good.", "Take my mind and my worries. Take my body and my energy. Take my words, especially the ones I’ll say when I’m tired or annoyed. Use all of me for your glory today.", "Lord, whatever you want to do in my life this season, I say yes. Even if it’s not what I would choose. Give me a heart that says, not my will, but yours be done.", "I give you my future. The things I’m afraid of, and the things I’m hoping for. Hold them. You see the whole story, and I see a few lines. I choose to trust the Author.", "Make me available to you today. If someone needs a kind word, let me notice. If someone needs help, let me stop. If you want to speak to me, let me listen. I am yours."], "close": ["Lord, as I finish, I stay a moment in your presence. There’s no hurry. Let your peace guard my heart and mind in Christ Jesus. Go with me into the day.", "Thank you for listening, Father. Thank you that you never tire of me. I take your peace with me when I stand up from here, and I trust you for all I’ve prayed.", "Jesus, you are Lord. Over my day, my home, my work, my relationships, my future. Let that be true in the small moments today, not just in this one.", "May the grace of the Lord Jesus Christ, the love of God, and the fellowship of the Holy Spirit be with me today. I’m not going alone.", "Lord, I’ve said what I can. You know what I couldn’t put into words. The Spirit intercedes for me with groans too deep for words, so I rest in that.", "I’ll end where I began: you are good, and I am loved. Let that be the thing I remember when the day pulls at me.", "Father, seal this time in my heart. Let what I’ve prayed bear fruit in how I live. Let me walk in a way that pleases you."]};

function esc(s){ return String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function ymd(d){ return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0"); }
function todayStr(){ return ymd(new Date()); }
function dayNum(str){ const [y,m,d] = str.split("-").map(Number); return Math.floor(Date.UTC(y,m-1,d) / 86400000); }
function contentFor(str){
  // 2024-01-01 was a Monday. Each Monday starts a new week and the next theme.
  const n = dayNum(str) - dayNum("2024-01-01");
  const week = Math.floor(n / 7), day = ((n % 7) + 7) % 7;
  const theme = THEMES[((week % THEMES.length) + THEMES.length) % THEMES.length];
  return { theme, day, d: theme.days[day] };
}
function prettyDate(str){
  const [y,m,d] = str.split("-").map(Number);
  return new Date(y,m-1,d).toLocaleDateString(undefined,{weekday:"long",month:"long",day:"numeric"});
}
function entryFor(str){ return S.entries.find(e => e.entry_date === str); }
function computeStreak(){
  const done = new Set(S.entries.filter(e => e.prayer_completed).map(e => e.entry_date));
  let n = dayNum(todayStr()); if (!done.has(todayStr())) n -= 1;
  let c = 0;
  const strOf = k => { const d = new Date(k*86400000); return d.getUTCFullYear()+"-"+String(d.getUTCMonth()+1).padStart(2,"0")+"-"+String(d.getUTCDate()).padStart(2,"0"); };
  while (done.has(strOf(n))) { c++; n--; }
  return c;
}

/* ================= DATA ================= */
async function loadEntries(){
  const { data, error } = await sb.from("journal_entries").select("*").order("entry_date",{ascending:false});
  if (error) { S.loadErr = error.message; return; }
  S.loadErr = null; S.entries = data || [];
}
function blankEntry(str, ref){
  return { entry_date:str, passage_ref:ref, prayer_minutes:null, prayer_completed:false, mood:null,
           day_note:"", prayer_note:"", answers:[], heart_note:"" };
}
async function saveEntry(entry){
  const row = { ...entry, user_id: S.user.id };
  delete row.id; delete row.created_at; delete row.updated_at;
  setStatus("Saving…");
  const { data, error } = await sb.from("journal_entries").upsert(row,{onConflict:"user_id,entry_date"}).select().single();
  if (error) { setStatus("Not saved: " + error.message, true); return false; }
  const i = S.entries.findIndex(e => e.entry_date === data.entry_date);
  if (i >= 0) S.entries[i] = data; else { S.entries.push(data); S.entries.sort((a,b)=> b.entry_date.localeCompare(a.entry_date)); }
  setStatus("Saved"); refreshStreak();
  return true;
}
function setStatus(msg, bad){ const el = document.getElementById("status"); if (el){ el.textContent = msg; el.className = "status small " + (bad ? "err" : "muted"); } }
function refreshStreak(){ const el = document.getElementById("streak"); if (el) el.innerHTML = "🔥 <b>" + computeStreak() + "</b> day streak"; }

const verseCache = {};
async function loadVerse(ref){
  if (verseCache[ref]) return verseCache[ref];
  try {
    const cached = sessionStorage.getItem("v:" + TRANSLATION + ":" + ref);
    if (cached) return (verseCache[ref] = JSON.parse(cached));
  } catch(e){}
  const r = await fetch("https://bible-api.com/" + encodeURIComponent(ref) + "?translation=" + TRANSLATION);
  if (!r.ok) throw new Error("verse lookup failed");
  const j = await r.json();
  const out = { verses: j.verses || [], name: j.translation_name || TRANSLATION };
  verseCache[ref] = out;
  try { sessionStorage.setItem("v:" + TRANSLATION + ":" + ref, JSON.stringify(out)); } catch(e){}
  return out;
}

function prayerSteps(c, mins){
  const d = c.d;
  if (mins === 2) return [{ t: "Pray", body: d.p2, prayer: true }];
  const adore = { t: "Adoration", body: FIXED.adoration };
  const theme = { t: "Today’s verse", body: d.theme };
  const req = { t: "Requests", body: d.request };
  if (mins === 5) return [adore, theme, req];
  return [adore,
    { t: "Thanksgiving", body: FIXED.thanks }, theme,
    { t: "Silence", body: "Be still and listen.", silence: 60 },
    { t: "Confession", body: FIXED.confession }, req,
    { t: "Silence", body: "Be still and listen.", silence: 60 }];
}

// "Read" checkmarks are kept on this device only
function viewedSet(str){ try { return new Set(JSON.parse(localStorage.getItem("viewed:" + str) || "[]")); } catch(e){ return new Set(); } }
function markViewed(str, k){ try { const s = viewedSet(str); s.add(k); localStorage.setItem("viewed:" + str, JSON.stringify([...s])); } catch(e){} }

function ensureCur(){
  const str = todayStr();
  if (!S.cur || S.cur.entry_date !== str) {
    const ex = entryFor(str);
    S.cur = ex ? JSON.parse(JSON.stringify(ex)) : blankEntry(str, contentFor(str).d.ref);
  }
  return S.cur;
}
function collect(){
  const cur = S.cur, d = contentFor(todayStr()).d, g = id => document.getElementById(id);
  if (g("day")) cur.day_note = g("day").value;
  if (g("pn")) cur.prayer_note = g("pn").value;
  if (g("heart")) cur.heart_note = g("heart").value;
  if (g("q0")) {
    const prev = {}; (cur.answers || []).forEach(a => prev[a.q] = a.a);
    cur.answers = d.qs.map((q,i) => ({ q, a: g("q"+i) ? g("q"+i).value : (prev[q] || "") })).filter(x => x.a.trim());
  }
  cur.passage_ref = d.ref;
}
async function collectAndSave(){
  if (!S.cur) return;
  if (!["day","pn","heart","q0"].some(id => document.getElementById(id))) return;
  collect(); await saveEntry(S.cur);
}

/* ================= READER ================= */
const FS = ["1.2rem","1.45rem","1.75rem"];
function fsIdx(){ try { const v = localStorage.getItem("fs"); const n = Number(v); return v !== null && n >= 0 && n < 3 ? n : 1; } catch(e){ return 1; } }
function cycleFs(){
  try { localStorage.setItem("fs", String((fsIdx()+1) % 3)); } catch(e){}
  const el = document.getElementById("reader"); if (el) el.style.setProperty("--rfs", FS[fsIdx()]);
}
function closeReader(){
  const el = document.getElementById("reader"); if (el) el.remove();
  S.reader = null; document.body.style.overflow = "";
}
function versePages(verses){
  const pages = []; let cur = [], len = 0;
  verses.forEach(v => {
    const t = String(v.text).replace(/\s+/g," ").trim();
    if (cur.length && len + t.length > 260) { pages.push({ t:"verse", verses:cur }); cur = []; len = 0; }
    cur.push({ n:v.verse, text:t }); len += t.length;
  });
  if (cur.length) pages.push({ t:"verse", verses:cur });
  return pages;
}
function prayerPages(d, mins){
  const open = "Take a slow breath. The Lord is here with you.";
  if (mins === 2) return d.prayShort || [open, d.p2];
  if (!d.prayLong) return [open, FIXED.adoration, d.theme, d.request, d.p2];
  const pk = (name, off) => PBLOCKS[name][((d._i||0) + (d._t||0) * 3 + off) % 7];
  const core = d.prayLong.slice();
  core[core.length - 1] = core[core.length - 1].replace(/\s*Amen\.?\s*$/, "");
  const ref = d.ref || "today’s passage";
  return [].concat(
    core.slice(0, 2),
    pk("adoration", 0),
    core.slice(2),
    pk("verse", 1).replace("{ref}", ref),
    d.request ? [d.request] : [],
    pk("thanks", 2), pk("confession", 3),
    pk("inter1", 4), pk("inter2", 5), pk("inter3", 6),
    pk("surrender", 1), pk("close", 2),
    d.p2 || "Amen."
  );
}
function openReader(k, mins){
  closeReader();
  const c = contentFor(todayStr()), d = c.d;
  const R = S.reader = { k, i:0, pages:[], loading:false, mins:mins||null, version:"" };
  if (k === "prayer") R.pages = prayerPages(d, mins).map(t => ({ t:"text", text:t }));
  if (k === "quote") {
    R.pages = [{ t:"loading" }]; R.loading = true;
    loadVerse(d.quote).then(v => {
      if (S.reader !== R) return;
      R.version = v.name; R.loading = false;
      R.pages = [{ t:"quote", text: v.verses.map(x => String(x.text).replace(/\s+/g," ").trim()).join(" "), ref:d.quote }];
      drawReader();
    }).catch(() => { if (S.reader !== R) return; R.loading = false; R.pages = [{ t:"error", ref:d.quote }]; drawReader(); });
  }
  if (k === "passage") {
    R.pages = [{ t:"intro" }]; R.loading = true;
    loadVerse(d.ref).then(v => {
      if (S.reader !== R) return;
      R.version = v.name; R.loading = false; R.pages = [R.pages[0], ...versePages(v.verses)];
      drawReader();
    }).catch(() => { if (S.reader !== R) return; R.loading = false; R.pages = [R.pages[0], { t:"error", ref:d.ref }]; drawReader(); });
  }
  document.body.style.overflow = "hidden";
  drawReader();
}
function drawReader(){
  const R = S.reader; if (!R) return;
  const c = contentFor(todayStr()), d = c.d;
  let el = document.getElementById("reader");
  if (!el) { el = document.createElement("div"); el.id = "reader"; el.className = "reader"; document.body.appendChild(el); }
  el.style.setProperty("--rfs", FS[fsIdx()]);
  const heading = R.k === "prayer" ? "Prayer" : (R.k === "quote" ? d.quote : d.ref);
  const head = `<div class="rhead"><button class="rbtn" id="aa" aria-label="Text size">Aa</button><div class="rtitle">${esc(heading)}</div><button class="rbtn" id="rx" aria-label="Close">✕</button></div>`;

  if (R.k === "devotional" || R.k === "prayer") {
    const src = R.k === "prayer" ? R.pages.map(x => x.text) : (d.devLong || [d.dev]);
    const paras = src.map(p => `<p>${esc(p)}</p>`).join("");
    el.innerHTML = head + `<div class="rscroll"><h1 class="dtitle">${esc(R.k === "prayer" ? "Prayer" : (d.devTitle || d.ref))}</h1>${paras}
      <button class="primary" id="rcomplete" style="width:100%;margin-top:28px">Complete</button></div>`;
  } else {
    const p = R.pages[R.i], last = R.i === R.pages.length - 1 && !R.loading;
    const bar = R.pages.length > 1 ? `<div class="rbar">${R.pages.map((_,n)=>`<i class="${n<=R.i?"on":""}"></i>`).join("")}</div>` : "";
    let page = "";
    if (p.t === "intro") page = `<div class="intro"><h2 class="ititle">${esc(d.devTitle || d.ref)}</h2><div class="iref">${esc(d.ref)}</div>
      <p>Our theme this week is “${esc(c.theme.name)}.”</p>${d.intro ? `<p>${esc(d.intro)}</p>` : ""}</div>`;
    else if (p.t === "verse") page = `<div class="vtext">${p.verses.map(v => `<span class="vn">${esc(v.n)}</span>${esc(v.text)}`).join(" ")}</div>`;
    else if (p.t === "quote") page = `<div class="qtext">${esc(p.text)}</div><div class="qref">${esc(p.ref)} · ${esc(R.version)}</div>`;
    else if (p.t === "text") page = `<div class="ptext">${esc(p.text)}</div>`;
    else if (p.t === "error") page = `<p class="muted" style="text-align:center">Couldn’t load the verse text. Read <b>${esc(p.ref)}</b> in your own Bible.</p>`;
    else page = `<p class="muted" style="text-align:center">Loading…</p>`;
    const foot = last ? `<button class="primary" id="rcomplete" style="width:100%">Complete</button>`
      : `<div class="hint">${p.t === "verse" ? esc("Bible version: " + R.version) + "<br>" : ""}Tap anywhere to continue</div>`;
    el.innerHTML = head + bar + `<div class="rtap" id="rtap">${page}</div><div class="rfoot">${foot}</div>`;
    document.getElementById("rtap").onclick = e => {
      if (e.target.closest("button")) return;
      const r = e.currentTarget.getBoundingClientRect();
      if (e.clientX - r.left < r.width * 0.3) readerPrev(); else readerNext();
    };
  }
  document.getElementById("aa").onclick = cycleFs;
  document.getElementById("rx").onclick = () => { const k = R.k; closeReader(); if (k !== "prayer") S.sub = null; render(); };
  const cb = document.getElementById("rcomplete"); if (cb) cb.onclick = readerComplete;
}
function readerPrev(){ const R = S.reader; if (R && R.i > 0) { R.i--; drawReader(); } }
function readerNext(){
  const R = S.reader; if (!R || R.loading) return;
  if (R.i >= R.pages.length - 1) return readerComplete();
  R.i++; drawReader();
}
async function readerComplete(){
  const R = S.reader; if (!R) return;
  const k = R.k, mins = R.mins;
  closeReader();
  if (k === "prayer") {
    ensureCur(); S.cur.prayer_completed = true; S.cur.prayer_minutes = mins;
    await saveEntry(S.cur);
  } else markViewed(todayStr(), k);
  S.sub = null; render();
}

function entryText(e){ return [e.passage_ref, e.day_note, e.prayer_note, e.heart_note, ...(e.answers||[]).map(a=>a.q+" "+a.a)].join(" ").toLowerCase(); }
function preview(e){
  return e.heart_note || e.day_note || e.prayer_note || ((e.answers||[])[0] && e.answers[0].a) || "";
}
function renderJournal(){
  if (S.detail) return renderDetail(S.detail);
  const q = S.search.trim().toLowerCase();
  const list = S.entries.filter(e => !q || entryText(e).includes(q));
  $app.innerHTML = `
    <div class="head"><h1>Journal</h1></div>
    <input id="search" type="search" placeholder="Search your entries" value="${esc(S.search)}" aria-label="Search your entries">

      : `<p class="muted">${q ? "No entries match that search." : "No entries yet. Write something on the Today tab and it will show up here."}</p>`}
    ${S.loadErr ? `<p class="err">Couldn’t load entries: ${esc(S.loadErr)}</p>` : ""}`;
  const s = document.getElementById("search");
  s.oninput = () => { S.search = s.value; const pos = s.selectionStart; renderJournal(); const n = document.getElementById("search"); n.focus(); n.setSelectionRange(pos,pos); };
  $app.querySelectorAll("[data-d]").forEach(b => b.onclick = () => { S.detail = b.dataset.d; renderJournal(); window.scrollTo(0,0); });

function renderDetail(str){
  const e = entryFor(str); if (!e) { S.detail = null; return renderJournal(); }
  const block = (label, text) => text && text.trim() ? `<div class="qa"><div class="q">${esc(label)}</div><div class="a">${esc(text)}</div></div>` : "";
  $app.innerHTML = `
    <button class="link" id="back">‹ Journal</button>
    <div class="head"><div><h1>${esc(prettyDate(e.entry_date))}</h1><div class="muted">${esc(e.passage_ref)}</div></div><div style="font-size:2rem">${e.mood ? MOODS[e.mood-1] : ""}</div></div>
    ${e.prayer_completed ? `<p class="done-msg">✓ Prayed${e.prayer_minutes ? " for " + e.prayer_minutes + " min" : ""}</p>` : ""}
    ${block("What happened today", e.day_note)}
    ${block("Your prayer", e.prayer_note)}
    ${(e.answers||[]).map(a => block(a.q, a.a)).join("")}
    ${block("What’s on your heart", e.heart_note)}
    <div style="height:12px"></div>
    <button class="danger" id="del">Delete this entry</button>`;
  document.getElementById("back").onclick = () => { S.detail = null; renderJournal(); };
  document.getElementById("del").onclick = async () => {
    if (!confirm("Delete this entry? This can’t be undone.")) return;
    const { error } = await sb.from("journal_entries").delete().eq("id", e.id);
    if (error) { alert("Couldn’t delete: " + error.message); return; }
    S.entries = S.entries.filter(x => x.id !== e.id); S.detail = null; renderJournal();
  };
}

    </div>
    <p class="muted small" style="margin-top:20px">Tip: on iPhone, tap Share, then Add to Home Screen. It opens like an app.</p>`;
  document.getElementById("export").onclick = () => {
    const blob = new Blob([JSON.stringify(S.entries, null, 2)], { type: "application/json" });
    const a = document.createElement("a"); a.href = URL.createObjectURL(blob);
    a.download = "jil-glorify-journal-" + todayStr() + ".json"; document.body.appendChild(a); a.click(); a.remove();
  };
  document.getElementById("out").onclick = async () => { await sb.auth.signOut(); S.user = null; S.entries = []; S.cur = null; S.sub = null; renderAuth(); };
}

/* ================= ROUTER ================= */
function render(){
  if (S.tab !== "today") { stopTimer(); }
  if (S.tab === "today") renderToday(); else if (S.tab === "journal") renderJournal(); else renderSettings();
  $nav.querySelectorAll("button").forEach(b => b.classList.toggle("on", b.dataset.tab === S.tab));
  window.scrollTo(0,0);
}
$nav.querySelectorAll("button").forEach(b => b.onclick = async () => {
  if (S.tab === "today") { clearTimeout(S.saveT); try { await collectAndSave(); } catch(e){} }
  S.tab = b.dataset.tab; S.detail = null; S.prayer = null; S.sub = null; render();
});
async function start(){
  $nav.hidden = false;
  S.cur = null; S.sub = null;
  await loadEntries();
  S.tab = "today"; render();
}
(async function init(){
  const { data } = await sb.auth.getSession();
  if (data.session) { S.user = data.session.user; await start(); } else renderAuth();
})();
</script>
</body>
</html>
