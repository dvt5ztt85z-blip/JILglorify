<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1B1411">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="JIL Glorify">
<title>JIL Glorify</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F6EBDC; --surface:#FFF8EE; --ink:#3B2A1E; --muted:#7A6552; --line:#E6D3BC;
  --accent:#A85F14; --accent-ink:#FFF8EE; --glow:#C98A2B; --soft:#F0DFC8; --danger:#A4372E;
  --serif:"Newsreader",Georgia,"Times New Roman",serif;
  --sans:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  box-sizing:border-box;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#1B1411; --surface:#2A201A; --ink:#F7EBDC; --muted:#BBA793; --line:#3F3128;
    --accent:#E9A650; --accent-ink:#1B1411; --glow:#F0B964; --soft:#37281F; --danger:#E58277;}
}
*,*::before,*::after{box-sizing:inherit}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:17px;line-height:1.5;-webkit-text-size-adjust:100%}
body{padding:env(safe-area-inset-top,0px) 0 calc(76px + env(safe-area-inset-bottom,0px))}
#app{max-width:640px;margin:0 auto;padding:16px 18px}
h1,h2,h3{font-family:var(--serif);font-weight:500;margin:0;line-height:1.2}
h1{font-size:1.9rem}
h2{font-size:1.35rem;margin-bottom:8px}
h3{font-size:1.1rem;margin-bottom:6px}
p{margin:0 0 12px}
.muted{color:var(--muted)}
.small{font-size:.88rem}
section{margin:0 0 28px}
.head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin:8px 0 22px}
.streak{background:var(--soft);border-radius:999px;padding:6px 14px;font-weight:600;white-space:nowrap;color:var(--ink)}
.streak b{color:var(--glow)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px}
.verse{font-family:var(--serif);font-size:1.22rem;line-height:1.6;border-left:3px solid var(--glow);padding:2px 0 2px 16px;margin:12px 0}
.verse sup{font-family:var(--sans);font-size:.65rem;color:var(--muted);margin-right:3px}
.dev{font-family:var(--serif);font-size:1.12rem;line-height:1.65}
button{font:inherit;cursor:pointer;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:12px 16px;min-height:46px}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
button.link{background:none;border:none;color:var(--muted);text-decoration:underline;padding:8px 4px;min-height:40px}
button.danger{color:var(--danger)}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
button:disabled{opacity:.5;cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>*{flex:1 1 0}
.choice{display:flex;flex-direction:column;align-items:center;gap:2px;padding:14px 8px}
.choice b{font-size:1.4rem;font-family:var(--serif);font-weight:500}
.choice.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.stage{background:var(--soft);border-radius:14px;padding:16px;margin:12px 0}
.stage h3{margin-bottom:4px}
.timer{font-family:var(--serif);font-size:2.4rem;text-align:center;margin:6px 0}
.dots{display:flex;gap:6px;margin:0 0 10px}
.dots i{height:5px;flex:1;border-radius:3px;background:var(--line)}
.dots i.on{background:var(--accent)}
.prayer{font-family:var(--serif);font-size:1.2rem;line-height:1.6}
.done-msg{color:var(--glow);font-weight:600}
label{display:block;font-weight:600;margin:16px 0 6px}
.qtype{font-weight:500;color:var(--muted);font-size:.85rem;margin-left:6px}
textarea,input[type=email],input[type=password],input[type=search]{width:100%;font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px}
textarea{min-height:92px;resize:vertical}
.moods{display:flex;gap:8px}
.moods button{flex:1;font-size:1.5rem;padding:10px 0}
.moods button.on{background:var(--accent);border-color:var(--accent)}
.status{min-height:1.4em;text-align:right}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:center;padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px))}
nav[hidden]{display:none}
nav .inner{display:flex;width:100%;max-width:640px;gap:6px}
nav button{flex:1;border:none;background:none;padding:10px 4px;color:var(--muted);font-weight:500}
nav button.on{color:var(--accent);font-weight:700;background:var(--soft)}
.entry{display:block;width:100%;text-align:left;margin:0 0 10px;padding:14px 16px}
.entry .top{display:flex;justify-content:space-between;gap:8px;font-weight:600}
.entry .pv{color:var(--muted);font-size:.92rem;margin-top:4px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.qa{margin:0 0 14px}
.qa .q{font-weight:600}
.qa .a{white-space:pre-wrap;font-family:var(--serif);font-size:1.08rem}
.err{color:var(--danger);margin:10px 0}
.center{min-height:70vh;display:flex;flex-direction:column;justify-content:center}

.topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:4px 0 20px}
.topbar .brand{font-family:var(--serif);font-size:1.25rem;font-weight:500}
.topbar .spacer{min-width:96px}
.tile{display:flex;align-items:center;gap:14px;width:100%;text-align:left;margin:0 0 12px;padding:20px 18px;border-radius:20px;background:var(--surface);border:1px solid var(--line);min-height:68px}
.tile .ic{font-size:1.5rem;width:34px;text-align:center}
.tile .tl{flex:1;font-weight:600;font-size:1.08rem}
.tile .ck{width:30px;height:30px;border-radius:50%;background:var(--glow);color:var(--accent-ink);display:grid;place-items:center;font-weight:700}
.bigquote{font-family:var(--serif);font-size:1.7rem;line-height:1.45;margin:18px 0 14px}
.qref{color:var(--muted)}

.reader{--rfs:1.45rem;position:fixed;inset:0;z-index:100;background:var(--bg);color:var(--ink);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
.rhead{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 16px}
.rtitle{font-weight:600;text-align:center;flex:1}
.rbtn{width:46px;height:46px;min-height:46px;border-radius:50%;padding:0;display:grid;place-items:center;background:var(--surface);border:1px solid var(--line);font-size:1rem}
.rbar{display:flex;gap:5px;padding:0 18px 10px}
.rbar i{height:4px;flex:1;border-radius:3px;background:var(--line)}
.rbar i.on{background:var(--glow)}
.rtap{flex:1;display:flex;flex-direction:column;justify-content:center;padding:0 24px;overflow-y:auto;cursor:pointer;-webkit-tap-highlight-color:transparent}
.rfoot{padding:14px 24px calc(20px + env(safe-area-inset-bottom,0px))}
.hint{text-align:center;color:var(--muted);font-size:.92rem}
.vtext{font-family:var(--serif);font-size:var(--rfs);line-height:1.6}
.vn{font-family:var(--sans);font-size:.7em;color:var(--glow);font-weight:600;margin-right:6px}
.ptext{font-family:var(--serif);font-size:var(--rfs);line-height:1.6}
.qtext{font-family:var(--serif);font-size:calc(var(--rfs) * 1.25);line-height:1.5;margin-bottom:16px}
.qref{color:var(--muted)}
.intro .ititle{font-size:1.7rem;margin-bottom:14px}
.intro .iref{color:var(--muted);margin-bottom:22px}
.intro p{font-family:var(--serif);font-size:calc(var(--rfs) * 1.05);line-height:1.55}
.rscroll{flex:1;overflow-y:auto;padding:6px 24px calc(40px + env(safe-area-inset-bottom,0px))}
.rscroll .dtitle{font-size:2rem;margin:6px 0 22px;line-height:1.15}
.rscroll p{font-family:var(--serif);font-size:var(--rfs);line-height:1.65;margin:0 0 20px}
@media (prefers-reduced-motion:no-preference){.verse,.stage{animation:rise .35s ease-out}}
@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
</style>
</head>
<body>

<nav id="nav" hidden><div class="inner">
  <button data-tab="today">Today</button>
  <button data-tab="journal">Journal</button>
  <button data-tab="settings">Settings</button>
</div></nav>

{

const TRUST_EXTRA = [{"devTitle": "Trusting When You Can’t See the Road", "intro": "Proverbs is a collection of wise sayings, many of them attributed to Solomon, written to help people live wisely before God.", "devLong": ["There’s a kind of trust that comes easily. It shows up when the plan makes sense, the numbers add up, and we can see where the road is heading. It’s not hard to trust God when we already understand what he’s doing.", "Proverbs 3:5-6 asks for something different. It asks us to trust the Lord with all our heart, and not to lean on our own understanding. The writer isn’t saying our minds don’t matter. He’s saying they aren’t a safe place to put our full weight.", "Think about what leaning means. You lean on something when you expect it to hold you up. Most of us lean on our own understanding without noticing. We lean on our plans, our experience, and our read of the situation, and when those start to wobble, so do we.", "The passage points us to another place to lean. Acknowledge him in all your ways. That means in the decisions that feel spiritual, and in the ordinary ones too. It means bringing God into the conversation before we’ve already decided.", "Then comes the promise. When we do this, he makes our paths straight. Notice what the promise is not. It doesn’t say the path will be easy, or that we’ll see the whole route. It says he will direct it.", "Today, you might not have every answer. That’s okay. Trust isn’t having the answers. It’s handing the whole situation to the one who does. Where do you need to stop leaning on your own understanding, and start leaning on him?"], "prayShort": ["Take a slow breath. Wherever you are, you’re not alone. The Lord is here with you.", "Lord Jesus, thank you that I can come to you just as I am. You know what’s in front of me today, and you know what I can’t see.", "I confess that I’ve leaned on my own understanding. I’ve made plans as if the whole road were in view. Today I choose to trust you with all my heart, not only the parts I understand.", "Show me how to acknowledge you in what I do today, in the big decisions and the small ones. Make my paths straight, in your way and in your time.", "Thank you that you hold what I can’t. I trust you. Amen."], "prayLong": ["Take a slow breath. Let your shoulders drop. For a few minutes there’s nothing to fix and nothing to figure out. You’re simply here, and so is he.", "Picture yourself at a place where the road forks. You can’t see far down either path. There’s a signpost, but you can’t read it from here. You’ve been standing at this fork longer than you’d like, trying to work out which way is right.", "Now picture Jesus standing beside you. He isn’t in a hurry. He isn’t frustrated that you haven’t figured it out. He’s simply with you, and he knows both roads.", "Lord Jesus, I come to you as I am. I praise you because you are wise, and your wisdom never runs out. You see the beginning and the end, and nothing about my life is hidden from you.", "Thank you for the times you’ve led me when I couldn’t see the way. Some of those moments I only understood later. Some I still don’t understand. But you were there, and you were faithful. Bring one of those times to mind now, and thank him for it.", "I confess that I’ve leaned on my own understanding. I’ve trusted my plans more than your direction. I’ve made decisions first and asked you to bless them afterward. Forgive me, Lord. I don’t want to keep doing life that way.", "Today I choose to trust you with all my heart, not just the parts that make sense. I give you the decision I’ve been turning over. I give you the situation I can’t explain. I give you the future I can’t see.", "Teach me to acknowledge you in everything I do. In the work in front of me, in the conversations I’ll have, in the quiet moments in between. Remind me to bring you into the room before I’ve already decided.", "Make my paths straight. I’m not asking for an easy road. I’m asking you to go with me, and to direct each step. Give me peace when I don’t understand, and courage to keep walking.", "Bring one specific need to him now, in your own words. Then rest in this: you don’t have to see the whole road. You only have to trust the one who does.", "Thank you, Lord, for holding what I can’t hold. I place my trust in you. In Jesus’ name, amen."]}, {"devTitle": "What to Do When You’re Afraid", "intro": "This psalm is attributed to David. It’s a prayer written in a time of fear.", "devLong": ["Fear is one of the most honest human experiences. It doesn’t ask permission. It shows up in the middle of a normal day, in a medical waiting room, in a quiet house at night, or in a conversation we’ve been avoiding.", "David knew fear. In Psalm 56, he doesn’t pretend to be calm. He says plainly that there are times he is afraid. That honesty matters. God isn’t looking for people who never feel fear. He’s looking for people who bring it to him.", "What David does next is the heart of the passage. When he’s afraid, he puts his trust in God. Notice the timing: when I am afraid. Trust doesn’t wait until the fear is gone. It happens in the middle of it.", "Then David points to what his trust rests on. He praises God’s word. His confidence isn’t in his own strength or in the situation improving. It’s in what God has said.", "He also asks a question: what can flesh do to me? He isn’t saying people can’t cause real pain. He’s saying that with God, nothing people do has the last word.", "If you’re afraid of something today, you’re in good company. You don’t have to hide it. Say it to God plainly, and then choose to put your trust in him, even if your heart is still racing. That choice is what trust looks like in real life."], "prayShort": ["Take a slow breath. Whatever you’re afraid of, you can say it here. God already knows.", "Lord, I’m afraid of some things today. I won’t pretend I’m not. I bring each of them to you now. Pause, and name them if you can.", "You are with me. Your word is true, and your promises don’t shake. When I’m afraid, I choose to put my trust in you.", "Hold me close today. Quiet my heart. Give me courage for the next step. Thank you for staying near. Amen."], "prayLong": ["Find a quiet place, even if it’s only in your mind. Let your breath slow down. There’s no need to be strong here.", "Imagine a night when you couldn’t sleep because something was weighing on you. The house is quiet, but your thoughts aren’t. Every fear seems louder in the dark. You’ve tried to talk yourself out of it, and it hasn’t worked.", "Now imagine you sit up, and instead of arguing with the fear, you simply say its name out loud to God. Not tidy. Not polished. Just honest.", "Lord, I’m afraid. You know the things I’m afraid of: the ones I’ve told people about, and the ones I haven’t. I lay them in front of you now, one at a time.", "Thank you that I don’t have to hide from you. David was afraid, and you didn’t turn him away. You heard him then, and you hear me now.", "I praise you for your word. It doesn’t change with the news or the season. When everything else shifts, what you’ve said still holds. Help me to hold on to it.", "When I am afraid, I will put my trust in you. Not after the fear is gone. Now, with my heart still unsettled and my mind still racing. I choose to trust you in the middle of it.", "I confess that I’ve let fear tell me what’s true. I’ve rehearsed the worst outcomes as if they were certain. Forgive me, and teach me to turn those thoughts into prayers.", "Lord, you are greater than what I’m afraid of. Whatever people may say or do, you are still God. Steady me. Give me courage for today, and for the next step, and no more than that.", "Be still for a moment. Let him hold what you’ve handed him. You’re not carrying it alone.", "Thank you, God, for being near. In Jesus’ name, amen."]}, {"devTitle": "Peace for a Mind Fixed on God", "intro": "Isaiah was a prophet who spoke God’s word to the people of Judah. These verses are part of a song of trust.", "devLong": ["Some days, our minds feel like a browser with too many tabs open. A conversation from yesterday, a bill that’s due, a decision that’s waiting. We keep rereading the same worries, and peace feels far away.", "Isaiah 26 speaks directly to this. It says God keeps in perfect peace the person whose mind is steadfast, and then gives the reason: because he trusts in the Lord. The peace described here isn’t a feeling that appears when life calms down. It’s tied to where the mind rests.", "A steadfast mind is one that keeps coming back. It isn’t a mind that never wanders. It’s a mind that, when it wanders, returns to the same place. Trust is what holds it there.", "Verse 4 gives us a reason to keep returning. Trust in the Lord forever, because the Lord God is an everlasting rock. A rock doesn’t move when the weather changes. Our circumstances will shift, but he doesn’t.", "Notice the word forever. The passage doesn’t say to trust him only when things are calm, or only for this season. It says always, because he is always the same.", "So today, when your thoughts start to race, try this. Notice where they’re going. Then gently bring them back to him, and say it out loud if you can: I trust you. That small act of returning is how a mind becomes steadfast."], "prayShort": ["Take a slow breath. Let your thoughts settle, like water in a glass.", "Lord, my mind runs in many directions. I bring all of it to you now: the tasks, the worries, the things I replay.", "You are an everlasting rock. You don’t shift as my circumstances do. Fix my mind on you, and give me the peace that comes from trusting you.", "When my thoughts wander today, bring me back. Remind me that I can come home to you, again and again. Thank you for your peace. Amen."], "prayLong": ["Sit still for a moment. Notice how your body feels. Notice where your thoughts keep going.", "Imagine your mind as a room with every window open and a strong wind blowing through. Papers are flying around. You chase one thought, and another one lands somewhere else.", "Now imagine someone gently closing the windows, one at a time. The room goes quiet. The papers settle. It’s Jesus, and he isn’t rushing.", "Lord, thank you for your peace. It’s not the peace of a perfect day. It’s the peace of being held by you, even when the day isn’t perfect.", "I praise you because you are an everlasting rock. People change their minds. Plans fall through. Circumstances shift. But you are the same, today and forever.", "Here is what keeps pulling my mind away from you. Name it now, in your own words. Hand it to him like something you’ve been holding too tightly.", "Forgive me for the times I’ve trusted my worrying to protect me. I’ve thought that if I kept going over it, I’d find a solution. Teach me instead to bring it to you and leave it there.", "Make my mind steadfast. I want it to be a mind that returns to you, again and again, no matter where it wanders. When I drift, call me back, gently.", "Keep me in perfect peace, Lord, because I trust in you. Not because of what I can see, but because of who you are. I trust you today, and I trust you forever.", "Stay here a moment. Let his peace settle over you.", "Thank you, Jesus, for being my rock. Amen."]}, {"devTitle": "Rooted When the Heat Comes", "intro": "Jeremiah was a prophet who spoke God’s word to the people of Judah, often in difficult and uncertain times.", "devLong": ["Imagine two trees. One is planted in dry ground with little water. The other is planted beside a stream. In a mild season, they may look about the same. The difference shows up when the heat comes.", "Jeremiah uses this picture to describe the person who trusts the Lord. That person, he says, is like a tree planted by water, sending out its roots by the stream.", "The tree doesn’t control the weather. But its roots are already in the water, so when the heat comes, its leaves stay green. In a year of drought it isn’t anxious, and it doesn’t stop bearing fruit.", "Notice what this passage doesn’t promise. It doesn’t say hard seasons won’t come. It says that the person who trusts God isn’t defined by them. The strength they need was built before the heat arrived.", "Roots grow slowly and out of sight. Nobody applauds a root. But the habits that keep us near God, like prayer, time in his word, and gathering with other believers, are how our roots reach the water. We build them in ordinary days so that they hold in hard ones.", "Where are your roots today? If a hot season hit tomorrow, what would you draw on? Ask the Lord to help you stay close to the stream, one ordinary day at a time."], "prayShort": ["Take a slow breath. Picture a tree beside a stream, its roots reaching down into the water.", "Lord, root me in you. I want my trust to be planted deep, so that when the heat comes, I’m not shaken.", "Forgive me for the times I’ve gone dry because I stayed away from the stream. Draw me back to the habits that keep me near you.", "Keep me green in hard seasons. Let me keep bearing fruit, even when I can’t see why. Thank you for being my source. Amen."], "prayLong": ["Take a moment to be quiet. Let your breathing slow. Imagine you’re walking beside a stream on a hot day.", "There’s a tree at the water’s edge. Its roots run down into the bank, and its leaves are green and full. Across the field, another tree stands in dry ground. It’s struggling in the heat, its leaves curling.", "You’re standing between the two trees. You feel the heat on your own skin. You know which tree you want to be.", "Lord, thank you for being the stream. Everything I need to live, you provide. I praise you because you never run dry.", "I confess that some days I’ve tried to live from my own supply. I’ve gone through my days without stopping to drink from you. And then I’m surprised that I’m tired and dry.", "Show me the habits that keep my roots near the water. Time in your word. Honest prayer. Fellowship with other believers. Help me keep them even when they feel ordinary.", "I know that hard seasons will come. Heat doesn’t ask permission. Prepare me now, in the quiet, so that I’m rooted when the pressure comes.", "When the year of drought comes, let me not be anxious. Let me remember that my life isn’t hanging on the weather. It’s planted in you.", "And Lord, let me bear fruit. Not so that people notice, but so that others might find shade and rest. Use my life for good, even in the hard times.", "Be still for a moment, and picture your roots reaching down. Let yourself drink.", "Thank you, Father, for being the water I need. In Jesus’ name, amen."]}, {"devTitle": "Commit Your Way", "intro": "This psalm is attributed to David. It’s written as advice for how to live while waiting on God.", "devLong": ["Waiting for God can feel like standing still. We pray about something, and then nothing seems to move. In those seasons it’s tempting to take control, to push harder, to fix things ourselves.", "Psalm 37 gives us a different set of instructions. Trust in the Lord, and do good. Delight yourself in the Lord. Commit your way to him. Trust isn’t only a feeling in the heart. It comes with things to do while we wait.", "Notice the order. Before the psalm talks about what we want, it talks about who we’re with. Delight yourself in the Lord. When God himself becomes our delight, it changes what we ask for and how tightly we hold on to it.", "Then comes the word commit. The picture is of rolling a burden onto someone else. We stop carrying the outcome and hand it to him.", "And the promise: he will do it. The psalm goes on to say he will bring out your righteousness like the light and your justice like the noon day sun. The passage doesn’t promise we’ll get everything we want. It promises that God acts, and that what is right will in the end be seen.", "Is there something you’ve been trying to control? Today, try committing it to him in prayer. Hand it over by name, and then do the next good thing in front of you."], "prayShort": ["Take a slow breath. Let go of what you’ve been clutching.", "Lord, I trust you. Help me to do what’s right today, and to leave the outcome in your hands.", "There’s something I’ve been trying to control. I commit it to you now. I roll it off my shoulders and onto yours.", "Be my delight, Lord, more than anything I’m asking for. Act in your way and in your time. Thank you that you will. Amen."], "prayLong": ["Take a moment to be still. Open your hands and rest them on your lap, palms up.", "Imagine you’ve been carrying a heavy bag for a long time. Your arms ache from it. You’ve been afraid to put it down, afraid something will go wrong if you let go.", "Now Jesus kneels beside you. He doesn’t take it from you by force. He waits, and asks, quietly, whether you’ll let him carry it.", "Lord, I trust you. I want to trust you, not in my own strength, but with what you’ve given me. I praise you because you are faithful, and you don’t let go of what is yours.", "Help me to do good while I wait. Not to earn anything, but because I belong to you. Show me the next right thing to do today, and give me the courage to do it.", "Teach me to delight in you. I confess that I often delight in what I want from you more than in you. Turn my heart. Make you my joy.", "Here is what I’ve been trying to control. Say it to him now. I commit my way to you. I stop gripping it. I set it in your hands.", "I trust that you will act. I don’t know how, and I don’t know when. I only know that you are good, and that your timing isn’t late.", "Bring out what is right, Lord, like the light of the morning. Where I’ve been misunderstood, where I’ve been hurt, where I don’t see the end, let what is right shine in the end.", "Rest here for a moment. Let your hands stay open.", "Thank you, Lord, that I don’t have to carry everything. Amen."]}, {"devTitle": "Help My Unbelief", "intro": "The Gospel of Mark tells the story of Jesus’ ministry. In this passage, a father asks Jesus to help his son.", "devLong": ["Most of us have prayed with a mix of hope and doubt. We believe, and we’re also afraid to hope. We wonder whether our faith is big enough to matter.", "In Mark 9, a father brings his son to Jesus, desperate for help. When he asks, Jesus answers that all things are possible for the one who believes.", "The father’s reply is one of the most honest prayers in the Bible. He cries out that he believes, and then asks Jesus to help his unbelief. In one breath he says yes and admits he’s struggling.", "Notice how Jesus responds. He doesn’t scold him or send him away. The account goes on to show Jesus acting on the father’s behalf.", "That’s good news for anyone whose trust feels thin. Faith doesn’t have to be perfect to be real. It can be small and shaky, and still be pointed at Jesus. What matters is who it’s directed toward.", "Where does your trust feel mixed with doubt today? Try praying this father’s prayer in your own words. Tell Jesus you believe, and ask him to help where you don’t."], "prayShort": ["Take a slow breath. You don’t have to be certain to come to Jesus.", "Lord, I believe. And I also have doubts. I won’t pretend otherwise. Help my unbelief.", "Where my faith feels small, meet me. Where I’m afraid to hope, give me courage. You don’t turn away from honest hearts.", "Thank you for being patient with me. Strengthen my trust today, one step at a time. Amen."], "prayLong": ["Sit quietly for a moment. Let go of the need to sound spiritual. You’re among friends here.", "Imagine the crowd around Jesus: people pushing, noise everywhere. A father steps forward, tired and desperate, his son at his side. He’s tried everything. His voice shakes as he asks.", "Jesus tells him that all things are possible for the one who believes. The man’s heart breaks open. He cries out with tears.", "Now imagine it’s you, standing in front of Jesus with your own question. He looks at you with kindness, and he waits.", "Lord, I believe. I do believe. You are who you say you are, and you are able to do what you promise. I praise you for that, even when I can’t see it.", "But I also confess that my faith is mixed. There are places where I’m afraid to hope. There are prayers I’ve stopped praying because I didn’t want to be disappointed. Name one of them to him now.", "I’m not going to pretend, Lord. Help my unbelief. I’m asking you to do what I can’t do. Strengthen the trust that’s already in me, even if it’s small.", "Thank you that you don’t turn me away for being honest. You don’t say, come back when you’ve got it together. You meet me right here.", "Teach me to bring my doubts to you instead of hiding them. Make my faith the kind that keeps coming to you, again and again, even when it’s shaky.", "Stay with him for a moment, and let him strengthen what is weak.", "Thank you, Jesus, for helping me. Amen."]}, {"devTitle": "What Are You Counting On?", "intro": "This psalm is attributed to David. It’s a prayer for God’s people, and a statement of what they trust.", "devLong": ["Every person trusts in something. We might not call it trust, but we all have things we count on when life gets uncertain: money, plans, skills, connections, our own ability to figure things out.", "Psalm 20:7 names what that looked like in David’s world. Some trust in chariots, and some in horses. In his day these were the military power that decided battles. They were the best resources people could imagine.", "Then the psalm shifts: but we trust in the name of the Lord our God. The word but matters. The psalmist isn’t saying chariots and horses are worthless. He’s saying they aren’t where his ultimate trust rests.", "In the Bible, a person’s name stands for their character. To trust in the name of the Lord is to trust in who he is: faithful, powerful, and good. It’s trust in a person, not in an outcome.", "Your chariots and horses might look different. Maybe it’s your savings, your schedule, your reputation, or your own strength. These aren’t bad things. The question is whether they’re what you’re leaning on.", "As this week ends, look back at what you’ve learned about trust. Where have you seen the Lord be faithful? Tell him you’re trusting in him, and ask him to keep your trust fixed on him in the week ahead."], "prayShort": ["Take a slow breath. Look back over this week.", "Lord, some people trust in chariots and horses, in plans and strength and money. I want to trust in you.", "You have been faithful this week, even in the moments I didn’t notice. I name my chariots and horses, the things I lean on, and I set them down.", "I trust the name of the Lord my God. Keep me looking to you in the week ahead. Thank you. Amen."], "prayLong": ["Take a moment to settle. Let your breath slow. This is the last day of the week, a good day to look back.", "Think about the week. The moments you were afraid. The moments you tried to figure it out on your own. The moments you remembered to bring him in.", "Imagine a wide field, and an army with chariots and horses lined up in front of you. They’re impressive. They look like they could win any battle. Then imagine standing next to them with nothing in your hands but trust in God.", "Lord, I praise you. You are my God, and I trust in your name. You’re not one of many things I lean on. You’re the one who holds everything else.", "Thank you for this week. For what I learned about trust, even where I learned it the hard way. Name one thing you’re thankful for from this week.", "Here are my chariots and horses, Lord. The things I tend to rely on: my own planning, my savings, my skills, what people think of me. Name them to him now. None of these are evil, but I’ve leaned on them more than on you.", "Forgive me for the times I’ve trusted in my own strength. I set these things down. I don’t need to be the one holding everything together.", "Teach me to trust you not only in crisis but in the ordinary. When life is calm, keep me leaning on you. When life is loud, keep me anchored.", "Thank you for your faithfulness. You have never failed me. Even when I couldn’t see what you were doing, you were working.", "As this week ends, ask him to keep your trust fixed on him in the week ahead.", "In Jesus’ name, amen."]}];
TRUST_EXTRA.forEach((x,i) => Object.assign(THEMES[0].days[i], x));
const EXTRA_ALL = {"Peace over anxiety": [{"devTitle": "Bring It All to God", "intro": "Paul wrote this letter to the church in Philippi while he was in prison.", "devLong": ["Anxiety rarely arrives with a warning. It starts as a small thought and grows until it fills the room. We go over the same problem again and again, hoping that one more pass will solve it.", "Paul gives a very different instruction in Philippians 4: don’t be anxious about anything. That might sound impossible, but he doesn’t stop at the command. He tells us what to do instead. In everything, bring your requests to God, with prayer and petition, and with thanksgiving.", "Notice the word everything. Nothing is too small to bring to him, and nothing is too large. The things we’d be embarrassed to pray about and the things that keep us awake at night are both welcome.", "Then comes the promise. The peace of God, which goes beyond all understanding, will guard your heart and your mind in Christ Jesus. Paul doesn’t say the problem will vanish or that we’ll understand how things will work out. He says peace will stand guard, like a sentry at the gate of our hearts.", "Today, try turning one worry into a specific prayer. Say it plainly to God, add one thing you’re thankful for, and then notice what happens when you stop carrying it alone."], "prayShort": ["Take a slow breath. You don’t have to carry this alone.", "Lord, I bring you what’s weighing on me today. All of it. I thank you that you hear me.", "Guard my heart and my mind with your peace, the peace that I can’t explain. I rest in you. Amen."], "prayLong": ["Take a slow breath and let your shoulders drop. For these few minutes, you have nothing to solve.", "Picture yourself at a table, with everything you’ve been worrying about laid out in front of you. Each worry is a small object, and you’ve been holding them all at once. Your hands are tired.", "Now picture Jesus sitting across from you, calm and unhurried. He isn’t surprised by anything on the table. He simply waits for you to hand it over.", "Lord, thank you that I can come to you with everything. You don’t ask me to tidy it up first. You invite me to bring it as it is.", "Here is what I’ve been anxious about. Name each worry to him now, one at a time, and set it down.", "Thank you for what you’ve already done. Name one thing you’re grateful for today, even a small one. Gratitude reminds me that you have been faithful before.", "Give me your peace, Lord, the kind I can’t produce myself. Stand guard over my heart and my mind today. When worry knocks again, remind me to bring it to you instead of letting it in.", "Rest here for a moment. Let his peace settle over you. Thank you, Jesus. Amen."]}, {"devTitle": "Throw the Weight on Him", "intro": "Peter wrote this letter to believers who were facing hardship and living far from home.", "devLong": ["Some weights we carry because we think we have to. We carry the worry about our family, our work, our future, because if we let go, who will hold it?", "In 1 Peter 5, Peter says to humble yourselves under God’s mighty hand, and to cast all your anxiety on him. The word cast pictures a person throwing a heavy load off their back. It isn’t a gentle setting down. It’s a decisive throwing off.", "Then Peter gives the reason, and it’s not a technique. It’s because he cares for you. The invitation to hand over our worries rests on the character of the one receiving them. He doesn’t put up with our burdens. He cares.", "Notice also the word all. Not just the manageable worries, but all of them, including the ones we’re embarrassed by and the ones we don’t know how to put into words.", "Is there a weight you’ve been carrying that you were never meant to carry alone? Today, say it to God, picture throwing it onto him, and remember that he cares for you."], "prayShort": ["Take a slow breath. Picture the weight you’ve been carrying.", "Lord, you care for me. I throw my worries onto you today, all of them, and I leave them with you.", "Help me not to pick them up again. Thank you for caring. Amen."], "prayLong": ["Sit quietly and notice what you’ve been carrying. Notice where you feel it in your body, perhaps in your shoulders or your chest.", "Imagine a heavy backpack you’ve worn for so long you’ve almost forgotten it’s there. Straps dig into your shoulders. Jesus stands beside you and says gently, let me take that.", "Lord, I humble myself before you. I admit that I can’t carry everything, and I was never meant to.", "Thank you that you care for me. Not just that you put up with me, but that you actually care. Let that sink in.", "Here are the worries I’ve been holding. Name them to him now. I throw them onto you, Lord. All of them.", "Forgive me for the times I’ve thought my worrying was the only thing holding things together. I trust you with what I can’t control.", "When I’m tempted to pick the weight up again, remind me that I’ve already given it to you. Teach me to leave it there.", "Rest here for a moment, with your hands empty. Thank you, Father, for caring. In Jesus’ name, amen."]}, {"devTitle": "Look at the Birds", "intro": "This is part of the Sermon on the Mount, where Jesus teaches his followers how to live.", "devLong": ["Jesus knew that people worry about the basics: what they will eat, what they will wear, how they will get by. He doesn’t treat those concerns as silly. He speaks into them directly.", "In Matthew 6, he points to something simple. Look at the birds of the sky. They don’t sow or reap or store food in barns, and yet your heavenly Father feeds them. Then he asks a question: aren’t you worth more than they are?", "He follows with another question that cuts to the heart of worry. Can worrying add anything to your life? Worry feels productive, like we’re doing something. Jesus points out that it doesn’t actually change anything.", "This isn’t a call to be careless. Birds still search for food, and we still work and plan. The difference is where our trust rests. We do our part, and we trust the Father who knows what we need.", "Today, take a moment to look at something small and cared for, like a bird, a tree, or a flower. Let it remind you that the same Father is looking after you."], "prayShort": ["Take a slow breath. Think of a bird you saw recently, and how it simply went about its day.", "Father, you feed the birds, and you know what I need. Help me stop worrying and trust you with today.", "Thank you that I’m worth more to you than I can understand. Amen."], "prayLong": ["Find a quiet place and breathe slowly. If you can see a window, look outside.", "Imagine a small bird on a branch, with no storehouse and no savings. It doesn’t worry about tomorrow. Each day, it finds what it needs.", "Jesus is watching it with you. He says quietly, your Father feeds them. Aren’t you worth more than they are?", "Father, thank you for caring for the smallest creature. If you care that much for them, I can trust you with what I need.", "Here are the needs I’ve been worried about. Name them to him: money, health, work, family. Tell him about each one plainly.", "Forgive me for the times I’ve treated worry as if it were a responsibility. Teach me to do my part and leave the rest with you.", "Give me today’s bread, Lord, and the trust to leave tomorrow in your hands.", "Stay here for a moment, and let this truth settle in. You are watched over by a Father who knows. Thank you. Amen."]}, {"devTitle": "When Your Thoughts Are Many", "intro": "This psalm is a prayer to God from someone who feels pressure from every side and has turned to him for help.", "devLong": ["There are days when your mind won’t slow down. Thought after thought crowds in, and none of them are peaceful. Psalm 94 puts words to that experience.", "The psalmist says that when he thought his foot was slipping, God’s steadfast love held him up. He didn’t fall, because he was held.", "Then he describes something more inward. When my thoughts were many within me, your comforts delighted my soul. He doesn’t say the thoughts went away. He says comfort came into the middle of them.", "That’s worth noticing. God’s comfort doesn’t always arrive by removing what troubles us. Sometimes it comes alongside, so that even with many thoughts pressing in, we aren’t alone with them.", "If your thoughts are crowded today, you don’t need to quiet them first. Bring them as they are, and ask him to bring his comfort into the middle of them."], "prayShort": ["Take a slow breath. Let your thoughts be as they are.", "Lord, my thoughts are many today. Come into the middle of them with your comfort.", "Hold me steady where I feel I’m slipping. Thank you for your steadfast love. Amen."], "prayLong": ["Sit quietly. Notice the thoughts coming and going like cars on a busy road. You don’t need to stop them right now.", "Imagine standing on uneven ground, with your foot starting to slip. You reach out, and someone takes hold of you. It’s the Lord, and his grip is steady.", "Lord, thank you for your steadfast love. It holds me when I can’t hold myself. I praise you because you don’t let go.", "Here are the thoughts crowding my mind. Tell him about them, one at a time. Don’t edit them. He can hear them as they are.", "Bring your comfort into the middle of them, Lord. I’m not asking you to take away every concern. I’m asking you to be near while I carry them.", "Where I feel I’m slipping, hold me. Where I’m tired, give me rest. Where I’m unsure, give me a small step to take.", "Let your comfort bring me joy, even a quiet joy. Remind me that the cares aren’t the whole story, because you’re in it too.", "Rest for a moment in being held. Thank you, Lord. Amen."]}, {"devTitle": "A Peace the World Can’t Give", "intro": "Jesus spoke these words to his disciples shortly before his arrest, to prepare them for what was coming.", "devLong": ["We often look for peace in the wrong places. We hope the schedule will clear, the problem will resolve, or someone will say the words we need to hear. When those things come, the peace they bring doesn’t last.", "Jesus offers something different in John 14. Peace I leave with you. My peace I give to you. He says he doesn’t give as the world gives. The world’s peace depends on circumstances. His doesn’t.", "Notice the words I give. This isn’t a peace we manufacture by trying harder. It’s a gift, and it comes from him. Our part is to receive it.", "Then he adds two commands: don’t let your heart be troubled, and don’t let it be fearful. He says this on the night before his arrest. He isn’t speaking from a place of ease. He’s speaking from a settled trust in the Father.", "Today, instead of trying to create peace, try receiving it. Ask Jesus for what he promised, and let it be his peace, not yours."], "prayShort": ["Take a slow breath. You don’t have to produce peace today. You can receive it.", "Jesus, thank you for the peace you give. It isn’t like the world’s peace. It’s yours. I receive it now.", "Settle my troubled heart, and keep me from fear. Amen."], "prayLong": ["Sit still and open your hands on your lap. Let them rest, palms up, ready to receive.", "Imagine a quiet room, with Jesus sitting beside you. He isn’t asking anything of you. He simply says, my peace I give to you.", "Lord Jesus, thank you for this gift. I’ve spent so long trying to create peace by controlling things. I confess that I’ve looked for it in places that couldn’t give it.", "I receive your peace now. Not the peace of a perfect day, but yours, which holds on even when the day is hard.", "Here is what has troubled my heart. Name it. Here is what has made me afraid. Name that too. I bring it to you.", "Do what only you can do. Settle my heart and steady my fears. Where I’m restless, give rest. Where I’m afraid, give courage.", "Teach me to return to your peace when it slips away. Remind me that it isn’t earned, only received.", "Stay here a moment, and let it settle. Thank you, Jesus, for your peace. Amen."]}, {"devTitle": "Do Not Be Afraid, I Am with You", "intro": "Isaiah was a prophet who spoke God’s word to his people, often to encourage them in difficult times.", "devLong": ["When fear is loud, we want more than information. We want someone to be with us. Isaiah 41:10 gives exactly that.", "The verse begins with a command, and then gives the reasons. Don’t be afraid, for I am with you. Don’t be dismayed, for I am your God. The command isn’t just try harder to be brave. It rests on who is speaking.", "Then come the promises. I will strengthen you. I will help you. I will uphold you with my righteous right hand. Three verbs, all of them from God. We’re not told to find strength within ourselves. We’re told he will give it.", "Notice that the verse doesn’t say the threat is gone. It says he is present, and that he acts. He strengthens, helps and holds.", "Today, if something is making you afraid, read this verse slowly as if it’s being spoken to you, because it is. Let the words I am with you be enough for the next step."], "prayShort": ["Take a slow breath. Read the verse in your mind: do not fear, for I am with you.", "Lord, you are with me. I bring my fear to you. Strengthen me and help me today.", "Hold me up where I can’t stand. Thank you for being near. Amen."], "prayLong": ["Sit quietly. Let your body relax, one part at a time. Feel your hands, your arms, your shoulders.", "Imagine standing at the edge of something that frightens you. The path is unclear, and your legs feel unsteady. Then you hear a voice beside you: do not fear, for I am with you.", "Lord, thank you that you are with me. Not far off, not watching from a distance, but with me. I praise you because you are my God.", "Here is what I’m afraid of. Say it to him now, plainly. I won’t pretend I’m not afraid. I bring it to you.", "Strengthen me, Lord. I’m not asking for a feeling of strength, but for the actual strength I need for what’s in front of me today.", "Help me, and hold me up with your right hand. Where I can’t stand on my own, be my support.", "Thank you that your promise doesn’t depend on how I feel. You said you are with me, and you are.", "Rest in that for a moment. Let it be enough for today. Amen."]}, {"devTitle": "Even in the Darkest Valley", "intro": "This is one of the best-known psalms. It’s attributed to David, who describes God as a shepherd.", "devLong": ["Psalm 23 is often read at peaceful moments, but it was written for hard ones. David describes God as a shepherd who provides, who leads and who restores. Then, in verse 4, the setting changes.", "Even though I walk through the valley of the shadow of death, I will fear no evil, for you are with me. The valley is real. David doesn’t pretend it isn’t dark. He says he walks through it, and that he isn’t afraid.", "The reason he gives isn’t that the valley is safe. It’s that you are with me. Notice that the psalm shifts here. Earlier verses talk about God in the third person, he leads me, he restores me. In the valley, David speaks directly to him: you are with me.", "Then he adds that the shepherd’s rod and staff comfort him. A shepherd used these to protect and guide the sheep. In the dark, David finds comfort in the shepherd’s tools, and in his presence.", "If you’re in a dark stretch today, you’re not walking it alone. Tell the Shepherd about it, and stay close to him."], "prayShort": ["Take a slow breath. Picture a shepherd walking beside you.", "Lord, you are my shepherd. When the valley is dark, stay close. I won’t be afraid, because you are with me.", "Lead me, guide me and comfort me. Thank you for staying near. Amen."], "prayLong": ["Settle into stillness. Let your breath slow. Think of the places in your life that feel like a valley right now.", "Imagine a narrow path between steep hills, in the late afternoon. The light is fading. A shepherd walks beside you with a staff in his hand. He doesn’t hurry you, and he doesn’t leave.", "Lord, you are my shepherd. I praise you for what you’ve provided. I praise you for leading me, and for the times you’ve restored me.", "Here is the valley I’m walking through. Tell him about it now. Tell him what’s dark, and what you’re afraid might happen.", "I won’t pretend it’s not dark. But I will say, you are with me. Let that be the thing I hold on to.", "Comfort me with your presence. Where I can’t see the way, guide me. Where I’m tempted to run, keep me close.", "Thank you that the valley isn’t the end of the path. Thank you that you walk through it with me.", "Stay here for a moment, and let the shepherd lead. Amen."]}], "Gratitude": [{"devTitle": "Enter with Thanksgiving", "intro": "This is a short psalm of thanksgiving that calls people to come before God with joy.", "devLong": ["Gratitude is easy when things go well and hard when they don’t. Psalm 100 doesn’t make gratitude depend on how the day is going. It makes it depend on who God is.", "The psalm calls the whole earth to shout for joy to the Lord, to serve him with gladness, and to come before him with singing. Then it gives reasons. Know that the Lord is God. It is he who has made us, and we are his.", "Verse 4 says to enter his gates with thanksgiving, and his courts with praise. Thankfulness isn’t only for the end of the prayer. It’s the way in.", "Then the psalm ends with the real foundation: the Lord is good, his steadfast love endures forever, and his faithfulness continues to all generations. These are things that don’t change with our circumstances.", "Today, try beginning with thanks. Before you ask for anything, thank him for who he is. Notice what changes in your heart."], "prayShort": ["Take a slow breath. Come into his presence with thanks.", "Lord, you are good. Your steadfast love endures forever, and your faithfulness never fails.", "Thank you for making me and for holding me. I’m yours. Amen."], "prayLong": ["Take a slow breath. Imagine walking up to a gate that stands open, and a courtyard beyond it full of light.", "The psalm says to enter with thanksgiving. So let’s do that. Before you ask for anything, begin with thanks.", "Lord, I thank you that you are God, and I am not. I thank you that you made me, and I belong to you. I’m not an accident.", "Thank you for your goodness. Name a way you’ve seen his goodness this week, even a small one.", "Thank you for your steadfast love. It doesn’t depend on how I performed today. It endures forever.", "Thank you for your faithfulness, across all generations. You were faithful to the people who came before me, and you’re faithful to me.", "Forgive me for the times I’ve come to you only with requests, and forgotten to thank you.", "Stay here a moment, and let your heart be glad. Amen."]}, {"devTitle": "Thanks in Everything", "intro": "Paul wrote this letter to the church in Thessalonica, a young group of believers he cared about deeply.", "devLong": ["1 Thessalonians 5 gives three short commands that are easy to say and hard to live: rejoice always, pray without ceasing, and give thanks in everything.", "Notice the word in. Paul doesn’t say give thanks for everything. He doesn’t ask us to pretend that painful things are good. He says give thanks in everything, in the middle of whatever we’re facing.", "That changes how we can practice it. We may not be able to thank God for the hard thing itself. But we can usually find something in the middle of it to be thankful for: a person who showed up, a moment of strength, a reminder of his care.", "Paul adds that this is God’s will for us in Christ Jesus. It’s not an extra for especially spiritual people. It’s part of how God shapes ordinary believers.", "Today, in the hardest part of your day, look for one thing to thank him for. Say it out loud if you can."], "prayShort": ["Take a slow breath. Think of one thing from today that you can thank God for.", "Lord, I thank you in this day, whatever it brings. Show me what to be grateful for.", "Help me rejoice, pray and give thanks, even when it’s hard. Amen."], "prayLong": ["Sit still for a moment. Think back over the last day, from morning to now.", "Imagine going through the day like scrolling through photos. Some moments are bright, some are dull, and some are hard. Pause on a few of them.", "Lord, thank you for this day. I thank you for the good moments, and I name one now.", "I also thank you in the harder parts. I’m not saying they were good. But I thank you that you were there, and for what you provided in the middle of them.", "Teach me to rejoice always, not by ignoring what hurts, but by remembering who you are.", "Teach me to pray without ceasing, to bring you into small moments, not just big ones.", "Teach me to give thanks in everything, so that thankfulness becomes a habit.", "Rest here and let gratitude settle in. Amen."]}, {"devTitle": "Don’t Forget His Benefits", "intro": "This psalm is attributed to David. It begins with him speaking to his own soul.", "devLong": ["One of the quiet dangers of life is forgetting. We receive something good, feel grateful for a moment, and soon it fades into the background. David knew this, and in Psalm 103 he does something about it.", "He tells his own soul to bless the Lord, and to forget not all his benefits. He has to talk to himself to do it. Gratitude isn’t always a feeling that arrives on its own. Sometimes it’s a choice, and a discipline of remembering.", "Then he lists what God has done. He forgives all your sins, heals all your diseases, redeems your life from the pit, crowns you with steadfast love and mercy, and satisfies you with good. It’s a long list, and each phrase deserves to be slowed down.", "The point of the list is to jog our memory. If we don’t name what God has done, we start to assume it was ordinary or that we earned it.", "Today, try making your own list. Write or say three things God has done for you, specifically, and thank him for each one."], "prayShort": ["Take a slow breath. Speak to your own soul, as David does.", "Bless the Lord, my soul. Help me not to forget what you’ve done for me.", "Thank you for forgiving me, for holding me, and for filling my life with good. Amen."], "prayLong": ["Sit quietly. Imagine speaking to your own soul, the way David does. Bless the Lord, my soul.", "Think of a time you were forgiven when you didn’t deserve it. Lord, thank you for forgiving all my sins. I don’t take that lightly.", "Think of a time you were rescued, from a low place, a hard season, a pit. Thank you for redeeming my life from the pit.", "Think of the ways he has crowned you with steadfast love and mercy, in people, in moments, in quiet ways you’ve noticed. Name one now.", "Thank you for satisfying me with good things. I confess that I forget these. I take your gifts as ordinary.", "Help me to remember. When I’m tempted to think no one has been good to me, remind me of what you’ve done.", "Let my soul bless you, with everything in me. Amen."]}, {"devTitle": "The One Who Came Back", "intro": "This story comes from Luke’s Gospel, which describes Jesus’ travels and teaching.", "devLong": ["Luke 17 tells a simple story with a sharp point. Ten men with leprosy call out to Jesus from a distance, asking for mercy. He tells them to go and show themselves to the priests, and as they go, they are cleansed.", "Imagine the joy. After years of isolation, they’re healed. Nine of them keep going, no doubt eager to get on with their lives. One stops. He turns back, praising God in a loud voice, and falls at Jesus’ feet to thank him.", "Luke adds that he was a Samaritan, someone considered an outsider. Jesus asks, were not ten cleansed? Where are the other nine? Jesus notices who comes back.", "This story isn’t meant to shame the nine. It shows how easy it is to receive and move on. Most of us do it. We pray for something, receive it, and rush into the next thing.", "Today, think of something God has done for you, and go back to thank him. Don’t just move on. Turn around and say it."], "prayShort": ["Take a slow breath. Think of something God has answered.", "Jesus, thank you for what you’ve done. Like the man who came back, I’m turning around to say it.", "Forgive me for the times I’ve rushed on without thanking you. Amen."], "prayLong": ["Settle into stillness. Imagine a road leading out of a village, with ten men walking along it, newly healed.", "Nine keep walking. One stops, turns around, and runs back. He’s shouting praise. He throws himself at Jesus’ feet.", "Now think of something God has done for you. A prayer he answered, or a difficulty that resolved. Picture yourself turning back.", "Jesus, thank you. I want to be the one who comes back. Thank you for what you did. Say it in your own words.", "Forgive me for the times I’ve received your gifts and kept going without a word. I don’t want to treat your goodness as ordinary.", "Thank you that you notice. You notice when we come back, and you welcome us.", "Teach me to pause when you give me something, and to turn around and thank you. Amen."]}, {"devTitle": "Do It All with Thanks", "intro": "Paul wrote this letter to the church in Colossae, encouraging them to live out their faith in daily life.", "devLong": ["Where does gratitude belong? Most of us would say in prayer, or at church. Colossians 3 says it belongs in the middle of everything.", "Paul tells the Colossians to let the peace of Christ rule in their hearts, and to be thankful. Then he says to let the word of Christ dwell in them richly, and to sing with gratitude in their hearts to God.", "Then comes verse 17, which covers everything. Whatever you do, in word or deed, do all in the name of the Lord Jesus, giving thanks to God the Father through him.", "That includes the ordinary. Washing dishes, answering emails, driving to work, having a conversation. None of these are separate from your faith. Paul invites us to do them in Jesus’ name, with thanks.", "Today, pick one ordinary task and do it as an act of gratitude. Before you begin, say a quick thank you to God. See how it changes the task."], "prayShort": ["Take a slow breath. Think about the day ahead.", "Lord Jesus, I want to do my day in your name, with thanks. Fill my ordinary tasks with gratitude.", "Let your peace rule in my heart. Amen."], "prayLong": ["Sit quietly. Think through your day ahead, the tasks, the conversations, the small things.", "Imagine each of them as a doorway you walk through, and over each one is written, in the name of the Lord Jesus.", "Lord Jesus, thank you that no part of my day is outside of your care. I give you my work, my words and my effort.", "Let your peace rule in my heart. When I’m tempted to hurry, irritation or worry, bring me back to you.", "Let your word live in me richly. Teach me to sing, in my heart if not out loud, with gratitude.", "Here is one thing I’ll do today. Name it. Help me do it in your name, with thanks.", "Forgive me for the times I’ve treated my work as separate from you.", "Thank you, Father, through Jesus. Amen."]}, {"devTitle": "His Love Endures Forever", "intro": "This psalm is a song of thanksgiving. Every verse repeats the same refrain.", "devLong": ["Psalm 136 does something unusual. In every single verse, it repeats the same line: his steadfast love endures forever. It’s a psalm built on repetition.", "The first verses call us to give thanks to the Lord, because he is good, because he is the God of gods, and because he is the Lord of lords. The psalm opens by pointing us to who he is.", "The repetition isn’t filler. It’s a way of letting truth sink in. We forget quickly, so the psalm says it again, and again, until it settles into our hearts.", "His steadfast love endures forever. That doesn’t depend on our circumstances, our moods or our performance. It was true before today, and it will be true tomorrow.", "Today, say the refrain slowly. After each repetition, add something specific that you’re thankful for. Let the repetition do its work."], "prayShort": ["Take a slow breath. Say it quietly: his steadfast love endures forever.", "Lord, your love endures forever. Nothing today can change that.", "Thank you. I rest in your love. Amen."], "prayLong": ["Sit quietly and slow your breathing. Say slowly: give thanks to the Lord, for he is good.", "His steadfast love endures forever. Thank you, Lord, for being good, and for your love that doesn’t run out.", "Think of something he’s done for you. Say it, and then say, his steadfast love endures forever.", "Think of someone he’s placed in your life. Thank him, and then say, his steadfast love endures forever.", "Think of a hard time he’s brought you through. Thank him, and say it again, his steadfast love endures forever.", "Notice how the refrain holds everything together. It isn’t about the day or the season. It’s about who he is.", "Let this truth settle deeper. Thank you, Lord. Amen."]}, {"devTitle": "Every Good Gift", "intro": "James was a leader in the early church. He wrote this letter to Christians scattered in many places.", "devLong": ["It’s easy to credit good things to luck or effort. We got the job because we worked hard. We got through the season because we were strong. James offers a different lens.", "Every good gift and every perfect gift is from above, and comes down from the Father of lights. Whatever is good in our lives traces back to him, even when other people or our own work were part of how it arrived.", "James adds something about God’s character: with whom there is no variation or shadow of turning. Light sources in the world shift, shadows move. But God doesn’t change. The Giver is steady.", "That gives gratitude a firm footing. We’re not thanking a changing, unreliable source. We’re thanking a Father whose goodness is constant.", "Today, trace three good things in your life back to him. Don’t rush it. Let each one lead you to the Giver."], "prayShort": ["Take a slow breath. Think of three good things in your life.", "Father, every good thing in my life comes from you. Thank you.", "You don’t change. I trust your goodness. Amen."], "prayLong": ["Sit quietly. Think about the good things in your life, and let them come one at a time.", "Imagine each good thing as a small light. When you trace each one back, they all lead to the same source, the Father of lights.", "Father, thank you for every good gift. I name three now, as specifically as I can.", "I confess that I’ve often credited luck or my own effort. Forgive me for the times I forgot the Giver.", "Thank you that you don’t change. Your goodness doesn’t come and go with my circumstances.", "Help me to notice your gifts in ordinary places, and to thank you for them as they come.", "Rest in his steady goodness. Thank you, Father. Amen."]}], "Forgiveness": [{"devTitle": "Forgive as You Were Forgiven", "intro": "Paul wrote this letter to the church in Ephesus, teaching them how to live as followers of Christ.", "devLong": ["Bitterness rarely announces itself. It starts as a small hurt we don’t deal with, and slowly settles in. Before long it colors how we see the person, and sometimes how we see ourselves.", "In Ephesians 4, Paul lists what to remove: all bitterness, rage, anger, shouting and slander, along with all malice. It’s a long list, and it names the ways resentment can show up, from quiet coldness to open outbursts.", "Then he replaces it. Be kind to one another, tender-hearted, forgiving each other. And he gives the measure: just as God also in Christ forgave you.", "That changes where forgiveness starts. We don’t forgive because the other person has earned it, or because we feel like it. We forgive from what we’ve already received. God forgave us at great cost, and we can pass that on.", "Is there someone you’ve been holding at a distance? Today, tell God honestly how you feel, and ask him to soften your heart toward them."], "prayShort": ["Take a slow breath. Think of someone you find it hard to forgive.", "Lord, you’ve forgiven me so much. Help me forgive the way you did.", "Soften my heart. Take out the bitterness, and make me kind. Amen."], "prayLong": ["Sit quietly. Let your breathing slow. Think of someone who hurt you, and let their face come to mind.", "Imagine a heavy chain, with one end around your wrist and the other end around theirs. You’ve been dragging it with you for a long time.", "Lord, thank you for forgiving me in Christ. I don’t deserve it, and you gave it freely. Let me remember how much I’ve been forgiven.", "Here is what happened, and how it hurt me. Tell him plainly. He isn’t shocked, and he doesn’t minimize it.", "I confess the bitterness I’ve been holding. I’ve replayed it and kept it close. I don’t want to carry it anymore.", "I choose to begin forgiving, even if my feelings haven’t caught up. Make me kind and tender-hearted toward them, as you’ve been toward me.", "Release me from the chain, Lord. Give me the strength to let go. Thank you. Amen."]}, {"devTitle": "Bearing With One Another", "intro": "Paul wrote this letter to the church in Colossae, encouraging them in their new life in Christ.", "devLong": ["Living with other people means being disappointed by them. It happens in families, friendships, workplaces and churches. Colossians 3 doesn’t pretend otherwise.", "Paul first describes the kind of people God’s chosen ones should be: clothed with a heart of compassion, kindness, humility, gentleness and patience. They’re qualities we put on, like clothes.", "Then he says, bearing with one another, and forgiving each other, if any man has a complaint against any. Notice that he assumes there will be complaints. Forgiveness isn’t for when everything is fine. It’s for when someone has genuinely wronged us.", "And the measure again: even as Christ forgave you, so you also do. Our forgiveness follows his.", "Think of someone whose behavior you’re finding hard to bear. Ask God for the kind of patience Paul describes, and for a willingness to let the complaint go."], "prayShort": ["Take a slow breath. Think of someone who’s been hard to be around.", "Lord, clothe me with kindness and patience today. Help me bear with others.", "Help me forgive as you forgave me. Amen."], "prayLong": ["Sit still and breathe slowly. Imagine getting dressed in the morning, putting on each item one by one.", "Now imagine putting on compassion, kindness, humility, gentleness and patience, as if they were clothes laid out for you.", "Lord, thank you for choosing me, and for loving me. Because of that, I can offer the same to others.", "Here is someone I find difficult. Name them to him. Here is what they do that wears on me.", "Help me to bear with them. I don’t want to pretend there’s no problem, but I don’t want to be ruled by it.", "Where I have a real complaint, help me to forgive. Where I’m the one who’s been hard to live with, forgive me.", "Thank you that you forgave me first. Let that be what I draw from today. Amen."]}, {"devTitle": "Not Seven Times", "intro": "This is part of Jesus’ teaching in Matthew’s Gospel about how his followers should treat one another.", "devLong": ["Peter asks a practical question. How often shall my brother sin against me, and I forgive him? Until seven times? He may have thought seven was generous, since it’s more than most people would offer.", "Jesus answers: I don’t tell you until seven times, but until seventy times seven. The exact number isn’t the point. Jesus is saying that forgiveness isn’t something to count out.", "If we’re keeping a tally, we’re still treating forgiveness as a limited resource, something we’ll give a certain number of times before we stop. Jesus calls us to a different way of living.", "That doesn’t mean pretending hurt doesn’t matter, or ignoring real wrongs. It means that we don’t hold on to a score. We choose to release, again and again.", "If you’re keeping count with someone today, bring it to God. Ask him for the grace to stop counting."], "prayShort": ["Take a slow breath. Ask yourself if you’re keeping a tally.", "Lord, help me stop counting. Give me your heart for those who’ve hurt me.", "Teach me to forgive again and again. Amen."], "prayLong": ["Sit still. Imagine a notebook where you’ve been recording someone’s wrongs, with dates and details.", "Imagine Jesus quietly closing the notebook. He isn’t saying the wrongs weren’t real. He’s saying you don’t have to keep the record.", "Lord, thank you that you don’t keep a tally of my failures. You forgive me again and again, and I’m so grateful.", "Here is where I’ve been counting. Name it to him. Here is what I’ve kept score of.", "I want to be someone who forgives freely. Not because the other person has earned it, but because you’ve given me so much.", "Help me to release this, not just once, but each time it comes back. When the memory returns, remind me that I’ve given it to you.", "Give me your heart for them. Amen."]}, {"devTitle": "As Far as the East Is from the West", "intro": "This psalm is attributed to David. It praises God for his mercy and forgiveness.", "devLong": ["Some of us find it easier to forgive others than to believe we’ve been forgiven. We replay our failures and wonder whether God has really let them go.", "Psalm 103 speaks into that. It says the Lord is merciful and gracious, slow to anger, and abundant in loving kindness. He will not always accuse, and he won’t keep his anger forever.", "Then comes a clear statement: he has not dealt with us according to our sins, nor repaid us for our iniquities. We’re not treated as our sins deserve.", "And the image in verse 12: as far as the east is from the west, so far has he removed our transgressions from us. East and west never meet. There’s no way to measure the distance, because it has no end.", "If you’re carrying guilt today, bring it to him. Read verse 12 slowly, and let it be true for you. Then ask him to help you forgive others with the same generosity."], "prayShort": ["Take a slow breath. Think of what you’re still carrying guilt over.", "Lord, you don’t treat me as my sins deserve. Thank you for removing them as far as east is from west.", "Help me to forgive others as you’ve forgiven me. Amen."], "prayLong": ["Sit quietly. Imagine standing on a hill, looking east. The horizon stretches out in front of you.", "Now imagine turning to face west. You can’t see both at once. They’re as far apart as two directions can be.", "Lord, thank you that you’re merciful and gracious, slow to anger and full of loving kindness. I praise you for who you are.", "Here is what I’ve been carrying guilt about. Tell him plainly. He already knows, and he isn’t surprised.", "I receive your forgiveness now. You have removed my sin from me, as far as the east is from the west. I let myself believe it.", "Where I’ve held onto my failures, help me to put them down. Where I’ve held onto someone else’s, help me to put those down too.", "Thank you for your mercy. Amen."]}, {"devTitle": "The Father Who Runs", "intro": "This is part of a story Jesus told in Luke’s Gospel about a father and his younger son.", "devLong": ["In Jesus’ story, the younger son asks for his share of the inheritance, leaves home, and wastes it. When he’s at the lowest point, he decides to go back, and he rehearses what he’ll say.", "Luke 15:20 tells us what happens next. While he was still far off, his father saw him, and was moved with compassion, and ran, and fell on his neck, and kissed him. The father wasn’t waiting with folded arms. He ran.", "The son starts his speech, but the father interrupts it. He calls for the best robe, a ring and sandals, and says to bring the fattened calf. They’re going to celebrate. The son was dead, and is alive again. He was lost, and is found.", "This is how Jesus describes God’s forgiveness. He doesn’t wait for a perfect apology or a long period of penance. He meets us on the road, with arms open.", "If you’ve been staying away because you’re ashamed, come home. And if someone you know is trying to come back to you, think about how you might run to meet them."], "prayShort": ["Take a slow breath. Picture the father running down the road.", "Father, thank you for running to meet me. I’m coming home.", "Help me to welcome others the way you welcome me. Amen."], "prayLong": ["Sit still. Imagine a long road leading up to a house. You’re walking up it, tired and dusty, rehearsing what you’ll say.", "In the distance, someone is looking down the road. He sees you, and he starts to run.", "Father, thank you that you don’t wait for me to clean myself up. You run to meet me. I praise you for your compassion.", "Here is what I’ve been ashamed of. Say it to him now. You don’t need to rehearse. He’s already embracing you.", "Thank you for the robe, the ring and the welcome. I don’t have to earn my place. I’m your child.", "Where I’ve been like the son, help me to come home. Where I’ve been like the father, help me to run toward others.", "Think of someone you could welcome back. Ask him to give you his heart for them.", "Rest in his embrace for a moment. Thank you, Father. Amen."]}, {"devTitle": "Agreeing with God", "intro": "John wrote this letter to Christians to help them walk in the light and be sure of their relationship with God.", "devLong": ["Confession can sound heavy, like something we do reluctantly. 1 John 1 puts it in a different light.", "John begins with honesty. If we say that we have no sin, we deceive ourselves, and the truth isn’t in us. Pretending we’re fine doesn’t help us. It only keeps us hidden.", "Then comes the promise. If we confess our sins, he is faithful and righteous to forgive us the sins, and to cleanse us from all unrighteousness. The word faithful matters. God forgives because he has promised to, and he keeps his promises.", "To confess means to say the same thing as God, to agree with him about what’s true. We name what we’ve done, without excuses, and we trust his promise to forgive and cleanse.", "Today, take a moment to confess honestly. Say it plainly, and then rest in what he’s promised. He is faithful."], "prayShort": ["Take a slow breath. Be honest with God about where you’ve fallen short.", "Lord, I confess my sin to you. I won’t make excuses.", "Thank you for being faithful to forgive and to cleanse me. Amen."], "prayLong": ["Sit quietly. Imagine standing in a bright room where nothing is hidden. It isn’t frightening. It’s clean.", "Lord, you are light. I praise you for being faithful, and for being righteous, and for keeping every promise you’ve made.", "I won’t pretend I have no sin. I confess it now. Tell him specifically where you’ve fallen short, in what you’ve done, said or thought.", "I’m not making excuses. I’m agreeing with you about what’s true.", "Thank you for your promise. If we confess, you forgive and cleanse us. I receive that. I’m forgiven.", "Where I keep returning to the same sin, give me strength to walk differently. Where I’m still ashamed, remind me of your promise.", "Cleanse me, Lord, and make me new. Amen."]}, {"devTitle": "Father, Forgive Them", "intro": "This passage is from Luke’s account of Jesus’ crucifixion.", "devLong": ["It’s hard to imagine a more painful moment. Jesus has been nailed to a cross. He is surrounded by people who mocked him and by soldiers carrying out their orders.", "And in Luke 23:34, Jesus prays: Father, forgive them, for they don’t know what they are doing. He prays for the people responsible for his suffering.", "Notice when he prays it. No one has apologized. No one has asked for forgiveness. He offers it in the middle of his pain.", "This doesn’t mean wrongs don’t matter, or that injustice is excused. It shows how far forgiveness can reach. It’s also the source of our own forgiveness. We’re forgiven because of what he did, not because we earned it.", "If there’s someone you’re struggling to forgive, try praying this prayer for them. You may not feel it at first. Start by saying the words, and ask Jesus to help you mean them."], "prayShort": ["Take a slow breath. Think of someone who has hurt you.", "Jesus, you forgave those who hurt you most. Help me follow you.", "Father, forgive them. And help me to forgive. Amen."], "prayLong": ["Sit quietly. Picture the scene slowly, without rushing. A hill, a crowd, and Jesus on the cross.", "Hear him say, Father, forgive them, for they don’t know what they are doing.", "Jesus, thank you for what you did for me. You didn’t wait for me to deserve it. You gave your life freely.", "I praise you for your mercy, and for your strength in the middle of suffering.", "Here is someone who’s hurt me. Name them to him. Here is how deep it went.", "I don’t know if I can forgive them yet. But I want to follow you. I pray the words you prayed. Father, forgive them.", "Give me the strength to forgive what feels too big. Do in me what I can’t do myself.", "Thank you, Jesus. Amen."]}], "Patience": [{"devTitle": "Wait for the Lord", "intro": "This psalm is attributed to David. It ends with a call to wait on the Lord.", "devLong": ["Waiting is hard because it feels like nothing is happening. We pray, and the situation stays the same. We’re tempted to take over, to push, or to give up.", "Psalm 27 ends with a different response. David says he would have despaired unless he had believed that he would see the goodness of the Lord in the land of the living. His hope isn’t a vague feeling. It’s a belief that God’s goodness will show up.", "Then he turns to his own heart and gives it instructions. Wait for the Lord. Be strong, and let your heart take courage. Yes, wait for the Lord. He says wait twice, as if to underline it.", "Waiting here isn’t passive. It takes strength and courage. It means staying where we are, trusting that God hasn’t forgotten, and refusing to settle for less than what he’s promised.", "What are you waiting for? Tell God honestly how it feels, and ask him for strength to keep waiting well."], "prayShort": ["Take a slow breath. Name what you’re waiting for.", "Lord, I’m waiting. Give me strength and courage while I do.", "I believe I wi
